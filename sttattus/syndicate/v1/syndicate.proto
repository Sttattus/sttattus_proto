syntax = "proto3";

package sttattus.syndicate.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Sttattus/backend_go/gen/proto/sttattus/syndicate/v1;syndicatev1";

// SyndicateService powers Pillar 17: Syndicate (Co-Investment Deal Rooms, SPV Governance & Capital Calls).
service SyndicateService {
  rpc GetSyndicateStats(GetSyndicateStatsRequest) returns (GetSyndicateStatsResponse);
  rpc ListSpvCommitments(ListSpvCommitmentsRequest) returns (ListSpvCommitmentsResponse);
  rpc RecordSpvCommitment(RecordSpvCommitmentRequest) returns (RecordSpvCommitmentResponse);
  rpc ListDealRooms(ListDealRoomsRequest) returns (ListDealRoomsResponse);
  rpc JoinDealRoom(JoinDealRoomRequest) returns (JoinDealRoomResponse);
  rpc CreateProfileShare(CreateProfileShareRequest) returns (CreateProfileShareResponse);
  rpc ListMyProfileShares(ListMyProfileSharesRequest) returns (ListMyProfileSharesResponse);
  rpc RevokeProfileShare(RevokeProfileShareRequest) returns (RevokeProfileShareResponse);

  // Choices SYN1-SYN12 Workbench & Mutation RPCs
  rpc GetSyndicateChoiceWorkbench(GetSyndicateChoiceWorkbenchRequest) returns (GetSyndicateChoiceWorkbenchResponse);
  rpc SaveSyndicateChoiceRecord(SaveSyndicateChoiceRecordRequest) returns (SaveSyndicateChoiceRecordResponse);
  rpc AdjudicateSyndicateChoiceGovernance(AdjudicateSyndicateChoiceGovernanceRequest) returns (AdjudicateSyndicateChoiceGovernanceResponse);
}

message SyndicateStats {
  string user_id = 1;
  double syndicate_score = 2;
  string standing_tier = 3;
  int32 active_spvs_count = 4;
  int32 verified_capital_calls_count = 5;
  int32 active_deal_rooms = 6;
  double total_committed_capital_usd = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SpvCommitment {
  string id = 1;
  string user_id = 2;
  string spv_name = 3;
  string target_company = 4;
  string series_or_tranche = 5;
  string role = 6;
  double committed_usd = 7;
  double called_usd = 8;
  string kyc_qp_status = 9;
  string wire_verification_ref = 10;
  google.protobuf.Timestamp created_at = 11;
}

message DealRoom {
  string id = 1;
  string slug = 2;
  string title = 3;
  string lead_sponsor = 4;
  string sector = 5;
  string stage = 6;
  double target_raise_usd = 7;
  bool nda_watermarked = 8;
  bool joined = 9;
  google.protobuf.Timestamp closes_at = 10;
}

message ProfileShare {
  string id = 1;
  string token = 2;
  string share_url = 3;
  string label = 4;
  bool include_qp_badge = 5;
  bool revoked = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ChoiceRecord {
  string id = 1;
  int32 choice_number = 2;
  string table_tier = 3;
  string title = 4;
  string subtitle = 5;
  string status = 6;
  string verification_state = 7;
  double metric_value = 8;
  string metric_unit = 9;
  string citation_or_hash = 10;
  string notes = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetSyndicateStatsRequest {}

message GetSyndicateStatsResponse {
  SyndicateStats stats = 1;
}

message ListSpvCommitmentsRequest {
  int32 limit = 1;
}

message ListSpvCommitmentsResponse {
  repeated SpvCommitment commitments = 1;
}

message RecordSpvCommitmentRequest {
  string spv_name = 1;
  string target_company = 2;
  string series_or_tranche = 3;
  string role = 4;
  double committed_usd = 5;
  double called_usd = 6;
  string wire_verification_ref = 7;
}

message RecordSpvCommitmentResponse {
  SpvCommitment commitment = 1;
  double updated_syndicate_score = 2;
}

message ListDealRoomsRequest {
  string sector = 1;
}

message ListDealRoomsResponse {
  repeated DealRoom rooms = 1;
}

message JoinDealRoomRequest {
  string room_id = 1;
  string accreditation_attestation = 2;
}

message JoinDealRoomResponse {
  DealRoom room = 1;
  double updated_syndicate_score = 2;
}

message CreateProfileShareRequest {
  string label = 1;
  bool include_qp_badge = 2;
  int32 expires_in_days = 3;
}

message CreateProfileShareResponse {
  ProfileShare share = 1;
}

message ListMyProfileSharesRequest {}

message ListMyProfileSharesResponse {
  repeated ProfileShare shares = 1;
}

message RevokeProfileShareRequest {
  string share_id = 1;
}

message RevokeProfileShareResponse {
  bool revoked = 1;
}

message GetSyndicateChoiceWorkbenchRequest {
  int32 choice_number = 1;
}

message GetSyndicateChoiceWorkbenchResponse {
  int32 choice_number = 1;
  string choice_code = 2;
  string choice_title = 3;
  string choice_summary = 4;
  string primary_table_name = 5;
  string secondary_table_name = 6;
  string governance_table_name = 7;
  repeated ChoiceRecord primary_records = 8;
  repeated ChoiceRecord secondary_records = 9;
  repeated ChoiceRecord governance_records = 10;
}

message SaveSyndicateChoiceRecordRequest {
  int32 choice_number = 1;
  string table_tier = 2;
  string record_id = 3;
  string title = 4;
  string subtitle = 5;
  string status = 6;
  double metric_value = 7;
  string metric_unit = 8;
  string citation_or_hash = 9;
  string notes = 10;
}

message SaveSyndicateChoiceRecordResponse {
  ChoiceRecord record = 1;
  double updated_syndicate_score = 2;
}

message AdjudicateSyndicateChoiceGovernanceRequest {
  int32 choice_number = 1;
  string record_id = 2;
  string decision = 3;
  string rationale = 4;
  string citation_or_hash = 5;
}

message AdjudicateSyndicateChoiceGovernanceResponse {
  ChoiceRecord governance_record = 1;
}
