syntax = "proto3";

package sttattus.muse.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Sttattus/backend_go/gen/proto/sttattus/muse/v1;musev1";

// MuseService powers Pillar 13: Muse (Cultural Patronage, Fine Art Provenance & Salon Curation).
service MuseService {
  // Phase 0-4 Baseline RPCs
  rpc GetMuseStats(GetMuseStatsRequest) returns (GetMuseStatsResponse);
  rpc ListCollectionWorks(ListCollectionWorksRequest) returns (ListCollectionWorksResponse);
  rpc RegisterCollectionWork(RegisterCollectionWorkRequest) returns (RegisterCollectionWorkResponse);
  rpc ListSalonsAndLoans(ListSalonsAndLoansRequest) returns (ListSalonsAndLoansResponse);
  rpc EnrollSalonOrLoan(EnrollSalonOrLoanRequest) returns (EnrollSalonOrLoanResponse);
  rpc CreateProfileShare(CreateProfileShareRequest) returns (CreateProfileShareResponse);
  rpc ListMyProfileShares(ListMyProfileSharesRequest) returns (ListMyProfileSharesResponse);
  rpc RevokeProfileShare(RevokeProfileShareRequest) returns (RevokeProfileShareResponse);

  // Choices M1-M12 Workbench & Mutation RPCs
  rpc GetMuseChoiceWorkbench(GetMuseChoiceWorkbenchRequest) returns (GetMuseChoiceWorkbenchResponse);
  rpc SaveMuseChoiceRecord(SaveMuseChoiceRecordRequest) returns (SaveMuseChoiceRecordResponse);
  rpc AdjudicateMuseChoiceGovernance(AdjudicateMuseChoiceGovernanceRequest) returns (AdjudicateMuseChoiceGovernanceResponse);
}

message MuseStats {
  string user_id = 1;
  double muse_score = 2;
  string standing_tier = 3;
  int32 total_works_count = 4;
  int32 verified_provenance_count = 5;
  int32 active_loans_and_salons = 6;
  double total_insured_valuation_usd = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CollectionWork {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string artist_name = 4;
  string creation_year = 5;
  string medium = 6;
  string dimensions = 7;
  double insured_valuation_usd = 8;
  string provenance_status = 9;
  string custody_location = 10;
  string c2pa_manifest_hash = 11;
  string image_url = 12;
  google.protobuf.Timestamp created_at = 13;
}

message SalonOrLoan {
  string id = 1;
  string slug = 2;
  string title = 3;
  string institution_or_host = 4;
  string city = 5;
  string category = 6;
  string status = 7;
  bool immunity_from_seizure = 8;
  bool enrolled = 9;
  google.protobuf.Timestamp starts_at = 10;
}

message ProfileShare {
  string id = 1;
  string token = 2;
  string share_url = 3;
  string label = 4;
  bool include_valuation_band = 5;
  bool revoked = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ChoiceRecord {
  string id = 1;
  int32 choice_number = 2;
  string table_tier = 3;
  string title = 4;
  string subtitle = 5;
  string status = 6;
  string verification_state = 7;
  double metric_value = 8;
  string metric_unit = 9;
  string citation_or_hash = 10;
  string notes = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetMuseStatsRequest {}

message GetMuseStatsResponse {
  MuseStats stats = 1;
}

message ListCollectionWorksRequest {
  int32 limit = 1;
}

message ListCollectionWorksResponse {
  repeated CollectionWork works = 1;
}

message RegisterCollectionWorkRequest {
  string title = 1;
  string artist_name = 2;
  string creation_year = 3;
  string medium = 4;
  string dimensions = 5;
  double insured_valuation_usd = 6;
  string custody_location = 7;
  string c2pa_manifest_hash = 8;
  string image_url = 9;
}

message RegisterCollectionWorkResponse {
  CollectionWork work = 1;
  double updated_muse_score = 2;
}

message ListSalonsAndLoansRequest {
  string category = 1;
}

message ListSalonsAndLoansResponse {
  repeated SalonOrLoan items = 1;
}

message EnrollSalonOrLoanRequest {
  string item_id = 1;
  string notes = 2;
}

message EnrollSalonOrLoanResponse {
  SalonOrLoan item = 1;
  double updated_muse_score = 2;
}

message CreateProfileShareRequest {
  string label = 1;
  bool include_valuation_band = 2;
  int32 expires_in_days = 3;
}

message CreateProfileShareResponse {
  ProfileShare share = 1;
}

message ListMyProfileSharesRequest {}

message ListMyProfileSharesResponse {
  repeated ProfileShare shares = 1;
}

message RevokeProfileShareRequest {
  string share_id = 1;
}

message RevokeProfileShareResponse {
  bool revoked = 1;
}

message GetMuseChoiceWorkbenchRequest {
  int32 choice_number = 1;
}

message GetMuseChoiceWorkbenchResponse {
  int32 choice_number = 1;
  string choice_code = 2;
  string choice_title = 3;
  string choice_summary = 4;
  string primary_table_name = 5;
  string secondary_table_name = 6;
  string governance_table_name = 7;
  repeated ChoiceRecord primary_records = 8;
  repeated ChoiceRecord secondary_records = 9;
  repeated ChoiceRecord governance_records = 10;
}

message SaveMuseChoiceRecordRequest {
  int32 choice_number = 1;
  string table_tier = 2;
  string record_id = 3;
  string title = 4;
  string subtitle = 5;
  string status = 6;
  double metric_value = 7;
  string metric_unit = 8;
  string citation_or_hash = 9;
  string notes = 10;
}

message SaveMuseChoiceRecordResponse {
  ChoiceRecord record = 1;
  double updated_muse_score = 2;
}

message AdjudicateMuseChoiceGovernanceRequest {
  int32 choice_number = 1;
  string record_id = 2;
  string decision = 3;
  string rationale = 4;
  string citation_or_hash = 5;
}

message AdjudicateMuseChoiceGovernanceResponse {
  ChoiceRecord governance_record = 1;
}
