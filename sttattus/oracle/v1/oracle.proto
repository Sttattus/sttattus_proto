syntax = "proto3";

package sttattus.oracle.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/oracle/v1;oraclev1";

// StrategicDomain defines the elite intellectual field.
enum StrategicDomain {
  STRATEGIC_DOMAIN_UNSPECIFIED = 0;
  STRATEGIC_DOMAIN_GEOPOLITICS = 1;
  STRATEGIC_DOMAIN_MACRO_ECONOMICS = 2;
  STRATEGIC_DOMAIN_BIO_ETHICS = 3;
  STRATEGIC_DOMAIN_VENTURE_ENGINEERING = 4;
}

// DepthGrading represents the AI-verified quality of an intellectual inquiry.
message DepthGrading {
  double complexity_score = 1; // 0.0 - 1.0 (Structural complexity)
  double synthesis_score = 2; // 0.0 - 1.0 (Cross-pillar integration)
  double foresight_score = 3; // 0.0 - 1.0 (Strategic anticipation)
  string feedback_summary = 4; // AI feedback on inquiry quality
}

// StrategicInsight represents a high-value piece of intelligence.
message StrategicInsight {
  string id = 1;
  string title = 2;
  string content = 3;
  StrategicDomain domain = 4;
  DepthGrading grading = 5;
  google.protobuf.Timestamp discovered_at = 6;
}

message OracleStats {
  string user_id = 1;
  double intellectual_rank = 2; // 1-100 normalized
  string rank_label = 3; // e.g., 'Analyst', 'Strategist', 'Sovereign Oracle'
  int32 total_clout_earned = 4;
  map<int32, double> domain_mastery = 5; // StrategicDomain (as int) -> Mastery %
}

// REQ/RES
message QueryRequest {
  string prompt = 1;
  bool enable_synthesis = 2; // If true, AI attempts to cross-reference all 12 pillars
}

message QueryResponse {
  string response = 1;
  StrategicInsight insight = 2;
  OracleStats stats = 3;
}

message GetOracleStatsRequest {
  string user_id = 1;
}
message GetOracleStatsResponse {
  OracleStats stats = 1;
}

// === O13.7 — glass-box rank explainer ===

// RankExplainer is the per-user breakdown the explainer page renders.
// All four numbers are real averages over the user's past inquiries;
// the formula the engine uses lives in services_rust/oracle (when
// wired) and is documented here as the contract.
message RankExplainer {
  double intellectual_rank = 1; // composite score 0..1000+
  string rank_label = 2;
  double avg_complexity = 3; // 0..1
  double avg_synthesis = 4; // 0..1
  double avg_foresight = 5; // 0..1
  int32 unique_domains_visited = 6;
  int32 total_inquiries = 7;
  map<string, double> per_domain_clout = 8; // 'macro_economics' -> total
}

message GetRankExplainerRequest {}
message GetRankExplainerResponse {
  RankExplainer explainer = 1;
}

// === O13.5 — first two agents: Vault + Forge ===

// ToolDescriptor lists a runnable tool — pillar + name + a
// human-readable description and input hint. The future LLM (O13.2
// deferral) reads this catalog to pick tools; today the Flutter
// scope page surfaces it so users can see what Oracle can call.
message OracleTool {
  string pillar = 1;
  string name = 2;
  string description = 3;
  string input_hint = 4;
}

message ListAvailableToolsRequest {}
message ListAvailableToolsResponse {
  repeated OracleTool tools = 1;
}

// RunOracleTool — the user (or a future LLM) invokes a named tool
// against their own data, gated by scope grants (O13.4). Returns
// the tool body as a pre-serialized JSON string; the client/LLM
// renders it verbatim.
message RunOracleToolRequest {
  string tool_name = 1;
  map<string, string> args = 2;
}
message RunOracleToolResponse {
  string tool_name = 1;
  string body_json = 2;
}

// === O13.4 — per-pillar scope grants ===

// ScopeGrant records that the user has opted Oracle into reading
// from a given pillar. Absent rows = "not granted" (the agent
// layer must refuse to call the pillar's tools).
message ScopeGrant {
  string pillar = 1;
  bool granted = 2;
  int64 updated_unix = 3;
}

message ListMyScopeGrantsRequest {}
message ListMyScopeGrantsResponse {
  repeated ScopeGrant grants = 1; // includes ALL known pillars, granted true/false
}

message GrantScopeRequest {
  string pillar = 1;
}
message GrantScopeResponse {
  ScopeGrant grant = 1;
}

message RevokeScopeRequest {
  string pillar = 1;
}
message RevokeScopeResponse {
  ScopeGrant grant = 1; // returns the pillar with granted=false
}

// === O13.3 — memory store (episodic + semantic) ===

message EpisodicMemory {
  string id = 1;
  string source = 2; // 'oracle' | 'user' | 'system'
  string body = 3;
  int64 occurred_unix = 4;
}

message SemanticMemory {
  string id = 1;
  string key = 2;
  string value = 3;
  string source = 4;
  int64 updated_unix = 5;
}

message RecordEpisodicMemoryRequest {
  string source = 1;
  string body = 2;
  int64 occurred_unix = 3; // optional; 0 == now
}
message RecordEpisodicMemoryResponse {
  EpisodicMemory memory = 1;
}

message ListMyEpisodicMemoryRequest {
  int32 limit = 1; // 0 == default 100
}
message ListMyEpisodicMemoryResponse {
  repeated EpisodicMemory memories = 1;
}

message DeleteEpisodicMemoryRequest {
  string memory_id = 1;
}
message DeleteEpisodicMemoryResponse {}

message UpsertSemanticMemoryRequest {
  string key = 1;
  string value = 2;
  string source = 3;
}
message UpsertSemanticMemoryResponse {
  SemanticMemory memory = 1;
}

message ListMySemanticMemoryRequest {}
message ListMySemanticMemoryResponse {
  repeated SemanticMemory memories = 1;
}

message DeleteSemanticMemoryRequest {
  string memory_id = 1;
}
message DeleteSemanticMemoryResponse {}

// === O13.2 — multi-thread chat + streaming responses ===

message OracleThread {
  string id = 1;
  string title = 2;
  int64 created_unix = 3;
  int64 updated_unix = 4;
}

message OracleThreadMessage {
  string id = 1;
  string thread_id = 2;
  string prompt = 3;
  string response = 4;
  StrategicDomain domain = 5;
  int64 created_unix = 6;
  double complexity_score = 7;
  double synthesis_score = 8;
  double foresight_score = 9;
}

message ListMyThreadsRequest {}
message ListMyThreadsResponse {
  repeated OracleThread threads = 1;
}

message CreateThreadRequest {
  string title = 1;
}
message CreateThreadResponse {
  OracleThread thread = 1;
}

message RenameThreadRequest {
  string thread_id = 1;
  string title = 2;
}
message RenameThreadResponse {
  OracleThread thread = 1;
}

message DeleteThreadRequest {
  string thread_id = 1;
}
message DeleteThreadResponse {}

message ListThreadMessagesRequest {
  string thread_id = 1;
}
message ListThreadMessagesResponse {
  repeated OracleThreadMessage messages = 1;
}

// Streaming server-side query. Each chunk carries a text delta;
// final chunk carries done=true plus the persisted message id.
// Stream is bounded by the response length — no need to manage
// keepalive. When the underlying model client is unavailable the
// server emits one chunk with err='unavailable' and closes.
message StreamQueryRequest {
  string thread_id = 1; // empty == start a new thread
  string prompt = 2;
  bool enable_synthesis = 3;
}

message StreamQueryResponse {
  string thread_id = 1;
  string delta = 2;
  bool done = 3;
  string message_id = 4;
  string err = 5;
}

// === O1 (Phase 1) — daily synthesis briefing ===

// BriefingLine is one pillar's contribution to the morning briefing —
// only granted scopes appear. The score is read straight off the
// cross-pillar standings table (hub_user_sttattus.<pillar>_score).
message BriefingLine {
  string pillar = 1;
  string headline = 2;
  double score = 3;
}

message GetTodayBriefingRequest {}
message GetTodayBriefingResponse {
  string briefing = 1; // the synthesized prose (Gemini, or deterministic fallback)
  repeated BriefingLine lines = 2; // per-granted-pillar standing
  int32 granted_count = 3; // how many pillar scopes are granted
  int64 generated_unix = 4;
  bool ai_generated = 5; // true when the prose came from the model, false for the deterministic path
}

// === O2 (Phase 2) — proactive triggers + inbox ===

// OracleTrigger is a user-defined threshold over a pillar score. When the
// score crosses it, the trigger fires into the inbox. comparator is
// 'below' | 'above'.
message OracleTrigger {
  string id = 1;
  string pillar = 2;
  string comparator = 3;
  double threshold = 4;
  string label = 5;
  bool active = 6;
  int64 created_unix = 7;
}

message CreateTriggerRequest {
  string pillar = 1;
  string comparator = 2; // below | above
  double threshold = 3;
  string label = 4;
}
message CreateTriggerResponse {
  OracleTrigger trigger = 1;
}

message ListMyTriggersRequest {}
message ListMyTriggersResponse {
  repeated OracleTrigger triggers = 1;
}

message DeleteTriggerRequest {
  string trigger_id = 1;
}
message DeleteTriggerResponse {}

// InboxItem is a currently-firing trigger — evaluated live against the
// pillar score at read time (no background job; the inbox is a query).
message InboxItem {
  string trigger_id = 1;
  string pillar = 2;
  string label = 3;
  string message = 4;
  double current_score = 5;
  double threshold = 6;
  string comparator = 7;
}

message GetInboxRequest {}
message GetInboxResponse {
  repeated InboxItem items = 1;
}

// === O2 (Phase 2) — long-form drafter (outputs that persist beyond chat) ===

message OracleDocument {
  string id = 1;
  string title = 2;
  string body = 3;
  string kind = 4; // brief | memo | plan
  int64 created_unix = 5;
  int64 updated_unix = 6;
}

message CreateDocumentRequest {
  string title = 1;
  string body = 2;
  string kind = 3;
}
message CreateDocumentResponse {
  OracleDocument document = 1;
}

message ListMyDocumentsRequest {}
message ListMyDocumentsResponse {
  repeated OracleDocument documents = 1; // body omitted in list (preview only)
}

message GetDocumentRequest {
  string document_id = 1;
}
message GetDocumentResponse {
  OracleDocument document = 1;
}

message UpdateDocumentRequest {
  string document_id = 1;
  string title = 2;
  string body = 3;
}
message UpdateDocumentResponse {
  OracleDocument document = 1;
}

message DeleteDocumentRequest {
  string document_id = 1;
}
message DeleteDocumentResponse {}

// DraftDocument asks Oracle to draft a long-form document from a prompt and
// persists it. AI-backed (Gemini) with an honest 'unavailable' err when the
// key is absent — a drafter is only honest when it actually drafts.
message DraftDocumentRequest {
  string prompt = 1;
  string kind = 2; // brief | memo | plan
}
message DraftDocumentResponse {
  OracleDocument document = 1;
  string err = 2; // 'unavailable' when the model is not configured
}

// === O3 (Phase 3) — Sovereign concierge desk ===

message ConciergeThread {
  string id = 1;
  string subject = 2;
  string status = 3; // open | answered | closed
  int64 sla_due_unix = 4;
  int64 created_unix = 5;
  int64 updated_unix = 6;
}

message ConciergeMessage {
  string id = 1;
  string sender = 2; // user | concierge | system
  string body = 3;
  int64 created_unix = 4;

  // The concierge who wrote it. Empty for member and system messages, and
  // for replies written before authorship was recorded.
  //
  // Every desk on the platform answered as an anonymous "STAFF" until
  // 2026-08-23; lexicon's tutor desk had carried a name since migration 0079
  // and was the only one. A white-glove desk that will not say who is
  // speaking is not white-glove.
  string author_name = 5;
}

message StartConciergeThreadRequest {
  string subject = 1;
  string opening_message = 2;
}
message StartConciergeThreadResponse {
  ConciergeThread thread = 1;
}

message ListMyConciergeThreadsRequest {}
message ListMyConciergeThreadsResponse {
  repeated ConciergeThread threads = 1;
}

message GetConciergeThreadRequest {
  string thread_id = 1;
}
message GetConciergeThreadResponse {
  ConciergeThread thread = 1;
  repeated ConciergeMessage messages = 2;
}

message PostConciergeMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// === O3 (Phase 3) — editorial Anthology ===

message AnthologyArticle {
  string id = 1;
  string title = 2;
  string dek = 3;
  string body = 4;
  string author_name = 5;
  string author_title = 6;
  bool sovereign_only = 7;
  int64 published_unix = 8;
}

message ListAnthologyArticlesRequest {}
message ListAnthologyArticlesResponse {
  repeated AnthologyArticle articles = 1; // body omitted in list
}

message GetAnthologyArticleRequest {
  string article_id = 1;
}
message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// === O3 (Phase 3) — shared brief (token, time-bound, revocable) ===

message BriefShare {
  string token = 1;
  string document_id = 2;
  string url = 3;
  int64 expires_unix = 4;
  bool revoked = 5;
}

message CreateBriefShareRequest {
  string document_id = 1;
  int32 ttl_days = 2; // 0 == default 14
}
message CreateBriefShareResponse {
  BriefShare share = 1;
}

message ListMyBriefSharesRequest {}
message ListMyBriefSharesResponse {
  repeated BriefShare shares = 1;
}

message RevokeBriefShareRequest {
  string token = 1;
}
message RevokeBriefShareResponse {}

// === O4 (Phase 4) — Year-in-Oracle (recap + hardcover PDF) ===

message YearInOracleRecap {
  string year = 1;
  double intellectual_rank = 2;
  string rank_label = 3;
  int32 total_inquiries = 4;
  int32 unique_domains = 5;
  string top_domain = 6;
  int32 document_count = 7;
  int32 memory_count = 8;
  int32 thread_count = 9;
}

message GetYearInOracleRecapRequest {}
message GetYearInOracleRecapResponse {
  YearInOracleRecap recap = 1;
}

message GenerateYearInOracleRequest {}
message GenerateYearInOracleResponse {
  string url = 1;
  int32 page_count = 2;
}

service OracleService {
  // Query handles strategic inquiry and rewards verified depth.
  rpc Query(QueryRequest) returns (QueryResponse);

  // O4 (Phase 4) — Year-in-Oracle recap + hardcover PDF.
  rpc GetYearInOracleRecap(GetYearInOracleRecapRequest) returns (GetYearInOracleRecapResponse);
  rpc GenerateYearInOracle(GenerateYearInOracleRequest) returns (GenerateYearInOracleResponse);

  // O3 (Phase 3) — Sovereign concierge desk.
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // O3 (Phase 3) — editorial Anthology.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // O3 (Phase 3) — shared brief.
  rpc CreateBriefShare(CreateBriefShareRequest) returns (CreateBriefShareResponse);
  rpc ListMyBriefShares(ListMyBriefSharesRequest) returns (ListMyBriefSharesResponse);
  rpc RevokeBriefShare(RevokeBriefShareRequest) returns (RevokeBriefShareResponse);

  // O1 (Phase 1) — daily synthesis briefing across granted pillar scopes.
  rpc GetTodayBriefing(GetTodayBriefingRequest) returns (GetTodayBriefingResponse);

  // O2 (Phase 2) — proactive triggers + inbox.
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  rpc ListMyTriggers(ListMyTriggersRequest) returns (ListMyTriggersResponse);
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
  rpc GetInbox(GetInboxRequest) returns (GetInboxResponse);

  // O2 (Phase 2) — long-form drafter.
  rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse);
  rpc ListMyDocuments(ListMyDocumentsRequest) returns (ListMyDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc DraftDocument(DraftDocumentRequest) returns (DraftDocumentResponse);

  // Status
  rpc GetOracleStats(GetOracleStatsRequest) returns (GetOracleStatsResponse);

  // O13.2 — multi-thread chat.
  rpc ListMyThreads(ListMyThreadsRequest) returns (ListMyThreadsResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc RenameThread(RenameThreadRequest) returns (RenameThreadResponse);
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse);
  rpc ListThreadMessages(ListThreadMessagesRequest) returns (ListThreadMessagesResponse);

  // O13.2 — streaming response.
  rpc StreamQuery(StreamQueryRequest) returns (stream StreamQueryResponse);

  // O13.3 — memory store.
  rpc RecordEpisodicMemory(RecordEpisodicMemoryRequest) returns (RecordEpisodicMemoryResponse);
  rpc ListMyEpisodicMemory(ListMyEpisodicMemoryRequest) returns (ListMyEpisodicMemoryResponse);
  rpc DeleteEpisodicMemory(DeleteEpisodicMemoryRequest) returns (DeleteEpisodicMemoryResponse);
  rpc UpsertSemanticMemory(UpsertSemanticMemoryRequest) returns (UpsertSemanticMemoryResponse);
  rpc ListMySemanticMemory(ListMySemanticMemoryRequest) returns (ListMySemanticMemoryResponse);
  rpc DeleteSemanticMemory(DeleteSemanticMemoryRequest) returns (DeleteSemanticMemoryResponse);

  // O13.4 — per-pillar scope grants.
  rpc ListMyScopeGrants(ListMyScopeGrantsRequest) returns (ListMyScopeGrantsResponse);
  rpc GrantScope(GrantScopeRequest) returns (GrantScopeResponse);
  rpc RevokeScope(RevokeScopeRequest) returns (RevokeScopeResponse);

  // O13.5 — first two agents: Vault + Forge.
  rpc ListAvailableTools(ListAvailableToolsRequest) returns (ListAvailableToolsResponse);
  rpc RunOracleTool(RunOracleToolRequest) returns (RunOracleToolResponse);

  // O13.7 — glass-box rank explainer.
  rpc GetRankExplainer(GetRankExplainerRequest) returns (GetRankExplainerResponse);
}
