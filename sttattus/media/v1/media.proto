syntax = "proto3";

package sttattus.media.v1;

option go_package = "github.com/sttattus/proto/gen/go/sttattus/media/v1;mediav1";

enum ProcessingStatus {
  PROCESSING_STATUS_UNSPECIFIED = 0;
  PROCESSING_STATUS_PENDING = 1;
  PROCESSING_STATUS_PROCESSING = 2;
  PROCESSING_STATUS_READY = 3;
  PROCESSING_STATUS_FAILED = 4;
}

message MediaAsset {
  string id = 1;
  string owner_id = 2;
  string url = 3;
  string mime = 4;
  int64 size = 5;
  int32 width = 6;
  int32 height = 7;
  ProcessingStatus status = 8;
  int64 created_at = 9;
  int64 processed_at = 10;
}

message RequestUploadRequest {
  string mime = 1;
  int64 size = 2;
  // Optional logical category that determines the R2 key prefix under
  // the owner's namespace. Format: "<pillar>/<bucket>", e.g.
  // "apex/documents" for lab-report PDFs, "vault/statements" for
  // brokerage statements. Empty falls back to the legacy "uploads/"
  // prefix. Validated server-side against an allow-list so clients
  // can't write into arbitrary buckets.
  string category = 3;
}
message RequestUploadResponse {
  string media_asset_id = 1;
  string upload_url = 2; // presigned PUT URL
  string public_url = 3; // final URL after upload completes
  int64 expires_at = 4;
}

message MarkProcessedRequest {
  string media_asset_id = 1;
  int32 width = 2;
  int32 height = 3;
}
message MarkProcessedResponse {
  MediaAsset asset = 1;
}

service MediaService {
  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse);
  rpc MarkProcessed(MarkProcessedRequest) returns (MarkProcessedResponse);
}

// === Rust imageproc service (called by Go, never by clients directly) ===

message ResizeRequest {
  string media_asset_id = 1;
  string source_url = 2;
  int32 max_width = 3;
  int32 max_height = 4;
  // Pre-signed PUT URL where the resized JPEG is uploaded. Issued by
  // backend_go's media service; imageproc only PUTs bytes so credentials
  // stay in one place. Phase 2.4.
  string upload_url = 5;
  // The final readable URL the asset will live at after upload (the
  // public_url from MediaService.RequestUpload). Echoed back as
  // thumbnail_url in the response so callers don't need to derive it.
  string public_url = 6;
}
message ResizeResponse {
  string thumbnail_url = 1;
  int32 width = 2;
  int32 height = 3;
  int64 size_bytes = 4;
}

message ExtractDominantColorsRequest {
  string source_url = 1;
  int32 sample_count = 2;
}
message ExtractDominantColorsResponse {
  repeated string hex_colors = 1; // strongest first
}

// === EXIF + GPS extraction (N10.3) ===
//
// audits/nomad.md §10 Phase 1 item 3 — "EXIF reading on uploads.
// Graduate imageproc from stub to real EXIF + GPS extraction." Real
// numbers only: when EXIF / GPS isn't present in the image, the
// response sets the corresponding _present field to false rather
// than fabricating defaults.

message ExtractExifRequest {
  string source_url = 1;
}

message ExtractExifResponse {
  // GPS coordinates as decoded from the EXIF GPSInfo IFD.
  bool gps_present = 1;
  double latitude = 2;
  double longitude = 3;

  // Capture timestamp from EXIF DateTimeOriginal (UTC unix seconds).
  bool taken_at_present = 4;
  int64 taken_at = 5;

  // Camera + lens identifiers from the IFD0 / ExifIFD.
  string camera_make = 6;
  string camera_model = 7;
  int32 orientation = 8;
  int32 width = 9;
  int32 height = 10;
}

service ImageProcService {
  rpc Resize(ResizeRequest) returns (ResizeResponse);
  rpc ExtractDominantColors(ExtractDominantColorsRequest) returns (ExtractDominantColorsResponse);

  // N10.3 — EXIF + GPS extraction. Nomad calls this after every
  // milestone-photo upload to bind the visit's verified location to
  // EXIF rather than to client-supplied coordinates.
  rpc ExtractExif(ExtractExifRequest) returns (ExtractExifResponse);
}
