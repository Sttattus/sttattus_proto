  string return_metrics_and_sensitivity_band = 6;
  string input_verification_disclosure = 7;
  string scenario_state = 8;
  bool export_screen_parity_verified = 9;
  string updated_at_iso = 10;
}
message GetDominionUnderwritingLabWorkbenchRequest {}
message GetDominionUnderwritingLabWorkbenchResponse {
  repeated DominionUnderwritingScenarioItem scenarios = 1;
  bool export_screen_parity_verified_enforced = 2;
  string assumption_provenance_summary = 3;
}
message SaveDominionUnderwritingScenarioRequest {
  string scenario_code = 1;
  string deal_title_and_strategy = 2;
  string visible_assumptions_and_freshness = 3;
  string return_metrics_and_sensitivity_band = 4;
  string input_verification_disclosure = 5;
  string scenario_state = 6;
}
message SaveDominionUnderwritingScenarioResponse {
  DominionUnderwritingScenarioItem scenario = 1;
}
message StressTestOrFreezeDominionScenarioRequest {
  string scenario_code = 1;
  string return_metrics_and_sensitivity_band = 2;
  string scenario_state = 3;
}
message StressTestOrFreezeDominionScenarioResponse {
  DominionUnderwritingScenarioItem scenario = 1;
}

