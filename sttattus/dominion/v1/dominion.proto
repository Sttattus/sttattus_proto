service DominionService {
  // Sovereignty Protocol: Verified Territorial Control
  rpc SyncProperties(SyncPropertiesRequest) returns (SyncPropertiesResponse);
  rpc ListTerritories(ListTerritoriesRequest) returns (ListTerritoriesResponse);
  rpc GetDominionStats(GetDominionStatsRequest) returns (GetDominionStatsResponse);

  // Hard Perks
  // Deprecated: use CreateLoungePass. This minted a credential that persisted
  // nowhere and could not be revoked, listed or audited, while
  // CreateLoungePass — gating on identical standing — wrote a revocable row.
  // The handler now delegates to CreateLoungePass so the two cannot drift,
  // and `lounge_key_jwt` carries that pass's token. No client calls this.
  rpc GetLoungeKey(GetLoungeKeyRequest) returns (GetLoungeKeyResponse) {
    option deprecated = true;
  }

  // D14.3 — AVM estimate (Zillow + Rightmove pilot).
  rpc EstimatePropertyValue(EstimatePropertyValueRequest) returns (EstimatePropertyValueResponse);

  // D14.4 — verification pipeline.
  rpc SubmitDeed(SubmitDeedRequest) returns (SubmitDeedResponse);
  rpc ListMyDeeds(ListMyDeedsRequest) returns (ListMyDeedsResponse);
  rpc ListDeedsForProperty(ListDeedsForPropertyRequest) returns (ListDeedsForPropertyResponse);
  rpc AdminReviewDeed(AdminReviewDeedRequest) returns (AdminReviewDeedResponse);

  // D14.7 — lounge directory.
  rpc ListLounges(ListLoungesRequest) returns (ListLoungesResponse);

  // D14.9 — lounge events + salons.
  rpc ListLoungeEvents(ListLoungeEventsRequest) returns (ListLoungeEventsResponse);
  rpc RsvpLoungeEvent(RsvpLoungeEventRequest) returns (RsvpLoungeEventResponse);
  rpc ListMyLoungeRsvps(ListMyLoungeRsvpsRequest) returns (ListMyLoungeRsvpsResponse);
  rpc ListSalons(ListSalonsRequest) returns (ListSalonsResponse);
  rpc RsvpSalon(RsvpSalonRequest) returns (RsvpSalonResponse);
  rpc ListMySalonRsvps(ListMySalonRsvpsRequest) returns (ListMySalonRsvpsResponse);

  // D14.10 — per-property yield / portfolio financials.
  rpc GetPropertyFinancials(GetPropertyFinancialsRequest) returns (GetPropertyFinancialsResponse);
  rpc UpsertPropertyFinancials(UpsertPropertyFinancialsRequest) returns (UpsertPropertyFinancialsResponse);
  rpc GetPortfolioYield(GetPortfolioYieldRequest) returns (GetPortfolioYieldResponse);

  // D14.11 — region intelligence.
  rpc ListRegionIntel(ListRegionIntelRequest) returns (ListRegionIntelResponse);
  rpc GetRegionIntel(GetRegionIntelRequest) returns (GetRegionIntelResponse);

  // D14.12 — cross-pillar allocation contract (Vault).
  rpc GetTerritoryAllocation(GetTerritoryAllocationRequest) returns (GetTerritoryAllocationResponse);

  // D14.13 — today summary.
  rpc GetTodaySummary(GetTodaySummaryRequest) returns (GetTodaySummaryResponse);

  // D14.14 — concierge property desk (Sovereign).
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // D14.15 — editorial anthology.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // D14.16 — architect / designer directory.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // D14.17 — off-market opportunities (Sovereign).
  rpc ListOffMarket(ListOffMarketRequest) returns (ListOffMarketResponse);
  rpc GetOffMarket(GetOffMarketRequest) returns (GetOffMarketResponse);

  // D14.19 — real deed parser.
  rpc ParseDeed(ParseDeedRequest) returns (ParseDeedResponse);

  // D14.20 — public Dominion profile share.
  rpc CreateDominionShare(CreateDominionShareRequest) returns (CreateDominionShareResponse);
  rpc ListMyDominionShares(ListMyDominionSharesRequest) returns (ListMyDominionSharesResponse);
  rpc RevokeDominionShare(RevokeDominionShareRequest) returns (RevokeDominionShareResponse);

  // D14.21 — annual Dominion Almanac.
  rpc GenerateDominionAlmanac(GenerateDominionAlmanacRequest) returns (GenerateDominionAlmanacResponse);

  // D14.22 — lounge access pass.
  rpc CreateLoungePass(CreateLoungePassRequest) returns (CreateLoungePassResponse);
  rpc ListMyLoungePasses(ListMyLoungePassesRequest) returns (ListMyLoungePassesResponse);

  // ===== Dominion Opportunity Choices 1–11 (D1..D15) =====
  // Choice 1 (D1): Property Digital Twin and Registry Integrity
  rpc GetDominionPropertyDigitalTwinWorkbench(GetDominionPropertyDigitalTwinWorkbenchRequest) returns (GetDominionPropertyDigitalTwinWorkbenchResponse);
  rpc SaveDominionPropertyDigitalTwin(SaveDominionPropertyDigitalTwinRequest) returns (SaveDominionPropertyDigitalTwinResponse);
  rpc PropagateOrResolveDominionTwinConflict(PropagateOrResolveDominionTwinConflictRequest) returns (PropagateOrResolveDominionTwinConflictResponse);

  // Choice 2 (D2): Institutional Underwriting and Scenario Laboratory
  rpc GetDominionUnderwritingLabWorkbench(GetDominionUnderwritingLabWorkbenchRequest) returns (GetDominionUnderwritingLabWorkbenchResponse);
  rpc SaveDominionUnderwritingScenario(SaveDominionUnderwritingScenarioRequest) returns (SaveDominionUnderwritingScenarioResponse);
  rpc StressTestOrFreezeDominionScenario(StressTestOrFreezeDominionScenarioRequest) returns (StressTestOrFreezeDominionScenarioResponse);

  // Choice 3 (D3): Property Accounting, Cash Flow, and Monthly Close
  rpc GetDominionPropertyAccountingWorkbench(GetDominionPropertyAccountingWorkbenchRequest) returns (GetDominionPropertyAccountingWorkbenchResponse);
  rpc SaveDominionPropertyAccountingClose(SaveDominionPropertyAccountingCloseRequest) returns (SaveDominionPropertyAccountingCloseResponse);
  rpc LockOrReverseDominionAccountingClose(LockOrReverseDominionAccountingCloseRequest) returns (LockOrReverseDominionAccountingCloseResponse);

  // Choice 4 (D5, D11): Intelligent Document, Permit, and Tax Obligation Vault
  rpc GetDominionDocumentObligationWorkbench(GetDominionDocumentObligationWorkbenchRequest) returns (GetDominionDocumentObligationWorkbenchResponse);
  rpc SaveDominionDocumentObligation(SaveDominionDocumentObligationRequest) returns (SaveDominionDocumentObligationResponse);
  rpc ConfirmDominionObligationReceiptOrAppeal(ConfirmDominionObligationReceiptOrAppealRequest) returns (ConfirmDominionObligationReceiptOrAppealResponse);

  // Choice 5 (D4, D14): Leasing, Tenancy, and Resident Experience Portal
  rpc GetDominionLeasingResidentWorkbench(GetDominionLeasingResidentWorkbenchRequest) returns (GetDominionLeasingResidentWorkbenchResponse);
  rpc SaveDominionLeasingResidentPortal(SaveDominionLeasingResidentPortalRequest) returns (SaveDominionLeasingResidentPortalResponse);
  rpc ScheduleDominionRenewalOrDepositClose(ScheduleDominionRenewalOrDepositCloseRequest) returns (ScheduleDominionRenewalOrDepositCloseResponse);

  // Choice 6 (D4, D13): Maintenance, Work Orders, and Vetted Vendor Network
  rpc GetDominionMaintenanceVendorWorkbench(GetDominionMaintenanceVendorWorkbenchRequest) returns (GetDominionMaintenanceVendorWorkbenchResponse);
  rpc SaveDominionMaintenanceWorkOrder(SaveDominionMaintenanceWorkOrderRequest) returns (SaveDominionMaintenanceWorkOrderResponse);
  rpc VerifyDominionThreeWayMatchOrWarranty(VerifyDominionThreeWayMatchOrWarrantyRequest) returns (VerifyDominionThreeWayMatchOrWarrantyResponse);

  // Choice 7 (D9): Capital Projects, Renovations, and Development Control
  rpc GetDominionCapitalProjectWorkbench(GetDominionCapitalProjectWorkbenchRequest) returns (GetDominionCapitalProjectWorkbenchResponse);
  rpc SaveDominionCapitalProjectControl(SaveDominionCapitalProjectControlRequest) returns (SaveDominionCapitalProjectControlResponse);
  rpc ApproveDominionDrawOrPunchlistCloseout(ApproveDominionDrawOrPunchlistCloseoutRequest) returns (ApproveDominionDrawOrPunchlistCloseoutResponse);

  // Choice 8 (D6): Market Intelligence, Comps, and Valuation Governance
  rpc GetDominionMarketValuationWorkbench(GetDominionMarketValuationWorkbenchRequest) returns (GetDominionMarketValuationWorkbenchResponse);
  rpc SaveDominionMarketValuationGovernance(SaveDominionMarketValuationGovernanceRequest) returns (SaveDominionMarketValuationGovernanceResponse);
  rpc AdjustDominionCompSetOrDisputeValuation(AdjustDominionCompSetOrDisputeValuationRequest) returns (AdjustDominionCompSetOrDisputeValuationResponse);

  // Choice 9 (D7, D15): Ownership Structures, Debt/Financing, and Transaction Room
  rpc GetDominionOwnershipTransactionWorkbench(GetDominionOwnershipTransactionWorkbenchRequest) returns (GetDominionOwnershipTransactionWorkbenchResponse);
  rpc SaveDominionOwnershipTransactionRoom(SaveDominionOwnershipTransactionRoomRequest) returns (SaveDominionOwnershipTransactionRoomResponse);
  rpc StageDominionRefinanceOrDataroomAccess(StageDominionRefinanceOrDataroomAccessRequest) returns (StageDominionRefinanceOrDataroomAccessResponse);

  // Choice 10 (D8, D10): Insurance, Risk, Resilience, and Portfolio Stress Testing
  rpc GetDominionInsuranceResilienceWorkbench(GetDominionInsuranceResilienceWorkbenchRequest) returns (GetDominionInsuranceResilienceWorkbenchResponse);
  rpc SaveDominionInsuranceResilienceCenter(SaveDominionInsuranceResilienceCenterRequest) returns (SaveDominionInsuranceResilienceCenterResponse);
  rpc StageDominionClaimPackOrStressReview(StageDominionClaimPackOrStressReviewRequest) returns (StageDominionClaimPackOrStressReviewResponse);

  // Choice 11 (D12): Utility, Energy, and Building Performance Intelligence
  rpc GetDominionUtilityPerformanceWorkbench(GetDominionUtilityPerformanceWorkbenchRequest) returns (GetDominionUtilityPerformanceWorkbenchResponse);
  rpc SaveDominionUtilityBuildingPerformance(SaveDominionUtilityBuildingPerformanceRequest) returns (SaveDominionUtilityBuildingPerformanceResponse);
  rpc VerifyDominionRetrofitSavingsOrAnomaly(VerifyDominionRetrofitSavingsOrAnomalyRequest) returns (VerifyDominionRetrofitSavingsOrAnomalyResponse);
}
