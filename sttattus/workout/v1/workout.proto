// Injury is one row of the permanent injury record. Programming
// reads ListActiveInjuries to inject contraindications.
message Injury {
  string id = 1;
  int64 occurred_at = 2; // unix seconds
  string region = 3;
  int32 severity = 4; // 1..5
  string mechanism = 5;
  string status = 6; // active | recovering | resolved
  int64 resolved_at = 7; // 0 when not resolved
  string notes = 8;
}

message ListInjuriesRequest {
  bool active_only = 1;
}
message ListInjuriesResponse {
  repeated Injury injuries = 1;
}

message CreateInjuryRequest {
  int64 occurred_at = 1;
  string region = 2;
  int32 severity = 3;
  string mechanism = 4;
  string notes = 5;
}
message CreateInjuryResponse {
  Injury injury = 1;
}

message UpdateInjuryStatusRequest {
  string id = 1;
  string status = 2; // active | recovering | resolved
  string notes = 3;
}
message UpdateInjuryStatusResponse {
  Injury injury = 1;
}

message DeleteInjuryRequest {
  string id = 1;
}
message DeleteInjuryResponse {}

// MobilityScore — the seven test slots in the annual screen.
message MobilityScore {
  int32 overhead_squat = 1;
  int32 ankle_dorsiflexion = 2;
  int32 hip_internal_rot = 3;
  int32 t_spine_rot = 4;
  int32 shoulder_flex = 5;
  int32 single_leg_balance = 6;
  int32 scap_pushup = 7;
}

message MobilityBaseline {
  string id = 1;
  int64 captured_at = 2;
  int32 season_year = 3;
  MobilityScore scores = 4;
  string notes = 5;
}

message ListMobilityBaselinesRequest {}
message ListMobilityBaselinesResponse {
  repeated MobilityBaseline baselines = 1;
}

message GetCurrentMobilityBaselineRequest {
  // 0 means current calendar year.
  int32 season_year = 1;
}
message GetCurrentMobilityBaselineResponse {
  // Empty baseline (id == "") means no screen for that year yet.
  MobilityBaseline baseline = 1;
}

message UpsertMobilityBaselineRequest {
  int64 captured_at = 1;
  // 0 means current calendar year.
  int32 season_year = 2;
  MobilityScore scores = 3;
  string notes = 4;
}
message UpsertMobilityBaselineResponse {
  MobilityBaseline baseline = 1;
}

message DeleteMobilityBaselineRequest {
  string id = 1;
}
message DeleteMobilityBaselineResponse {}

// ===== Wearable connectors v1 + parity dashboard (F7P2.4).
// Audits/forge.md §4.3 item 30, §5 screen 22, §9, §10 Phase 2
// item 4. The connection + priority ledger the parity dashboard
// reads; actual cloud reading ingestion is deferred. =====

// SensorConnection is one (user, source) connection row.
message SensorConnection {
  string source = 1; // apple_health | google_fit | whoop | oura | garmin
  string status = 2; // connected | disconnected | needs_auth
  int64 connected_at = 3; // unix seconds, 0 when never connected
  int64 last_synced_at = 4; // unix seconds, 0 when never synced
}

// SensorPriority is one per-metric conflict-reducer override.
message SensorPriority {
  string metric = 1; // sleep | hrv | rhr | steps | vo2
  string source = 2;
}

message ListSensorConnectionsRequest {}
message ListSensorConnectionsResponse {
  repeated SensorConnection connections = 1;
  repeated SensorPriority priority = 2;
}

message SetSensorConnectionStatusRequest {
  string source = 1;
  string status = 2; // connected | disconnected | needs_auth
}
message SetSensorConnectionStatusResponse {
  SensorConnection connection = 1;
}

message MarkSensorSyncedRequest {
  string source = 1;
}
message MarkSensorSyncedResponse {
  SensorConnection connection = 1;
}

message SetSensorPriorityRequest {
  string metric = 1;
  // Empty source clears the override.
  string source = 2;
}
message SetSensorPriorityResponse {
  // Empty when the override was cleared.
  SensorPriority priority = 1;
}

// ===== Forge analytics (F7P2.6). The training-science snapshot the
// Today screen + analytics tab render. backend_go aggregates the
// lifter's completed sets into load buckets and delegates the math
// to services_rust/scoring. Audits/forge.md §10 Phase 2 item 6. =====

message ForgeAnalytics {
  // Acute:chronic workload ratio (7-day load / weekly chronic load).
  double acute_chronic_ratio = 1;
  // 'detraining' | 'optimal' | 'caution' | 'high_risk'
  string acute_chronic_zone = 2;
  bool injury_risk = 3;

  // Volume / intensity / frequency triad over the trailing 7 days.
  double volume_7d = 4; // total tonnage (kg)
  double intensity_7d = 5; // mean weight per rep (kg)
  double frequency_7d = 6; // training days / 7, 0.0-1.0
  double vif_composite = 7; // single 0-100 roll-up

  // Best Epley-estimated 1RM observed in the trailing 28 days, with
  // the movement that produced it. Empty exercise = no qualifying
  // set in the window.
  double best_estimated_one_rm = 8;
  string best_one_rm_exercise = 9;

  // True when the lifter has no completed sessions in the window —
  // the client shows an editorial empty state instead of zeroes.
  bool is_empty = 10;

  // Daily tonnage across the same trailing 28-day window the chronic load
  // uses. Emitted for EVERY day in the window, rest days included as 0.0, so
  // the client plots a calendar rather than reconstructing one from gaps —
  // and so a week off reads as a trough instead of vanishing.
  //
  // Added because the analytics screen shipped a grey box reading "Chart
  // plotting logic lands in Phase 2": the aggregation already existed for
  // volume_7d, and nothing carried a series.
  repeated ForgeDailyVolume volume_daily = 11;

  // Choice 1 — tonnage uses load_kg under this formula version, and when the
  // window is empty the client can say "no training in the last 28 days"
  // instead of "no training logged yet".
  string formula_version = 12;
  int64 last_session_at = 13; // unix seconds, 0 when the member has none
  int32 lifetime_sessions = 14;
}

// One day of training volume.
message ForgeDailyVolume {
  string date = 1; // YYYY-MM-DD, UTC
  double tonnage = 2; // kg lifted that day (sum of weight x reps)
}

message GetForgeAnalyticsRequest {}
message GetForgeAnalyticsResponse {
  ForgeAnalytics analytics = 1;
}

