syntax = "proto3";

package sttattus.workout.v1;

import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/workout/v1;workoutv1";

message Tag {
  string id = 1;
  string label = 2;
  string slug = 3;
}

message Workout {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  repeated Tag tags = 5;
  int64 created_at = 6;
}

message Series {
  int32 set_index = 1;
  double weight = 2;
  int32 reps = 3;
  string unit = 4; // "kg" | "lb"
}

// StrainMetrics captures physiological intensity from wearables.
message StrainMetrics {
  double avg_heart_rate = 1;
  double max_heart_rate = 2;
  double active_energy_kcal = 3;
  double recovery_impact = 4; // Normalized impact on HRV/Recovery
}

message DayWorkout {
  string id = 1;
  string user_id = 2;
  Workout workout = 3;
  int64 performed_at = 4;
  string notes = 5;
  repeated Series series = 6;
  StrainMetrics strain = 7;
  bool is_verified = 8; // True if backed by sensor data
}

message ForgeStats {
  string user_id = 1;
  int32 power = 2;
  int32 agility = 3;
  int32 grit = 4;
  int64 experience = 5;
  string rank = 6; // Text label (e.g., 'Mythic')
  double forge_rank = 7; // Normalized 1-100 status signal
}

// ===== Workouts =====
message ListWorkoutsRequest {
  sttattus.common.v1.PageRequest page = 1;
  string search = 2;
  repeated string tag_slugs = 3;
}
message ListWorkoutsResponse {
  repeated Workout workouts = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message GetWorkoutRequest {
  string id = 1;
}
message GetWorkoutResponse {
  Workout workout = 1;
}

// ===== Logs =====
message LogDayWorkoutRequest {
  string workout_id = 1;
  int64 performed_at = 2;
  string notes = 3;
  repeated Series series = 4;
  StrainMetrics strain = 5;
  bool is_verified = 6;
}

// LogDayWorkoutResponse includes the *new* forge stats, so the client doesn't
// need a second round-trip after logging. The Rust scoring service computes
// the experience delta during this call.
message LogDayWorkoutResponse {
  DayWorkout day_workout = 1;
  ForgeStats stats = 2;
  int64 experience_delta = 3;
}

message ListHistoryRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListHistoryResponse {
  repeated DayWorkout entries = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message GetForgeStatsRequest {}
message GetForgeStatsResponse {
  ForgeStats stats = 1;
}

message SubmitFeedbackRequest {
  string body = 1;
}
message SubmitFeedbackResponse {
  string id = 1;
}

// ===== Forge sessions (F7.1) =====
// The session model the Phase-1 rebuild needs: a movement library, a
// session builder, and a live session view with rest timer, plate
// calculator (client-side) and RPE-per-set.

// Exercise is one entry in the movement library.
message Exercise {
  string id = 1;
  string name = 2;
  // compound | accessory | conditioning | mobility.
  string category = 3;
  string primary_muscle = 4;
  // barbell | dumbbell | machine | bodyweight | cable | kettlebell.
  string equipment = 5;
  string video_url = 6;
  string cue_one = 7;
  string cue_two = 8;
  string cue_three = 9;
}

// SessionSet is one logged set inside a session exercise. rpe is 0 when
// not yet rated (1-10 once rated); completed flips when the lifter
// marks the set done in the live view.
message SessionSet {
  string id = 1;
  int32 set_index = 2;
  double weight = 3;
  int32 reps = 4;
  string unit = 5; // "kg" | "lb"
  double rpe = 6;
  bool completed = 7;
}

// SessionExercise is an exercise slotted into a session, with its
// library metadata joined in and its logged sets attached.
message SessionExercise {
  string id = 1;
  string exercise_id = 2;
  int32 order_index = 3;
  int32 target_sets = 4;
  int32 rest_seconds = 5;
  string exercise_name = 6;
  string exercise_category = 7;
  string primary_muscle = 8;
  string equipment = 9;
  string video_url = 10;
  string cue_one = 11;
  string cue_two = 12;
  string cue_three = 13;
  repeated SessionSet sets = 14;
}

// ForgeSession is a built / live / closed training session.
message ForgeSession {
  string id = 1;
  string title = 2;
  // planned | active | completed | abandoned.
  string status = 3;
  string notes = 4;
  int64 started_at = 5; // unix seconds, 0 if not started
  int64 completed_at = 6; // unix seconds, 0 if not completed
  int64 created_at = 7;
  repeated SessionExercise exercises = 8;
}

// PlannedExercise is one row of the session builder's output.
message PlannedExercise {
  string exercise_id = 1;
  int32 target_sets = 2;
  int32 rest_seconds = 3;
}

message ListExercisesRequest {
  sttattus.common.v1.PageRequest page = 1;
  // F7.4 — optional filters. Empty string = unfiltered.
  string search = 2; // case-insensitive name substring
  string muscle = 3; // primary_muscle exact match
  string equipment = 4; // equipment exact match
}
message ListExercisesResponse {
  repeated Exercise exercises = 1;
}

message CreateSessionRequest {
  string title = 1;
  string notes = 2;
  repeated PlannedExercise exercises = 3;
}
message CreateSessionResponse {
  ForgeSession session = 1;
}

message GetSessionRequest {
  string id = 1;
}
message GetSessionResponse {
  ForgeSession session = 1;
}

message GetActiveSessionRequest {}
message GetActiveSessionResponse {
  // session.id is empty when the caller has no active session.
  ForgeSession session = 1;
}

message ListSessionsRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListSessionsResponse {
  // Summaries — exercises are not hydrated; call GetSession for detail.
  repeated ForgeSession sessions = 1;
}

message UpdateSessionStatusRequest {
  string id = 1;
  string status = 2; // planned | active | completed | abandoned
}
message UpdateSessionStatusResponse {
  ForgeSession session = 1;
}

message LogSetRequest {
  string session_exercise_id = 1;
  int32 set_index = 2;
  double weight = 3;
  int32 reps = 4;
  string unit = 5;
  double rpe = 6;
  bool completed = 7;
}
message LogSetResponse {
  SessionSet set = 1;
}

// ===== Rank ladder (F7.3) =====

// RankBand is one rung of the forge rank ladder, with the metric
// thresholds it asks for — the central engagement loop made legible.
message RankBand {
  string code = 1;
  string name = 2;
  // Inclusive lower / exclusive upper forge_rank bound (1-100).
  double lower_bound = 3;
  double upper_bound = 4;
  // Stat minimums to be considered solidly in this band.
  int32 min_power = 5;
  int32 min_agility = 6;
  int32 min_grit = 7;
  // Editorial one-liner on what the band represents.
  string benefit = 8;
  // True for the band the lifter currently sits in.
  bool current = 9;
}

message GetRankLadderRequest {}
message GetRankLadderResponse {
  repeated RankBand bands = 1;
  double forge_rank = 2;
  string current_rank = 3;
  int32 power = 4;
  int32 agility = 5;
  int32 grit = 6;
}

// ===== Today screen (F7.2) =====

// TodaySnapshot is everything the redesigned Today screen renders:
// a readiness ring, the session in focus, the rank delta, and the
// daily streak (F7.5).
message TodaySnapshot {
  // 0-100 readiness, with a one-line plain-language basis. Phase 1 is
  // a recency/load heuristic; F7.11 wearables feed real HRV readiness.
  int32 readiness = 1;
  string readiness_basis = 2;
  // The session in focus: the active one if a session is in progress,
  // otherwise the most recent planned session. session.id is empty
  // when there is nothing to show.
  ForgeSession focus_session = 3;
  // Current forge rank (1-100), its label, and the change over the
  // trailing 7 days (0 when there is no prior snapshot).
  double forge_rank = 4;
  string rank_label = 5;
  double rank_delta_7d = 6;
  // The lifter's training-day streak (F7.5). Always populated; a
  // zero current_streak with empty last_trained_date_iso means "no
  // history yet."
  ForgeStreak streak = 7;
}

message GetTodayRequest {}
message GetTodayResponse {
  TodaySnapshot today = 1;
}

// ===== Streak (F7.5) =====

// ForgeStreak is the lifter's training-day streak with a weekly
// grace day. A streak counts consecutive calendar days with a
// completed session, but a single missed day per ISO-week may be
// "graced" so the streak survives one slip — honest streaks beat
// brittle ones, per the audit's daily-open mechanic.
message ForgeStreak {
  // Consecutive days currently held.
  int32 current_streak = 1;
  // All-time best.
  int32 longest_streak = 2;
  // YYYY-MM-DD UTC, empty when no session has ever been completed.
  string last_trained_date_iso = 3;
  // True once the grace day has been spent this ISO-week.
  bool grace_used_this_week = 4;
  // YYYY-MM-DD UTC of the Monday this week's grace allowance is
  // anchored to. Empty when never set.
  string week_anchor_iso = 5;
}

message GetForgeStreakRequest {}
message GetForgeStreakResponse {
  ForgeStreak streak = 1;
}

// ===== Form-video capture (F7.6) =====

// FormVideo is a single uploaded form-video clip with the public
// URL and the movement name baked in, so the Forge "Form Lab"
// surface renders it directly.
message FormVideo {
  string id = 1;
  // Empty when the clip was captured ad-hoc outside a live session.
  string session_exercise_id = 2;
  string exercise_id = 3;
  string exercise_name = 4;
  string media_asset_id = 5;
  string video_url = 6;
  string thumbnail_url = 7;
  string mime = 8;
  // pending | reviewed | archived. Phase 1 only writes 'pending';
  // user surface flips to 'archived'; the form-check worker
  // (Phase 3) writes 'reviewed'.
  string status = 9;
  // Set context recorded at capture so a later PR-detection pass
  // can match the clip to a specific set. Optional — zero values
  // mean "not captured with these numbers."
  double set_weight = 10;
  int32 set_reps = 11;
  double set_rpe = 12;
  string note = 13;
  int64 captured_at = 14; // unix seconds
}

message CreateFormVideoRequest {
  // The id returned by MediaService.RequestUpload + uploaded via PUT.
  string media_asset_id = 1;
  string exercise_id = 2;
  // Empty for an ad-hoc capture outside a live session.
  string session_exercise_id = 3;
  double set_weight = 4;
  int32 set_reps = 5;
  double set_rpe = 6;
  string note = 7;
}
message CreateFormVideoResponse {
  FormVideo video = 1;
}

message ListMyFormVideosRequest {
  sttattus.common.v1.PageRequest page = 1;
  // Optional filter — empty / unset returns every movement.
  string exercise_id = 2;
}
message ListMyFormVideosResponse {
  repeated FormVideo videos = 1;
}

message DeleteFormVideoRequest {
  string id = 1;
}
message DeleteFormVideoResponse {}

message UpdateFormVideoStatusRequest {
  string id = 1;
  // pending | archived. 'reviewed' is server-only.
  string status = 2;
}
message UpdateFormVideoStatusResponse {
  FormVideo video = 1;
}

// ===== Programmes (F7P2.1) =====

// Programme is one editorial card in the browser. Authors are either
// 'template' (community-known protocols like 5/3/1) or a coach
// handle ('coach-romaniello', 'coach-helms').
message Programme {
  string id = 1;
  string slug = 2;
  string name = 3;
  string author = 4;
  string summary = 5;
  string description = 6;
  // strength | hypertrophy | tactical | endurance | hybrid
  string goal_class = 7;
  int32 weeks = 8;
  int32 sessions_per_week = 9;
  bool sovereign_only = 10;
  string image_url = 11;
}

// ProgrammeEnrolment hydrates the lifter's enrolment with the
// programme card so the home screen renders without a second
// round-trip.
message ProgrammeEnrolment {
  string id = 1;
  Programme programme = 2;
  int32 current_week = 3;
  // active | paused | finished | abandoned
  string status = 4;
  int64 started_at = 5;
  int64 finished_at = 6;
}

message ListProgrammesRequest {
  // Optional filter. Empty / unset returns every goal class.
  string goal_class = 1;
  // When true, includes Sovereign-only programmes. Phase 2
  // callers pass false; the Sovereign gate is enforced server-side
  // in Phase 3 along with the tier check.
  bool include_sovereign = 2;
}
message ListProgrammesResponse {
  repeated Programme programmes = 1;
}

message GetProgrammeRequest {
  // Lookup by slug — stable identifier the URL can carry.
  string slug = 1;
}
message GetProgrammeResponse {
  Programme programme = 1;
}

message EnrolInProgrammeRequest {
  string programme_id = 1;
}
message EnrolInProgrammeResponse {
  ProgrammeEnrolment enrolment = 1;
}

message GetActiveEnrolmentRequest {}
message GetActiveEnrolmentResponse {
  // enrolment.id is empty when the caller has no active enrolment.
  ProgrammeEnrolment enrolment = 1;
}

message ListMyEnrolmentsRequest {}
message ListMyEnrolmentsResponse {
  repeated ProgrammeEnrolment enrolments = 1;
}

message UpdateEnrolmentRequest {
  string id = 1;
  int32 current_week = 2;
  // active | paused | finished | abandoned
  string status = 3;
}
message UpdateEnrolmentResponse {
  ProgrammeEnrolment enrolment = 1;
}

service WorkoutService {
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (GetWorkoutResponse);
  rpc LogDayWorkout(LogDayWorkoutRequest) returns (LogDayWorkoutResponse);
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  rpc GetForgeStats(GetForgeStatsRequest) returns (GetForgeStatsResponse);
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);

  // F7.2 — the Today screen snapshot.
  rpc GetToday(GetTodayRequest) returns (GetTodayResponse);
  // F7.3 — the forge rank ladder with metric requirements.
  rpc GetRankLadder(GetRankLadderRequest) returns (GetRankLadderResponse);

  // F7.1 — movement library + session builder + live session.
  rpc ListExercises(ListExercisesRequest) returns (ListExercisesResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc GetActiveSession(GetActiveSessionRequest) returns (GetActiveSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc UpdateSessionStatus(UpdateSessionStatusRequest) returns (UpdateSessionStatusResponse);
  rpc LogSet(LogSetRequest) returns (LogSetResponse);

  // F7.5 — streak ledger with weekly grace day. The Today snapshot
  // already embeds the streak; this RPC is for a dedicated detail
  // surface and for forced refresh after session completion.
  rpc GetForgeStreak(GetForgeStreakRequest) returns (GetForgeStreakResponse);

  // F7.6 — form-video capture path. The bytes go through the
  // existing MediaService presigned-URL flow; these RPCs link the
  // resulting media asset to a lifter + movement + set context, and
  // let the lifter review / archive their library.
  rpc CreateFormVideo(CreateFormVideoRequest) returns (CreateFormVideoResponse);
  rpc ListMyFormVideos(ListMyFormVideosRequest) returns (ListMyFormVideosResponse);
  rpc DeleteFormVideo(DeleteFormVideoRequest) returns (DeleteFormVideoResponse);
  rpc UpdateFormVideoStatus(UpdateFormVideoStatusRequest) returns (UpdateFormVideoStatusResponse);

  // F7P2.1 — programme browser, enrolment ledger, and the manual
  // week-advance the Phase 2 surface uses.
  rpc ListProgrammes(ListProgrammesRequest) returns (ListProgrammesResponse);
  rpc GetProgramme(GetProgrammeRequest) returns (GetProgrammeResponse);
  rpc EnrolInProgramme(EnrolInProgrammeRequest) returns (EnrolInProgrammeResponse);
  rpc GetActiveEnrolment(GetActiveEnrolmentRequest) returns (GetActiveEnrolmentResponse);
  rpc ListMyEnrolments(ListMyEnrolmentsRequest) returns (ListMyEnrolmentsResponse);
  rpc UpdateEnrolment(UpdateEnrolmentRequest) returns (UpdateEnrolmentResponse);
}
