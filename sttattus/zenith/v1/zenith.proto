syntax = "proto3";

package sttattus.zenith.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/zenith/v1;zenithv1";

message Session {
  string id = 1;
  int32 duration_minutes = 2;
  double focus_score = 3; // 0.0 - 1.0 (Calculated/Verified)
  bool is_verified = 4; // True if bio-signals were used
  double avg_heart_rate = 5;
  double hrv_delta = 6; // HRV change during session
  google.protobuf.Timestamp started_at = 7;
}

message ZenithStats {
  string user_id = 1;
  double fortitude_rank = 2; // 1-100 normalized
  string rank_label = 3; // e.g., 'Acolyte', 'Focus Master', 'Sovereign Focus'
  int32 total_focus_minutes = 4;
  int32 verified_sessions_count = 5;
}

message LogFocusSessionRequest {
  Session session = 1;
}

message LogFocusSessionResponse {
  double current_zenith_score = 1;
  ZenithStats stats = 2;
}

message GetZenithStatsRequest {
  string user_id = 1;
}
message GetZenithStatsResponse {
  ZenithStats stats = 1;
}

// === Z16.8 + Z16.9 — meditation + breathwork library ===

message LibraryItem {
  string id = 1;
  string slug = 2;
  string kind = 3; // 'meditation' | 'breathwork'
  string title = 4;
  string summary = 5;
  string guided_text = 6;
  int32 duration_minutes = 7;
  string instructor = 8;
}

message ListLibraryItemsRequest {
  string kind = 1; // '' for all
}
message ListLibraryItemsResponse {
  repeated LibraryItem items = 1;
}

// === Z16.7 — block-time recommender ===

message BlockRecommendation {
  int64 starts_at_unix = 1;
  int32 duration_minutes = 2;
  string rationale = 3; // 1-line "why this window"
  string source = 4; // 'history' | 'calendar' | 'composite'
}

message RecommendBlockRequest {}
message RecommendBlockResponse {
  bool recommendation_present = 1;
  BlockRecommendation block = 2;
  // When recommendation_present = false, why we couldn't recommend.
  string reason = 3;
}

// === Z16.6 — calendar read integration ===

message CalendarConnection {
  string provider = 1; // 'google' | 'apple'
  string status = 2; // 'needs_auth' | 'connected' | 'failed'
  int64 last_synced_unix = 3;
}

message CalendarEvent {
  string id = 1;
  string provider = 2;
  string provider_event_id = 3;
  int64 starts_at_unix = 4;
  int64 ends_at_unix = 5;
  string title = 6;
  bool is_busy = 7;
}

message ListMyCalendarConnectionsRequest {}
message ListMyCalendarConnectionsResponse {
  repeated CalendarConnection connections = 1;
}

message ListMyCalendarEventsRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
}
message ListMyCalendarEventsResponse {
  repeated CalendarEvent events = 1;
}

// === Z16.5 — today's cognitive load ===
//
// Composite of:
//   - calendar_density (Z16.6 — null until calendar wire ships)
//   - apex_readiness  (Z16.4 deferral — null until Apex HRV bridge)
//   - session_pressure (real today: how much focused work the user
//     already logged vs their 14-day rolling average)
//
// Per audits/zenith.md §10 Phase 1 item 5. Each input is optional;
// the composite is the mean of available inputs (no fabrication).
message CognitiveLoad {
  bool calendar_density_present = 1;
  double calendar_density = 2; // 0..1
  bool apex_readiness_present = 3;
  double apex_readiness = 4; // 0..1 (higher = more recovered)
  bool session_pressure_present = 5;
  double session_pressure = 6; // 0..1 (higher = harder day)
  double composite = 7; // mean of available inputs, 0..1
  int32 inputs_available = 8;
}

message GetTodayLoadRequest {}
message GetTodayLoadResponse {
  CognitiveLoad load = 1;
}

service ZenithService {
  rpc LogFocusSession(LogFocusSessionRequest) returns (LogFocusSessionResponse);
  rpc GetZenithStats(GetZenithStatsRequest) returns (GetZenithStatsResponse);

  // Z16.5 — today's cognitive load.
  rpc GetTodayLoad(GetTodayLoadRequest) returns (GetTodayLoadResponse);

  // Z16.6 — calendar read integration.
  rpc ListMyCalendarConnections(ListMyCalendarConnectionsRequest) returns (ListMyCalendarConnectionsResponse);
  rpc ListMyCalendarEvents(ListMyCalendarEventsRequest) returns (ListMyCalendarEventsResponse);

  // Z16.7 — block-time recommender.
  rpc RecommendBlock(RecommendBlockRequest) returns (RecommendBlockResponse);

  // Z16.8 + Z16.9 — meditation + breathwork library.
  rpc ListLibraryItems(ListLibraryItemsRequest) returns (ListLibraryItemsResponse);
}
