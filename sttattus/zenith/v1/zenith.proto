service ZenithService {
  rpc LogFocusSession(LogFocusSessionRequest) returns (LogFocusSessionResponse);
  rpc GetZenithStats(GetZenithStatsRequest) returns (GetZenithStatsResponse);

  // Z16.1b — recent focus blocks (the ledger).
  rpc ListRecentSessions(ListRecentSessionsRequest) returns (ListRecentSessionsResponse);

  // Z16.5 — today's cognitive load.
  rpc GetTodayLoad(GetTodayLoadRequest) returns (GetTodayLoadResponse);

  // Z16.6 — calendar read integration.
  rpc ListMyCalendarConnections(ListMyCalendarConnectionsRequest) returns (ListMyCalendarConnectionsResponse);
  rpc ListMyCalendarEvents(ListMyCalendarEventsRequest) returns (ListMyCalendarEventsResponse);

  // Z16.7 — block-time recommender.
  rpc RecommendBlock(RecommendBlockRequest) returns (RecommendBlockResponse);

  // Z16.8 + Z16.9 — meditation + breathwork library.
  rpc ListLibraryItems(ListLibraryItemsRequest) returns (ListLibraryItemsResponse);

  // ===== Phase 2 — core expansion =====
  // Z16.15 — block templates.
  rpc ListBlockTemplates(ListBlockTemplatesRequest) returns (ListBlockTemplatesResponse);
  // Z16.22 — coached programmes.
  rpc ListProgrammes(ListProgrammesRequest) returns (ListProgrammesResponse);
  rpc GetProgramme(GetProgrammeRequest) returns (GetProgrammeResponse);
  rpc EnrollProgramme(EnrollProgrammeRequest) returns (EnrollProgrammeResponse);
  rpc ListMyProgrammes(ListMyProgrammesRequest) returns (ListMyProgrammesResponse);
  rpc AdvanceProgrammeWeek(AdvanceProgrammeWeekRequest) returns (AdvanceProgrammeWeekResponse);
  // Z16.23 — journaling.
  rpc AddJournalEntry(AddJournalEntryRequest) returns (AddJournalEntryResponse);
  rpc ListMyJournalEntries(ListMyJournalEntriesRequest) returns (ListMyJournalEntriesResponse);
  // Z16.26 — focus history + heatmap.
  rpc GetFocusHistory(GetFocusHistoryRequest) returns (GetFocusHistoryResponse);
  // Z16.27 — what-if simulator.
  rpc SimulateFortitude(SimulateFortitudeRequest) returns (SimulateFortitudeResponse);
  // Z16.17 — audio environment catalog.
  rpc ListAudioEnvironments(ListAudioEnvironmentsRequest) returns (ListAudioEnvironmentsResponse);

  // ===== Phase 2.5 — bridges =====
  // Z16.4 — cross-pillar cognitive-load contract (Forge consumes).
  rpc GetCognitiveLoad(GetCognitiveLoadRequest) returns (GetCognitiveLoadResponse);
  // Z16.9 — Today card.
  rpc GetTodaySummary(GetTodaySummaryRequest) returns (GetTodaySummaryResponse);
  // Z16.32 — acknowledge an acute stress-response prompt.
  rpc AcknowledgeStressPrompt(AcknowledgeStressPromptRequest) returns (AcknowledgeStressPromptResponse);

  // ===== Phase 3 — premium differentiation =====
  // Coach concierge desk (Sovereign).
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);
  // Editorial Anthology.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);
  // Teacher directory.
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
  // Sovereign commissioned audio.
  rpc ListSovereignAudio(ListSovereignAudioRequest) returns (ListSovereignAudioResponse);
  rpc GetSovereignAudio(GetSovereignAudioRequest) returns (GetSovereignAudioResponse);
  // Travel jet-lag protocol (Nomad cross-pillar).
  rpc GetJetLagProtocol(GetJetLagProtocolRequest) returns (GetJetLagProtocolResponse);
  // Public profile share (fortitude band only).
  rpc CreateProfileShare(CreateProfileShareRequest) returns (CreateProfileShareResponse);
  rpc ListMyProfileShares(ListMyProfileSharesRequest) returns (ListMyProfileSharesResponse);
  rpc RevokeProfileShare(RevokeProfileShareRequest) returns (RevokeProfileShareResponse);

  // ===== Phase 3.5 — real parsers + rituals =====
  rpc GetJournalInsights(GetJournalInsightsRequest) returns (GetJournalInsightsResponse);
  rpc SubmitCognitiveTest(SubmitCognitiveTestRequest) returns (SubmitCognitiveTestResponse);
  rpc ListMyCognitiveTests(ListMyCognitiveTestsRequest) returns (ListMyCognitiveTestsResponse);
  rpc GetCognitiveTestStatus(GetCognitiveTestStatusRequest) returns (GetCognitiveTestStatusResponse);
  rpc ListRituals(ListRitualsRequest) returns (ListRitualsResponse);

  // ===== Phase 4 — category-leading =====
  rpc GetYearInZenithRecap(GetYearInZenithRecapRequest) returns (GetYearInZenithRecapResponse);
  rpc GenerateZenithAlmanac(GenerateZenithAlmanacRequest) returns (GenerateZenithAlmanacResponse);
  rpc ListLounges(ListLoungesRequest) returns (ListLoungesResponse);
  rpc CreateLoungeBooking(CreateLoungeBookingRequest) returns (CreateLoungeBookingResponse);
  rpc ListMyLoungeBookings(ListMyLoungeBookingsRequest) returns (ListMyLoungeBookingsResponse);
  rpc CancelLoungeBooking(CancelLoungeBookingRequest) returns (CancelLoungeBookingResponse);

  // ===== Zenith Opportunity Choices 1–11 (Z1..Z14) =====
  // Choice 1 (Z1): Native Focus Firewall
  rpc GetZenithFocusFirewallWorkbench(GetZenithFocusFirewallWorkbenchRequest) returns (GetZenithFocusFirewallWorkbenchResponse);
  rpc SaveZenithFocusFirewallSession(SaveZenithFocusFirewallSessionRequest) returns (SaveZenithFocusFirewallSessionResponse);
  rpc TriggerZenithFocusFirewallBypassOrComplete(TriggerZenithFocusFirewallBypassOrCompleteRequest) returns (TriggerZenithFocusFirewallBypassOrCompleteResponse);

  // Choice 2 (Z2): Adaptive Day Architect
  rpc GetZenithAdaptiveDayArchitectWorkbench(GetZenithAdaptiveDayArchitectWorkbenchRequest) returns (GetZenithAdaptiveDayArchitectWorkbenchResponse);
  rpc SaveZenithAdaptiveDayArchitectPlan(SaveZenithAdaptiveDayArchitectPlanRequest) returns (SaveZenithAdaptiveDayArchitectPlanResponse);
  rpc AcceptOrReplanZenithDayArchitect(AcceptOrReplanZenithDayArchitectRequest) returns (AcceptOrReplanZenithDayArchitectResponse);

  // Choice 3 (Z9): Intention-to-Outcome Focus Loop
  rpc GetZenithIntentionOutcomeWorkbench(GetZenithIntentionOutcomeWorkbenchRequest) returns (GetZenithIntentionOutcomeWorkbenchResponse);
  rpc SaveZenithIntentionOutcomeContract(SaveZenithIntentionOutcomeContractRequest) returns (SaveZenithIntentionOutcomeContractResponse);
  rpc CompleteZenithIntentionOutcomeLoop(CompleteZenithIntentionOutcomeLoopRequest) returns (CompleteZenithIntentionOutcomeLoopResponse);

  // Choice 4 (Z3): Attention Analytics and N-of-1 Lab
  rpc GetZenithAttentionNOf1LabWorkbench(GetZenithAttentionNOf1LabWorkbenchRequest) returns (GetZenithAttentionNOf1LabWorkbenchResponse);
  rpc SaveZenithAttentionNOf1Experiment(SaveZenithAttentionNOf1ExperimentRequest) returns (SaveZenithAttentionNOf1ExperimentResponse);
  rpc EvaluateZenithAttentionNOf1Experiment(EvaluateZenithAttentionNOf1ExperimentRequest) returns (EvaluateZenithAttentionNOf1ExperimentResponse);

  // Choice 5 (Z4, Z13): Recovery and Protocol Studio
  rpc GetZenithRecoveryProtocolStudioWorkbench(GetZenithRecoveryProtocolStudioWorkbenchRequest) returns (GetZenithRecoveryProtocolStudioWorkbenchResponse);
  rpc SaveZenithRecoveryProtocolRun(SaveZenithRecoveryProtocolRunRequest) returns (SaveZenithRecoveryProtocolRunResponse);
  rpc RecordZenithRecoveryCheckOrAdverseFlag(RecordZenithRecoveryCheckOrAdverseFlagRequest) returns (RecordZenithRecoveryCheckOrAdverseFlagResponse);

  // Choice 6 (Z10): Communication Boundaries
  rpc GetZenithCommunicationBoundaryWorkbench(GetZenithCommunicationBoundaryWorkbenchRequest) returns (GetZenithCommunicationBoundaryWorkbenchResponse);
  rpc SaveZenithCommunicationBoundaryRule(SaveZenithCommunicationBoundaryRuleRequest) returns (SaveZenithCommunicationBoundaryRuleResponse);
  rpc ApproveOrReleaseZenithBoundaryCatchup(ApproveOrReleaseZenithBoundaryCatchupRequest) returns (ApproveOrReleaseZenithBoundaryCatchupResponse);

  // Choice 7 (Z5): Cognitive Readiness Battery
  rpc GetZenithCognitiveReadinessWorkbench(GetZenithCognitiveReadinessWorkbenchRequest) returns (GetZenithCognitiveReadinessWorkbenchResponse);
  rpc SaveZenithCognitiveReadinessSession(SaveZenithCognitiveReadinessSessionRequest) returns (SaveZenithCognitiveReadinessSessionResponse);
  rpc FlagOrValidateZenithCognitiveSession(FlagOrValidateZenithCognitiveSessionRequest) returns (FlagOrValidateZenithCognitiveSessionResponse);

  // Choice 8 (Z6, Z14): Private Journal and Pattern Memory
  rpc GetZenithPrivatePatternMemoryWorkbench(GetZenithPrivatePatternMemoryWorkbenchRequest) returns (GetZenithPrivatePatternMemoryWorkbenchResponse);
  rpc SaveZenithPrivatePatternMemory(SaveZenithPrivatePatternMemoryRequest) returns (SaveZenithPrivatePatternMemoryResponse);
  rpc EditOrDeleteZenithPrivatePatternMemory(EditOrDeleteZenithPrivatePatternMemoryRequest) returns (EditOrDeleteZenithPrivatePatternMemoryResponse);

  // Choice 9 (Z7): Travel Performance
  rpc GetZenithTravelPerformanceWorkbench(GetZenithTravelPerformanceWorkbenchRequest) returns (GetZenithTravelPerformanceWorkbenchResponse);
  rpc SaveZenithTravelPerformanceProtocol(SaveZenithTravelPerformanceProtocolRequest) returns (SaveZenithTravelPerformanceProtocolResponse);
  rpc ReplanZenithTravelMissedStep(ReplanZenithTravelMissedStepRequest) returns (ReplanZenithTravelMissedStepResponse);

  // Choice 10 (Z8, Z12): Coaching, Teams, and Meeting Health
  rpc GetZenithCoachingTeamMeetingWorkbench(GetZenithCoachingTeamMeetingWorkbenchRequest) returns (GetZenithCoachingTeamMeetingWorkbenchResponse);
  rpc SaveZenithCoachingTeamMeetingHealth(SaveZenithCoachingTeamMeetingHealthRequest) returns (SaveZenithCoachingTeamMeetingHealthResponse);
  rpc ProposeZenithMeetingFreeOrOracleHandoff(ProposeZenithMeetingFreeOrOracleHandoffRequest) returns (ProposeZenithMeetingFreeOrOracleHandoffResponse);

  // Choice 11 (Z11): Sensory Workspace and Desktop Companion
  rpc GetZenithSensoryDesktopWorkbench(GetZenithSensoryDesktopWorkbenchRequest) returns (GetZenithSensoryDesktopWorkbenchResponse);
  rpc SaveZenithSensoryDesktopWorkspace(SaveZenithSensoryDesktopWorkspaceRequest) returns (SaveZenithSensoryDesktopWorkspaceResponse);
  rpc ArmOrFallbackZenithSensoryWorkspace(ArmOrFallbackZenithSensoryWorkspaceRequest) returns (ArmOrFallbackZenithSensoryWorkspaceResponse);
}
