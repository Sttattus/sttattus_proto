syntax = "proto3";

package sttattus.empire.v1;

option go_package = "github.com/sttattus/proto/gen/go/sttattus/empire/v1;empirev1";

// EmpireService is the app-facing gateway for the Empire pillar. The
// Flutter `empire` app calls it; backend_go implements it
// (internal/service/empire.go), delegating math to the Rust
// services_rust/empire_engine and hydrating rows from Neon.
//
// EmpireEngineService (empire_engine.proto, same package) is the
// *internal* Rust service this gateway proxies to — separate concern.
//
// audits/empire.md §10 Phase 1.

// === Sttattus Score glass-box (P5.2) ===

message GetScoreBreakdownRequest {}

// PillarStanding is one line of the glass box: where you sit in one app,
// measured against whoever leads it.
//
// This is what the Sttattus Score is actually made of. Per app you score
// `100 * yours / the leader's`; the global score is the mean of `standing`
// across every app that has at least one participant.
message PillarStanding {
  // forge | lexicon | nomad | atlas | vault | apex | oracle | dominion |
  // legacy | zenith | onyx.
  string app_code = 1;
  // The member's raw 0-100 pillar score.
  double score = 2;
  // The platform leader's score in this app — what `score` is measured
  // against. Never zero for an active app.
  double leader_score = 3;
  // 100 * score / leader_score. This is the number that enters the mean.
  double standing = 4;
  // True when this member IS the leader. Ties count as leading.
  bool is_leader = 5;
}

message GetScoreBreakdownResponse {
  // 0..100 unified composite.
  double sttattus_score = 1;
  // sovereign | platinum | gold | silver | bronze.
  string tier = 2;
  int32 global_rank = 3;
  double global_percentile = 4;
  // DEPRECATED — empire_engine's four weighted buckets (wealth 30% / bio 25%
  // / social 20% / operational 25%).
  //
  // These do not explain sttattus_score and never did: the buckets are
  // empire_engine's own weighting while the score is the platform composite.
  // On production they summed to 35.4 under a headline of 13.8, on a card
  // captioned "Four weighted buckets. Every weight published." The weights
  // were published; they were the weights of a different number.
  //
  // Kept on the wire so an older client does not break. Read
  // pillar_standings instead — it is what the score is built from and it
  // sums, by construction, to sttattus_score.
  double wealth_component = 5;
  double bio_component = 6;
  double social_component = 7;
  double operational_component = 8;

  // One entry per ACTIVE app — an app nobody has scored in is omitted,
  // because it is excluded from the score's denominator too. Ordered by
  // standing, strongest first.
  //
  // mean(standing) == sttattus_score. That identity is the whole point: the
  // glass box now explains the number it sits under.
  repeated PillarStanding pillar_standings = 9;
}

// === Tier ladder (P5.3) ===

message GetTierLadderRequest {}

message TierBand {
  // sovereign | platinum | gold | silver | bronze.
  string code = 1;
  string name = 2;
  // Inclusive lower / exclusive upper Sttattus Score bound.
  double lower_bound = 3;
  double upper_bound = 4;
  // Editorial one-liner on what the band unlocks.
  string benefit = 5;
  // True for the band the caller currently sits in.
  bool current = 6;
}

message GetTierLadderResponse {
  // The five bands, ordered bronze → sovereign.
  repeated TierBand bands = 1;
  // The caller's live Sttattus Score, for the progress indicator.
  double sttattus_score = 2;
  // The caller's current tier code.
  string current_tier = 3;
}

// === Points wallet (P5.4) ===

message GetWalletRequest {}

// PillarPoints is one pillar's contribution to the points economy —
// keyed by the app_code written into hub_points_events.
message PillarPoints {
  string app_code = 1;
  int64 earned = 2;
  int64 spent = 3;
}

message GetWalletResponse {
  // Live spendable balance.
  int64 balance = 1;
  // Total ever earned (spends never decrement this).
  int64 lifetime_earned = 2;
  // Total ever spent (sum of the negative ledger entries, as a
  // positive number).
  int64 lifetime_spent = 3;
  // Per-pillar earned/spent split, so the wallet can show where the
  // economy is coming from.
  repeated PillarPoints by_pillar = 4;
}

message ListLedgerEntriesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

// LedgerEntry mirrors one append-only row of hub_points_events.
message LedgerEntry {
  string id = 1;
  // Empty when the event was not attributed to a specific pillar app.
  string app_code = 2;
  // earn | spend | decay | bonus | redemption — free-form, set by the
  // crediting service.
  string kind = 3;
  // Signed: positive for earns, negative for spends/decay.
  int64 amount = 4;
  string description = 5;
  // RFC-3339 UTC.
  string created_at = 6;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}

// === Sttattus Tax statement (P5.5) ===

message GetTaxStatementRequest {
  // The annual cross-pillar spend to project savings against, in the
  // minor unit (cents). Zero falls back to a reference basket so the
  // statement is never empty.
  int64 annual_spend = 1;
  // ISO-4217. Empty defaults to USD.
  string currency = 2;
}

// TaxRuleSummary is one active rule in the member's discount fabric.
message TaxRuleSummary {
  string rule_id = 1;
  int32 discount_basis_points = 2;
  string description = 3;
}

message GetTaxStatementResponse {
  // The tier whose discount fabric this statement reflects.
  string tier = 1;
  // The best effective discount, in basis points, the engine applied.
  int32 effective_basis_points = 2;
  // The full set of rules the member's tier currently qualifies for.
  repeated TaxRuleSummary active_rules = 3;
  // The spend the projection was run against (echoes the request, or
  // the reference basket when the request was zero).
  int64 annual_spend = 4;
  // Projected savings on annual_spend, computed by the real Tax engine.
  int64 annual_savings = 5;
  int64 monthly_savings = 6;
  string currency = 7;
  // True when annual_spend was a reference basket, not caller-supplied —
  // so the UI can label the projection as illustrative.
  bool illustrative = 8;
}

// === Public profile (P5.6) ===

message GetPublicProfileRequest {
  // Case-insensitive handle. Empty → NotFound.
  string handle = 1;
}

message GetPublicProfileResponse {
  // Stable handle (canonical casing).
  string handle = 1;
  // Display name.
  string name = 2;
  string avatar_url = 3;
  string tagline = 4;
  string bio = 5;
  // Composite + tier so the public surface can echo the badge.
  double sttattus_score = 6;
  string tier = 7;
  // RFC-3339 UTC of when the user joined.
  string joined_at = 8;
}

message ClaimHandleRequest {
  // Lowercase letters, digits, and underscores, 3–24 chars. Server
  // validates.
  string handle = 1;
}

message ClaimHandleResponse {
  string handle = 1;
}

message UpdatePublicProfileRequest {
  // Either field may be empty to leave the existing value alone; pass
  // a single space to clear a field.
  string tagline = 1;
  string bio = 2;
}

message UpdatePublicProfileResponse {
  string tagline = 1;
  string bio = 2;
}

// === Redemption catalog (P5.14) ===

message RedemptionItem {
  string id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  int32 point_cost = 5;
  string min_tier = 6;
  string hero_url = 7;
  // -1 = unlimited; 0+ = stock remaining.
  int32 stock = 8;
}

message ListRedemptionItemsRequest {}

message ListRedemptionItemsResponse {
  repeated RedemptionItem items = 1;
}

message RedeemItemRequest {
  string item_id = 1;
  string notes = 2;
}

message RedeemItemResponse {
  string order_id = 1;
  int32 point_cost_charged = 2;
}

message RedemptionOrderSummary {
  string id = 1;
  string status = 2;
  int32 point_cost = 3;
  string notes = 4;
  string created_at = 5;
  string item_title = 6;
  string item_category = 7;
}

message ListMyRedemptionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListMyRedemptionsResponse {
  repeated RedemptionOrderSummary orders = 1;
}

// === Notifications hub (P5.13) ===

message RegisterDeviceTokenRequest {
  // "ios" or "android".
  string platform = 1;
  // APNs / FCM token from the device.
  string token = 2;
  // The app the token belongs to (empire, vault, …). The backend uses
  // it to route per-pillar pushes to the right surface.
  string app_code = 3;
}

message RegisterDeviceTokenResponse {
  string token = 1;
}

message UnregisterDeviceTokenRequest {
  string token = 1;
}

message UnregisterDeviceTokenResponse {}

message NotificationPreference {
  // "email" | "sms" | "push".
  string channel = 1;
  bool enabled = 2;
  // "HH:MM" 24-hour, empty when unset.
  string quiet_hours_start = 3;
  string quiet_hours_end = 4;
  string timezone = 5;
}

message ListNotificationPreferencesRequest {}

message ListNotificationPreferencesResponse {
  repeated NotificationPreference preferences = 1;
}

message UpdateNotificationPreferenceRequest {
  string channel = 1;
  bool enabled = 2;
  string quiet_hours_start = 3;
  string quiet_hours_end = 4;
  string timezone = 5;
}

message UpdateNotificationPreferenceResponse {
  NotificationPreference preference = 1;
}

// === Salons (P5.12) ===

// SalonSummary is a salon row joined with the caller's RSVP and the
// current going count. Renders in the upcoming list.
message SalonSummary {
  string id = 1;
  string title = 2;
  string city = 3;
  string venue = 4;
  string description = 5;
  // RFC-3339 UTC.
  string starts_at = 6;
  string ends_at = 7;
  // 0 = unlimited.
  int32 capacity = 8;
  string min_tier = 9;
  int32 going_count = 10;
  // "going" | "maybe" | "declined" | "" (no RSVP).
  string my_status = 11;
}

message ListUpcomingSalonsRequest {
  int32 limit = 1;
}

message ListUpcomingSalonsResponse {
  repeated SalonSummary salons = 1;
}

message UpdateSalonRsvpRequest {
  string salon_id = 1;
  // "going" | "maybe" | "declined" — empty string clears the RSVP.
  string status = 2;
}

message UpdateSalonRsvpResponse {
  string salon_id = 1;
  string status = 2;
}

// === Lounges (P5.11) ===

message Lounge {
  string id = 1;
  string name = 2;
  string city = 3;
  string address = 4;
  string description = 5;
  // bronze | silver | gold | platinum | sovereign.
  string min_tier = 6;
  string hero_url = 7;
}

message ListLoungesRequest {}

message ListLoungesResponse {
  repeated Lounge lounges = 1;
}

message LoungeEvent {
  string id = 1;
  string lounge_id = 2;
  string lounge_name = 3;
  string lounge_city = 4;
  string title = 5;
  string description = 6;
  // RFC-3339 UTC.
  string starts_at = 7;
  string ends_at = 8;
  string min_tier = 9;
}

message ListUpcomingLoungeEventsRequest {
  int32 limit = 1;
}

message ListUpcomingLoungeEventsResponse {
  repeated LoungeEvent events = 1;
}

// === Editorial digest (P5.10) ===

message EditorialDigest {
  string id = 1;
  // YYYY-MM-DD UTC.
  string week_start = 2;
  string title = 3;
  string subtitle = 4;
  // Markdown body.
  string body = 5;
  string editor_name = 6;
  // RFC-3339 UTC.
  string published_at = 7;
}

message GetLatestEditorialDigestRequest {}

message GetLatestEditorialDigestResponse {
  // Nil when no digest has been published yet.
  EditorialDigest digest = 1;
}

message ListEditorialDigestsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListEditorialDigestsResponse {
  repeated EditorialDigest digests = 1;
}

// === Sunday clout drop (P5.9) ===

message GetLatestCloutDropRequest {}

// CloutDropEntry is one (pillar, rank) cell of the drop.
message CloutDropEntry {
  string pillar_code = 1;
  int32 rank = 2;
  double score = 3;
  // Public profile slice.
  string user_id = 4;
  string name = 5;
  string handle = 6;
  string avatar_url = 7;
  string tier = 8;
}

message GetLatestCloutDropResponse {
  // The Sunday this drop covers, formatted YYYY-MM-DD UTC. Empty when
  // no drop exists yet (fresh DB or pre-first-Sunday).
  string week_start = 1;
  repeated CloutDropEntry entries = 2;
}

// === Member-facing audit log (P5.8) ===

message ListMyAuditLogRequest {
  int32 limit = 1;
  int32 offset = 2;
  // Restrict to entries whose action starts with this string, e.g.
  // "/sttattus.apex.v1.". Apex's Clinical Audit screen promises "every
  // change to your vitals or profile" and was rendering whatever the
  // member last did in Oracle, Vault or Nomad, because the log is
  // platform-wide and the screen had no way to ask for its own slice.
  // Empty means the whole log, which is what Empire's own screen wants.
  string action_prefix = 3;
}

// MyAuditEntry is one audit_logs row from the caller's perspective.
// is_self_initiated is true when the user themselves was the actor;
// false means another actor (typically staff) touched their account.
message MyAuditEntry {
  string id = 1;
  string action = 2;
  bool is_self_initiated = 3;
  // JSON payload (object or null) serialised as a string for the wire —
  // the app decides whether to render structured fields or hide them.
  string payload_json = 4;
  string created_at = 5;
}

message ListMyAuditLogResponse {
  repeated MyAuditEntry entries = 1;
}

// === Friend graph (P5.7) ===

// FriendSummary is the public slice of one friend (or pending invite
// counterparty). Renders in directory rows + invite cards.
message FriendSummary {
  string friendship_id = 1;
  string user_id = 2;
  string name = 3;
  string handle = 4;
  string avatar_url = 5;
  double sttattus_score = 6;
  string tier = 7;
  // RFC-3339 UTC of the relevant moment — accepted_at for confirmed
  // friends, created_at for pending invites.
  string since = 8;
}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated FriendSummary friends = 1;
  repeated FriendSummary incoming = 2;
  repeated FriendSummary outgoing = 3;
}

message SendInviteRequest {
  // Target's handle (the way one member finds another in this surface).
  string handle = 1;
}

message SendInviteResponse {
  string friendship_id = 1;
}

message RespondInviteRequest {
  string friendship_id = 1;
  // true → accept, false → decline.
  bool accept = 2;
}

message RespondInviteResponse {
  string friendship_id = 1;
  // "accepted" | "declined".
  string status = 2;
}

message RemoveFriendRequest {
  // Either an active pending invite (withdraws) or an accepted edge
  // (severs).
  string friendship_id = 1;
}

message RemoveFriendResponse {
  string friendship_id = 1;
}

// === Concierge desk (P5.15, Sovereign cross-pillar) ===

message ConciergeThread {
  string id = 1;
  string subject = 2;
  // open | awaiting | closed.
  string status = 3;
  string created_at = 4;
  string last_message_at = 5;
  int32 message_count = 6;
}

message ConciergeMessage {
  string id = 1;
  string thread_id = 2;
  // member | concierge | system.
  string sender = 3;
  string body = 4;
  string created_at = 5;

  // The concierge who wrote it. Empty for member and system messages, and
  // for replies written before authorship was recorded.
  //
  // Every desk on the platform answered as an anonymous "STAFF" until
  // 2026-08-23; lexicon's tutor desk had carried a name since migration 0079
  // and was the only one. A white-glove desk that will not say who is
  // speaking is not white-glove.
  string author_name = 6;
}

message StartConciergeThreadRequest {
  string subject = 1;
  string body = 2;
}

message StartConciergeThreadResponse {
  string thread_id = 1;
}

message ListMyConciergeThreadsRequest {}

message ListMyConciergeThreadsResponse {
  repeated ConciergeThread threads = 1;
}

message GetConciergeThreadRequest {
  string thread_id = 1;
}

message GetConciergeThreadResponse {
  ConciergeThread thread = 1;
  repeated ConciergeMessage messages = 2;
}

message PostConciergeMessageRequest {
  string thread_id = 1;
  string body = 2;
}

message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// === Empire Anthology (P5.16, named-author editorial) ===

message AnthologyArticle {
  string id = 1;
  string slug = 2;
  string title = 3;
  string dek = 4;
  string author_name = 5;
  string author_title = 6;
  // Markdown / plain body; paragraphs split on \n\n.
  string body = 7;
  string hero_url = 8;
  bool sovereign_only = 9;
  string published_at = 10;
}

message ListAnthologyArticlesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListAnthologyArticlesResponse {
  // Bodies are omitted in the list view; fetch the full article by slug.
  repeated AnthologyArticle articles = 1;
}

message GetAnthologyArticleRequest {
  string slug = 1;
}

message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// === Member directory (P5.17, Sovereign opt-in) ===

message DirectoryMember {
  string user_id = 1;
  string handle = 2;
  string name = 3;
  string avatar_url = 4;
  string city = 5;
  string tier = 6;
  double sttattus_score = 7;
  int32 global_rank = 8;
}

message ListMemberDirectoryRequest {
  // Optional filters. Empty = no filter.
  string tier = 1;
  string city = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListMemberDirectoryResponse {
  repeated DirectoryMember members = 1;
}

message SetDirectoryVisibilityRequest {
  bool visible = 1;
  // Optional city the member wants surfaced in the directory.
  string city = 2;
}

message SetDirectoryVisibilityResponse {
  bool visible = 1;
  string city = 2;
}

// === Annual Empire Almanac (P5.18) ===

message GenerateEmpireAlmanacRequest {
  // Defaults to the current year.
  string year = 1;
}

message GenerateEmpireAlmanacResponse {
  string media_asset_id = 1;
  string public_url = 2;
  int64 generated_at_unix = 3;
  int32 page_count = 4;
}

// === Signed shareable score badge (P5.19) ===

message CreateScoreBadgeRequest {}

message CreateScoreBadgeResponse {
  // Opaque token; the badge is served at GET /badge/:token as SVG.
  string token = 1;
  // Absolute URL of the badge (when the public base is configured) or the
  // relative path otherwise.
  string url = 2;
  string expires_at = 3;
}

// === Digital tier card (P5.20, hand-numbered) ===

message GetTierCardRequest {}

message GetTierCardResponse {
  string member_name = 1;
  string handle = 2;
  // bronze | silver | gold | platinum | sovereign.
  string tier = 3;
  double sttattus_score = 4;
  // Permanent hand-number, assigned on first request, zero-padded (e.g.
  // "0042").
  string card_number = 5;
  // RFC-3339 UTC of when the member joined.
  string member_since = 6;
}

// === Lounge / salon access pass (P5.21, the NFC-at-door analogue) ===

message CreateLoungePassRequest {
  // Optional lounge/venue the pass is scoped to. Empty = any open venue.
  string lounge_id = 1;
}

message CreateLoungePassResponse {
  // Opaque short-TTL token; the door verifies it at GET /pass/:token.
  string token = 1;
  string url = 2;
  string expires_at = 3;
  // The tier the door reads off the pass.
  string tier = 4;
}

// === Annual Almanac print order (P5.22) ===

message OrderAlmanacPrintRequest {
  // The generated Almanac PDF (from GenerateEmpireAlmanac).
  string media_asset_id = 1;
  string recipient = 2;
  string address_line1 = 3;
  string address_line2 = 4;
  string city = 5;
  string postal_code = 6;
  string country = 7;
}

message OrderAlmanacPrintResponse {
  string order_id = 1;
  // requested | in_production | shipped — set by fulfilment ops.
  string status = 2;
}

message AlmanacPrintOrder {
  string id = 1;
  string status = 2;
  string recipient = 3;
  string city = 4;
  string country = 5;
  string created_at = 6;
}

message ListMyAlmanacOrdersRequest {}

message ListMyAlmanacOrdersResponse {
  repeated AlmanacPrintOrder orders = 1;
}

// === Year in Empire (P5.23, the annual recap) ===

message GetYearInEmpireRequest {
  // Defaults to the current year.
  string year = 1;
}

message GetYearInEmpireResponse {
  string year = 1;
  double current_score = 2;
  string tier = 3;
  int32 global_rank = 4;
  bool has_rank = 5;
  // Points earned / spent inside the requested year.
  int64 points_earned = 6;
  int64 points_spent = 7;
  // Salons the member RSVP'd "going" to.
  int32 salons_attended = 8;
  // Highest-scoring pillar + its score.
  string top_pillar = 9;
  double top_pillar_score = 10;
  // Pillars with a non-zero score.
  int32 pillars_active = 11;
}

service EmpireService {
  // GetScoreBreakdown returns the caller's Sttattus Score with the
  // four weighted-bucket components — the glass-box the audit asks for.
  rpc GetScoreBreakdown(GetScoreBreakdownRequest) returns (GetScoreBreakdownResponse);

  // GetTierLadder returns the five-band tier ladder with bounds +
  // benefits, marking the caller's current band. Bounds are confirmed
  // against empire_engine.GetTier.
  rpc GetTierLadder(GetTierLadderRequest) returns (GetTierLadderResponse);

  // GetWallet returns the caller's points balance, lifetime totals, and
  // per-pillar earned/spent breakdown — the wallet headline.
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);

  // ListLedgerEntries returns the append-only points ledger, newest
  // first, paginated.
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);

  // GetTaxStatement returns the member's Sttattus Tax position — their
  // tier's discount fabric and a savings projection computed by the
  // real Tax engine.
  rpc GetTaxStatement(GetTaxStatementRequest) returns (GetTaxStatementResponse);

  // GetPublicProfile returns the public Empire profile for a handle.
  // No auth dependency — this is the surface the website's
  // /empire/<handle> route will eventually mirror.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);

  // ClaimHandle sets the caller's public handle. The handle is unique
  // (case-insensitive) and can only be claimed once per user — a second
  // call returns AlreadyExists.
  rpc ClaimHandle(ClaimHandleRequest) returns (ClaimHandleResponse);

  // UpdatePublicProfile updates the caller's tagline + bio. Empty
  // fields are left alone; a single space clears.
  rpc UpdatePublicProfile(UpdatePublicProfileRequest) returns (UpdatePublicProfileResponse);

  // ListFriends returns the caller's accepted friends, plus incoming
  // and outgoing pending invites — the three buckets the members tab
  // renders.
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);

  // SendInvite opens a pending friendship to the user behind the
  // supplied handle. Returns AlreadyExists if an active edge (pending
  // or accepted) already sits between the two parties in either
  // direction.
  rpc SendInvite(SendInviteRequest) returns (SendInviteResponse);

  // RespondInvite accepts (mutual confirmation) or declines a pending
  // invite. Only the target may call.
  rpc RespondInvite(RespondInviteRequest) returns (RespondInviteResponse);

  // RemoveFriend severs an accepted edge, or withdraws a pending one.
  // Either side may call.
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);

  // ListMyAuditLog returns audit_logs rows where the caller is either
  // the actor or the target, newest first. The glass-box for "who
  // touched my account."
  rpc ListMyAuditLog(ListMyAuditLogRequest) returns (ListMyAuditLogResponse);

  // GetLatestCloutDrop returns the most recent Sunday clout drop the
  // server has computed — every pillar's top entries flattened into
  // one list, ordered by pillar then rank.
  rpc GetLatestCloutDrop(GetLatestCloutDropRequest) returns (GetLatestCloutDropResponse);

  // GetLatestEditorialDigest returns the most recent weekly digest
  // the editorial team has published.
  rpc GetLatestEditorialDigest(GetLatestEditorialDigestRequest) returns (GetLatestEditorialDigestResponse);

  // ListEditorialDigests returns the digest archive, newest first.
  rpc ListEditorialDigests(ListEditorialDigestsRequest) returns (ListEditorialDigestsResponse);

  // ListLounges returns the active Sttattus Lounges directory.
  rpc ListLounges(ListLoungesRequest) returns (ListLoungesResponse);

  // ListUpcomingLoungeEvents returns near-future events across all
  // active lounges, ordered by start time.
  rpc ListUpcomingLoungeEvents(ListUpcomingLoungeEventsRequest) returns (ListUpcomingLoungeEventsResponse);

  // ListUpcomingSalons returns near-future salons with the caller's
  // RSVP and the current going-count joined in.
  rpc ListUpcomingSalons(ListUpcomingSalonsRequest) returns (ListUpcomingSalonsResponse);

  // UpdateSalonRsvp sets or clears the caller's RSVP for a salon.
  rpc UpdateSalonRsvp(UpdateSalonRsvpRequest) returns (UpdateSalonRsvpResponse);

  // RegisterDeviceToken stores or refreshes an APNs / FCM token bound
  // to the caller and app_code.
  rpc RegisterDeviceToken(RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse);

  // UnregisterDeviceToken drops a token (logout / token rotation).
  rpc UnregisterDeviceToken(UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse);

  // ListNotificationPreferences returns the caller's email/sms/push
  // preferences. Missing channels collapse to "enabled with no quiet
  // hours" at the service layer.
  rpc ListNotificationPreferences(ListNotificationPreferencesRequest) returns (ListNotificationPreferencesResponse);

  // UpdateNotificationPreference upserts one channel's preference.
  rpc UpdateNotificationPreference(UpdateNotificationPreferenceRequest) returns (UpdateNotificationPreferenceResponse);

  // ListRedemptionItems returns the active redemption catalog —
  // points-priced items the member can claim from the wallet.
  rpc ListRedemptionItems(ListRedemptionItemsRequest) returns (ListRedemptionItemsResponse);

  // RedeemItem charges points and opens a redemption_orders row
  // (status=requested). Ops confirms via the dashboard.
  rpc RedeemItem(RedeemItemRequest) returns (RedeemItemResponse);

  // ListMyRedemptions returns the caller's redemption history.
  rpc ListMyRedemptions(ListMyRedemptionsRequest) returns (ListMyRedemptionsResponse);

  // --- Phase 3 — premium differentiation ---

  // StartConciergeThread opens a Sovereign concierge thread with a subject
  // and an opening message; the desk auto-acknowledges with a system reply.
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);

  // ListMyConciergeThreads returns the caller's concierge threads, newest
  // activity first.
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);

  // GetConciergeThread returns one thread + its message stream.
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);

  // PostConciergeMessage appends a member message to a thread and flips it
  // to awaiting.
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // ListAnthologyArticles returns the Empire Anthology, newest first
  // (bodies omitted).
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);

  // GetAnthologyArticle returns one article in full by slug.
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // ListMemberDirectory returns opted-in members, ranked, optionally
  // filtered by tier + city.
  rpc ListMemberDirectory(ListMemberDirectoryRequest) returns (ListMemberDirectoryResponse);

  // SetDirectoryVisibility opts the caller into / out of the public member
  // directory and sets their surfaced city.
  rpc SetDirectoryVisibility(SetDirectoryVisibilityRequest) returns (SetDirectoryVisibilityResponse);

  // GenerateEmpireAlmanac renders the caller's year-across-twelve-pillars
  // hardcover PDF, stores it, and returns the URL.
  rpc GenerateEmpireAlmanac(GenerateEmpireAlmanacRequest) returns (GenerateEmpireAlmanacResponse);

  // CreateScoreBadge mints a signed, time-bound token for the caller's
  // public score badge (served at GET /badge/:token as SVG).
  rpc CreateScoreBadge(CreateScoreBadgeRequest) returns (CreateScoreBadgeResponse);

  // --- Phase 4 — category-leading ---

  // GetTierCard returns the caller's hand-numbered digital tier card,
  // assigning a permanent card number on first request.
  rpc GetTierCard(GetTierCardRequest) returns (GetTierCardResponse);

  // CreateLoungePass mints a short-TTL, tier-stamped access pass the
  // physical lounge/salon door verifies at GET /pass/:token.
  rpc CreateLoungePass(CreateLoungePassRequest) returns (CreateLoungePassResponse);

  // OrderAlmanacPrint captures a print-and-ship request for a generated
  // Almanac PDF. Fulfilment is handled out-of-band by ops.
  rpc OrderAlmanacPrint(OrderAlmanacPrintRequest) returns (OrderAlmanacPrintResponse);

  // ListMyAlmanacOrders returns the caller's print orders, newest first.
  rpc ListMyAlmanacOrders(ListMyAlmanacOrdersRequest) returns (ListMyAlmanacOrdersResponse);

  // GetYearInEmpire returns the caller's annual recap — score, tier, points,
  // salons, top pillar — computed across the requested year.
  rpc GetYearInEmpire(GetYearInEmpireRequest) returns (GetYearInEmpireResponse);
}
