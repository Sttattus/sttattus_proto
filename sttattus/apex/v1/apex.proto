  string model_version = 3;
  string method = 4; // phenoage | deviation | insufficient | score_free
  double biological_age = 5;
  double chronological_age = 6;
  double delta_years = 7;
  double bio_rank = 8;
  double ci_low_years = 9;
  double ci_high_years = 10;
  string uncertainty_band = 11; // narrow | moderate | wide | uncalibrated
  double completeness_pct = 12;
  string validation_fit = 13; // in_cohort | age_out_of_bounds | missing_dob | partial_panel
  string input_sha256 = 14;
  repeated ApexAgeContribution contributions = 15;
  map<string, double> system_scores = 16;
  repeated string missing_markers = 17;
  string trigger_source = 18; // auto | member_recompute | admin_recompute | model_rollback
