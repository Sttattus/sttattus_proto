// === Phase 3.5 message types ===

// --- Manual lab extraction ---

message LabMarkerValue {
  string metric_code = 1;
  double value = 2;
  string unit = 3;
  double ref_range_low = 4;
  double ref_range_high = 5;
  string flag = 6; // normal | low | high | critical
  string specimen_type = 7;
  string origin = 8; // regex_parser | gemini_ai | fhir_bundle | ccda_xml | member_manual | staff_transcription
  double confidence = 9; // 0.0..1.0
  string review_state = 10; // provisional | member_confirmed | staff_verified | rejected | withdrawn
  int32 page_number = 11;
  string evidence_snippet = 12;
  string bbox_json = 13;
  double normalized_value = 14;
  string normalized_unit = 15;
  string conversion_version = 16;
}

message ExtractLabMarkersRequest {
  string report_id = 1;
  repeated LabMarkerValue markers = 2;
  int64 recorded_at_unix = 3;
  bool confirm_immediately = 4;
  string origin = 5;
}
message ExtractLabMarkersResponse {
  int32 inserted = 1;
  int32 provisional_count = 2;
  int32 confirmed_count = 3;
}

