  double optimal_midpoint = 8;
  double weight_or_coefficient = 9;
  double age_contribution_years = 10; // Negative = younger than cohort mean, Positive = older
  string direction = 11; // favorable | neutral | unfavorable | missing
  bool verified = 12;
  string freshness_status = 13; // fresh | aging | stale | missing
  double sensitivity_10pct_years = 14; // Projected age delta if marker improves by 10% toward optimal
  string missing_reason = 15; // '' | 'not_measured' | 'unverified_only' | 'excluded_period'
}

