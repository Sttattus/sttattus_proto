  double baseline_median = 11;
  double baseline_stddev = 12;
  double baseline_p10 = 13;
  double baseline_p90 = 14;
  double latest_value = 15;
  int64 latest_measured_at_unix = 16;
  double delta_from_baseline = 17;
  double delta_pct = 18;
  double z_score = 19;
  string device_or_lab_continuity = 20; // consistent | mixed_sources | insufficient_history
  string primary_source_or_device = 21;
  string confidence_band = 22; // high | moderate | calibrating | insufficient
  int64 computed_at_unix = 23;
}

