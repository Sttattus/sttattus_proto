syntax = "proto3";

package sttattus.apex.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/apex/v1;apexv1";

// BiomarkerCategory defines the biological system being measured.
enum BiomarkerCategory {
  BIOMARKER_CATEGORY_UNSPECIFIED = 0;
  BIOMARKER_CATEGORY_LIPIDS = 1; // ApoB, LDL, HDL
  BIOMARKER_CATEGORY_METABOLIC = 2; // HbA1c, Glucose, Insulin
  BIOMARKER_CATEGORY_HORMONES = 3; // Testosterone, Cortisol
  BIOMARKER_CATEGORY_INFLAMMATION = 4; // CRP, Omega-3 Index
  BIOMARKER_CATEGORY_VITAMINS = 5; // Vitamin D, B12
  BIOMARKER_CATEGORY_SENSORS = 6; // HRV, Sleep (from Wearables)
}

// VerificationStatus tracks the manual verification of clinical reports.
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING = 1;
  VERIFICATION_STATUS_APPROVED = 2;
  VERIFICATION_STATUS_REJECTED = 3;
}

// Biomarker represents a single biological measurement.
message Biomarker {
  string id = 1;
  string code = 2; // e.g., 'APO_B', 'TESTOSTERONE_FREE'
  BiomarkerCategory category = 3;
  double value = 4;
  string unit = 5; // e.g., 'mg/dL', 'ng/dL'
  bool verified = 6; // True if extracted from an approved LabReport
  google.protobuf.Timestamp recorded_at = 7;
}

// LabReport represents a clinical document (PDF/Image) submitted by the user.
message LabReport {
  string id = 1;
  string file_url = 2; // From shared_uploader
  string clinic_name = 3;
  VerificationStatus status = 4;
  string admin_note = 5;
  google.protobuf.Timestamp report_date = 6;
  google.protobuf.Timestamp submitted_at = 7;
  repeated Biomarker extracted_markers = 8;
}

// REQ/RES
message SyncVitalsRequest {
  repeated Biomarker metrics = 1; // Used for wearable/manual data
}

message SyncVitalsResponse {
  double biological_age = 1;
  double current_apex_score = 2;
}

message SubmitLabReportRequest {
  string file_url = 1;
  string clinic_name = 2;
  google.protobuf.Timestamp report_date = 3;
}

message SubmitLabReportResponse {
  LabReport report = 1;
}

message ListLabReportsRequest {}

message ListLabReportsResponse {
  repeated LabReport reports = 1;
}

message AdminVerifyLabRequest {
  string report_id = 1;
  VerificationStatus status = 2;
  string admin_note = 3;
  repeated Biomarker verified_markers = 4; // Admin confirms/sets actual values
}

message AdminVerifyLabResponse {
  LabReport report = 1;
}

// A11.1 — vitals dashboard. Most-recent value per metric for the
// signed-in member; what the today screen renders.
message ListMyVitalsRequest {}

message ListMyVitalsResponse {
  repeated Biomarker vitals = 1;
}

// A11.3 — Apex Age headline. biological_age comes from apex_engine
// (mock-base 40 today; the real epigenetic clocks land in Phase 3).
// chronological_age is null when the user has not set a DOB.
message GetApexAgeRequest {}

message GetApexAgeResponse {
  double biological_age = 1;
  double bio_rank = 2;
  // Optional — only present when apex_profiles.date_of_birth is set.
  // Reported in years (decimal). Clients render the delta if both
  // values are present.
  bool chronological_age_present = 3;
  double chronological_age = 4;
  // Map of system_id (e.g. 'cardiovascular') -> score 0..100.
  map<string, double> system_scores = 5;
  // Which scoring path produced biological_age. "phenoage" = real
  // Levine 2018 formula (all 9 markers + DOB present). "deviation" =
  // optimal-range fallback against apex_biomarker_refs. "insufficient"
  // = we couldn't compute a biological age.
  string method = 6;
  repeated string markers_used = 7;
  repeated string markers_missing = 8;
}

// A11.3 — clinical baseline (DOB / biological sex / chronotype).
message ApexProfile {
  bool date_of_birth_present = 1;
  string date_of_birth = 2; // ISO 8601 YYYY-MM-DD
  string biological_sex = 3; // 'female' | 'male' | 'intersex' | ''
  string chronotype = 4; // 'owl' | 'lark' | 'neutral' | ''
}

message GetMyApexProfileRequest {}
message GetMyApexProfileResponse {
  ApexProfile profile = 1;
}

message UpdateMyApexProfileRequest {
  ApexProfile profile = 1;
}
message UpdateMyApexProfileResponse {
  ApexProfile profile = 1;
}

// A11.4 — clinical reference + optimal range for one biomarker.
// Bands without data carry the corresponding *_present = false.
message BiomarkerRef {
  string metric_code = 1;
  string display_name = 2;
  string unit = 3;
  string sex_at_birth = 4; // '' | 'female' | 'male'
  bool lab_band_present = 5;
  double lab_low = 6;
  double lab_high = 7;
  bool optimal_band_present = 8;
  double optimal_low = 9;
  double optimal_high = 10;
  string direction = 11; // 'lower' | 'middle' | 'higher'
  string source_note = 12;
}

message ListBiomarkerRefsRequest {}
message ListBiomarkerRefsResponse {
  repeated BiomarkerRef refs = 1;
}

// A11.2 — per-biomarker time-series for the dashboard's drill-in.
message ListMyBiomarkerHistoryRequest {
  string metric_code = 1; // canonical code e.g. 'HRV', 'LDL'
  int32 days = 2; // 0 == lifetime
}

message ListMyBiomarkerHistoryResponse {
  string metric_code = 1;
  repeated Biomarker points = 2;
}

// Z16.4 — Apex HRV bridge for Zenith verification.
// Returns mean HRV inside the requested span vs the user's 30-day
// baseline. Honest "present=false" when either the window or the
// baseline carries zero samples — Zenith treats absence as
// "unavailable", never as failure.
message GetHrvWindowRequest {
  int64 start_unix = 1;
  int64 end_unix = 2;
}

message GetHrvWindowResponse {
  bool present = 1; // false when window or baseline is empty
  double window_mean = 2; // mean HRV in the (start, end) span (ms)
  double baseline_mean = 3; // 30-day baseline mean excluding the window
  double delta = 4; // window_mean - baseline_mean (ms)
  int32 window_count = 5;
  int32 baseline_count = 6;
}

// A11.6 Phase 2 — Apex Protocols library.
//
// Editorial protocols across the audit's named categories (sleep,
// light, breathwork, supplements, thermal, recovery). Members can
// pin a protocol and tick daily adherence; the per-day status is
// 'hit' | 'miss' | 'partial'.

message ApexProtocol {
  string id = 1;
  string slug = 2;
  string title = 3;
  string category = 4;
  string author = 5;
  string summary = 6;
  string description = 7;
  int32 duration_weeks = 8;
  int32 minutes_per_day = 9;
  string image_url = 10;
  bool sovereign_only = 11;
}

message ApexProtocolEnrolment {
  string id = 1;
  ApexProtocol protocol = 2;
  string status = 3; // enrolled | paused | finished
  int64 started_at_unix = 4;
  int64 finished_at_unix = 5;
}

message ApexProtocolAdherence {
  string id = 1;
  string enrolment_id = 2;
  string for_date = 3; // YYYY-MM-DD
  string status = 4; // hit | miss | partial
  string note = 5;
  int64 created_at_unix = 6;
}

message ListApexProtocolsRequest {
  string category = 1; // optional, empty = all
  bool include_sovereign = 2;
}
message ListApexProtocolsResponse {
  repeated ApexProtocol protocols = 1;
}

message GetApexProtocolRequest {
  string slug = 1;
}
message GetApexProtocolResponse {
  ApexProtocol protocol = 1;
}

message EnrolInApexProtocolRequest {
  string protocol_id = 1;
}
message EnrolInApexProtocolResponse {
  ApexProtocolEnrolment enrolment = 1;
}

message ListMyApexProtocolEnrolmentsRequest {}
message ListMyApexProtocolEnrolmentsResponse {
  repeated ApexProtocolEnrolment enrolments = 1;
}

message UpdateApexProtocolEnrolmentRequest {
  string enrolment_id = 1;
  string status = 2; // enrolled | paused | finished
}
message UpdateApexProtocolEnrolmentResponse {
  ApexProtocolEnrolment enrolment = 1;
}

message RecordApexProtocolAdherenceRequest {
  string enrolment_id = 1;
  string for_date = 2; // YYYY-MM-DD, empty = today
  string status = 3; // hit | miss | partial
  string note = 4;
}
message RecordApexProtocolAdherenceResponse {
  ApexProtocolAdherence adherence = 1;
}

message ListMyApexProtocolAdherenceRequest {
  string enrolment_id = 1;
  int32 days = 2; // 0 = all
}
message ListMyApexProtocolAdherenceResponse {
  repeated ApexProtocolAdherence entries = 1;
}

// A11.6 Phase 3 — Apex Clinics directory.
//
// Editorial directory of partner longevity clinics by region with
// a concierge intro-request surface. Intro requests are
// human-routed; the desk picks them up server-side.

message ApexClinic {
  string id = 1;
  string slug = 2;
  string name = 3;
  string city = 4;
  string country = 5;
  string specialties = 6; // comma-separated tags
  string summary = 7;
  string description = 8;
  string website_url = 9;
  string image_url = 10;
  bool sovereign_only = 11;
}

message ApexClinicIntroRequest {
  string id = 1;
  ApexClinic clinic = 2;
  string note = 3;
  string status = 4; // requested | acknowledged | introduced | declined
  int64 requested_at_unix = 5;
  int64 decided_at_unix = 6;
}

message ListApexClinicsRequest {
  string country = 1; // optional, empty = all
}
message ListApexClinicsResponse {
  repeated ApexClinic clinics = 1;
}

message GetApexClinicRequest {
  string slug = 1;
}
message GetApexClinicResponse {
  ApexClinic clinic = 1;
}

message RequestApexClinicIntroRequest {
  string clinic_id = 1;
  string note = 2;
}
message RequestApexClinicIntroResponse {
  ApexClinicIntroRequest request = 1;
}

message ListMyApexClinicIntroRequestsRequest {}
message ListMyApexClinicIntroRequestsResponse {
  repeated ApexClinicIntroRequest requests = 1;
}

service ApexService {
  // Wearable/Manual Sync
  rpc SyncVitals(SyncVitalsRequest) returns (SyncVitalsResponse);

  // The Lab: Clinical Data
  rpc SubmitLabReport(SubmitLabReportRequest) returns (SubmitLabReportResponse);
  rpc ListLabReports(ListLabReportsRequest) returns (ListLabReportsResponse);

  // Today's vitals (A11.1).
  rpc ListMyVitals(ListMyVitalsRequest) returns (ListMyVitalsResponse);

  // Per-biomarker history (A11.2).
  rpc ListMyBiomarkerHistory(ListMyBiomarkerHistoryRequest) returns (ListMyBiomarkerHistoryResponse);

  // Z16.4 — HRV window summary for Zenith session verification.
  rpc GetHrvWindow(GetHrvWindowRequest) returns (GetHrvWindowResponse);

  // Reference + optimal ranges (A11.4). Public-readable for any
  // authed user — the table is curated reference data.
  rpc ListBiomarkerRefs(ListBiomarkerRefsRequest) returns (ListBiomarkerRefsResponse);

  // Apex Age headline + clinical profile (A11.3).
  rpc GetApexAge(GetApexAgeRequest) returns (GetApexAgeResponse);
  rpc GetMyApexProfile(GetMyApexProfileRequest) returns (GetMyApexProfileResponse);
  rpc UpdateMyApexProfile(UpdateMyApexProfileRequest) returns (UpdateMyApexProfileResponse);

  // A11.6 Phase 3 — Clinics directory.
  rpc ListApexClinics(ListApexClinicsRequest) returns (ListApexClinicsResponse);
  rpc GetApexClinic(GetApexClinicRequest) returns (GetApexClinicResponse);
  rpc RequestApexClinicIntro(RequestApexClinicIntroRequest) returns (RequestApexClinicIntroResponse);
  rpc ListMyApexClinicIntroRequests(ListMyApexClinicIntroRequestsRequest) returns (ListMyApexClinicIntroRequestsResponse);

  // A11.6 Phase 2 — Protocols library.
  rpc ListApexProtocols(ListApexProtocolsRequest) returns (ListApexProtocolsResponse);
  rpc GetApexProtocol(GetApexProtocolRequest) returns (GetApexProtocolResponse);
  rpc EnrolInApexProtocol(EnrolInApexProtocolRequest) returns (EnrolInApexProtocolResponse);
  rpc ListMyApexProtocolEnrolments(ListMyApexProtocolEnrolmentsRequest) returns (ListMyApexProtocolEnrolmentsResponse);
  rpc UpdateApexProtocolEnrolment(UpdateApexProtocolEnrolmentRequest) returns (UpdateApexProtocolEnrolmentResponse);
  rpc RecordApexProtocolAdherence(RecordApexProtocolAdherenceRequest) returns (RecordApexProtocolAdherenceResponse);
  rpc ListMyApexProtocolAdherence(ListMyApexProtocolAdherenceRequest) returns (ListMyApexProtocolAdherenceResponse);

  // === Phase 2 additions ===

  // Supplement stack manager (A11.7).
  rpc ListSupplements(ListSupplementsRequest) returns (ListSupplementsResponse);
  rpc ListMySupplements(ListMySupplementsRequest) returns (ListMySupplementsResponse);
  rpc AddSupplement(AddSupplementRequest) returns (AddSupplementResponse);
  rpc RemoveSupplement(RemoveSupplementRequest) returns (RemoveSupplementResponse);
  rpc ListSupplementInteractions(ListSupplementInteractionsRequest) returns (ListSupplementInteractionsResponse);

  // CGM ingestion + glucose curve (A11.8).
  rpc ListMyGlucose(ListMyGlucoseRequest) returns (ListMyGlucoseResponse);
  rpc IngestGlucoseReading(IngestGlucoseReadingRequest) returns (IngestGlucoseReadingResponse);

  // Cycle dashboard (A11.9 — opt-in for female users).
  rpc GetCycleStatus(GetCycleStatusRequest) returns (GetCycleStatusResponse);
  rpc LogPeriod(LogPeriodRequest) returns (LogPeriodResponse);
  rpc LogCycleSymptom(LogCycleSymptomRequest) returns (LogCycleSymptomResponse);
  rpc ListMyCycleSymptoms(ListMyCycleSymptomsRequest) returns (ListMyCycleSymptomsResponse);

  // What-if simulator: project Apex Age under hypothetical marker overrides.
  rpc SimulateApexAge(SimulateApexAgeRequest) returns (SimulateApexAgeResponse);

  // Cross-pillar readiness signal — Forge + Zenith consume this to gate
  // session intensity / focus prescription. Pure read; no engine call.
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);

  // === Phase 3 additions ===

  // Clinical concierge (A11.10) — Sovereign-tier white-glove desk.
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // Editorial Anthology (A11.11) — named-author longevity articles.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // Pharmacology log (A11.12) — encrypted prescribed + off-label items.
  rpc ListMyPharmacology(ListMyPharmacologyRequest) returns (ListMyPharmacologyResponse);
  rpc AddPharmacology(AddPharmacologyRequest) returns (AddPharmacologyResponse);
  rpc RemovePharmacology(RemovePharmacologyRequest) returns (RemovePharmacologyResponse);

  // DNA ingestion (A11.13) — VCF / TXT upload → SNP report.
  rpc RegisterDnaUpload(RegisterDnaUploadRequest) returns (RegisterDnaUploadResponse);
  rpc ListMyDnaUploads(ListMyDnaUploadsRequest) returns (ListMyDnaUploadsResponse);
  rpc ListMyDnaSnps(ListMyDnaSnpsRequest) returns (ListMyDnaSnpsResponse);

  // Lab partner introductions (A11.14).
  rpc ListLabPartners(ListLabPartnersRequest) returns (ListLabPartnersResponse);

  // === Phase 3.5 additions ===

  // Manual lab biomarker extraction (A11.15) — until the auto-extractor
  // ships, members or staff type marker values from an uploaded PDF and
  // we land them as verified apex_vitals rows tied to the report.
  rpc ExtractLabMarkers(ExtractLabMarkersRequest) returns (ExtractLabMarkersResponse);

  // Clinician shared view (A11.16) — generates a token-protected JSON
  // snapshot of clinical data accessible at /share/clinician/:token.
  rpc CreateClinicianShare(CreateClinicianShareRequest) returns (CreateClinicianShareResponse);
  rpc ListMyClinicianShares(ListMyClinicianSharesRequest) returns (ListMyClinicianSharesResponse);
  rpc RevokeClinicianShare(RevokeClinicianShareRequest) returns (RevokeClinicianShareResponse);

  // Apex × Nomad jet-lag protocol (A11.17) — 9-day light/melatonin/meal
  // schedule. Pure compute, no persistence.
  rpc GetJetLagProtocol(GetJetLagProtocolRequest) returns (GetJetLagProtocolResponse);

  // === Phase 4 additions ===

  // Annual Health Almanac (A11.18) — server-rendered PDF report.
  rpc GenerateHealthAlmanac(GenerateHealthAlmanacRequest) returns (GenerateHealthAlmanacResponse);

  // Advanced imaging studies (A11.19) — coronary CTA / MRI / DEXA.
  rpc SubmitImagingStudy(SubmitImagingStudyRequest) returns (SubmitImagingStudyResponse);
  rpc ListMyImagingStudies(ListMyImagingStudiesRequest) returns (ListMyImagingStudiesResponse);

  // Sttattus Lounges (A11.20) — recovery-room booking flow.
  rpc ListLounges(ListLoungesRequest) returns (ListLoungesResponse);
  rpc ListMyLoungeBookings(ListMyLoungeBookingsRequest) returns (ListMyLoungeBookingsResponse);
  rpc CreateLoungeBooking(CreateLoungeBookingRequest) returns (CreateLoungeBookingResponse);
  rpc CancelLoungeBooking(CancelLoungeBookingRequest) returns (CancelLoungeBookingResponse);

  // Lab-PDF heuristic extraction (A11.21) — accepts OCR text, regex-
  // extracts common biomarkers as a confirmation candidate set.
  rpc ParseLabReportText(ParseLabReportTextRequest) returns (ParseLabReportTextResponse);

  // Admin Methods (Gated by Admin Middleware)
  rpc AdminVerifyLab(AdminVerifyLabRequest) returns (AdminVerifyLabResponse);
}

// === Phase 2 message types ===

// --- Supplements ---

message Supplement {
  string id = 1;
  string slug = 2;
  string name = 3;
  string category = 4; // longevity | sleep | cognitive | recovery | gut | hormones
  string description = 5;
  string evidence_rating = 6; // A | B | C
  double default_dose_mg = 7;
  bool sovereign_only = 8;
}

message UserSupplement {
  string id = 1;
  Supplement supplement = 2;
  double dose_mg = 3;
  string schedule = 4; // e.g. "morning", "evening", "with-food"
  int64 started_at_unix = 5;
  bool active = 6;
}

message SupplementInteraction {
  string a_slug = 1;
  string b_slug = 2;
  string severity = 3; // info | caution | avoid
  string note = 4;
}

message ListSupplementsRequest {
  string category = 1; // optional filter
}
message ListSupplementsResponse {
  repeated Supplement supplements = 1;
}

message ListMySupplementsRequest {}
message ListMySupplementsResponse {
  repeated UserSupplement stack = 1;
}

message AddSupplementRequest {
  string supplement_id = 1;
  double dose_mg = 2;
  string schedule = 3;
}
message AddSupplementResponse {
  UserSupplement entry = 1;
  repeated SupplementInteraction warnings = 2;
}

message RemoveSupplementRequest {
  string user_supplement_id = 1;
}
message RemoveSupplementResponse {}

message ListSupplementInteractionsRequest {
  string slug = 1;
}
message ListSupplementInteractionsResponse {
  repeated SupplementInteraction interactions = 1;
}

// --- Glucose / CGM ---

message GlucoseReading {
  string id = 1;
  double value_mg_dl = 2;
  int64 recorded_at_unix = 3;
  string source = 4; // dexcom | libre | manual
}

message ListMyGlucoseRequest {
  int32 hours = 1; // window in hours; 0 = last 24h
}
message ListMyGlucoseResponse {
  repeated GlucoseReading readings = 1;
  double mean_mg_dl = 2;
  double time_in_range_pct = 3; // 70-180 mg/dL
}

message IngestGlucoseReadingRequest {
  double value_mg_dl = 1;
  int64 recorded_at_unix = 2; // 0 = now
  string source = 3; // defaults to "manual"
}
message IngestGlucoseReadingResponse {
  GlucoseReading reading = 1;
}

// --- Cycle ---

message CycleStatus {
  bool present = 1;
  string phase = 2; // menstrual | follicular | ovulation | luteal | unknown
  int32 cycle_day = 3;
  string next_period_estimate = 4; // YYYY-MM-DD or empty
  string last_period_start = 5;
  int32 average_cycle_days = 6;
}

message CycleSymptom {
  string id = 1;
  string recorded_on = 2; // YYYY-MM-DD
  string kind = 3;
  int32 intensity = 4; // 1-5
}

message GetCycleStatusRequest {}
message GetCycleStatusResponse {
  CycleStatus status = 1;
}

message LogPeriodRequest {
  string started_on = 1; // YYYY-MM-DD
  string ended_on = 2; // YYYY-MM-DD or empty
  string flow = 3; // light | medium | heavy
}
message LogPeriodResponse {
  CycleStatus status = 1;
}

message LogCycleSymptomRequest {
  string recorded_on = 1; // YYYY-MM-DD or empty = today
  string kind = 2;
  int32 intensity = 3;
}
message LogCycleSymptomResponse {
  CycleSymptom symptom = 1;
}

message ListMyCycleSymptomsRequest {
  int32 days = 1; // window; 0 = 90 days
}
message ListMyCycleSymptomsResponse {
  repeated CycleSymptom symptoms = 1;
}

// --- What-if simulator ---

// MarkerOverride applies a hypothetical value for one biomarker. The
// engine uses the latest value for any marker not overridden.
message MarkerOverride {
  string metric_code = 1;
  double value = 2;
}

message SimulateApexAgeRequest {
  repeated MarkerOverride overrides = 1;
}
message SimulateApexAgeResponse {
  double current_apex_age = 1;
  double projected_apex_age = 2;
  double delta_years = 3; // projected - current
  string method = 4;
}

// --- Readiness (cross-pillar contract) ---

message ReadinessSnapshot {
  double readiness_0_100 = 1; // composite 0-100
  string verdict = 2;         // optimal | moderate | low | no-data
  double hrv_delta_ms = 3;    // window mean minus 30d baseline
  double rhr_delta_bpm = 4;   // window mean minus 30d baseline (negative = better)
  double sleep_score = 5;     // 0-100
  string recommendation = 6;  // one-line nudge for the calling pillar
}

message GetReadinessRequest {}
message GetReadinessResponse {
  ReadinessSnapshot snapshot = 1;
}

// === Phase 3 message types ===

// --- Concierge ---

message ConciergeThread {
  string id = 1;
  string subject = 2;
  string status = 3; // open | resolved | waiting_member
  int64 sla_due_at_unix = 4;
  int64 created_at_unix = 5;
  int64 updated_at_unix = 6;
  int32 message_count = 7;
}

message ConciergeMessage {
  string id = 1;
  string thread_id = 2;
  string sender_role = 3; // member | desk | system
  string body = 4;
  int64 created_at_unix = 5;
}

message StartConciergeThreadRequest {
  string subject = 1;
  string opening_message = 2;
}
message StartConciergeThreadResponse {
  ConciergeThread thread = 1;
}

message ListMyConciergeThreadsRequest {}
message ListMyConciergeThreadsResponse {
  repeated ConciergeThread threads = 1;
}

message GetConciergeThreadRequest {
  string thread_id = 1;
}
message GetConciergeThreadResponse {
  ConciergeThread thread = 1;
  repeated ConciergeMessage messages = 2;
}

message PostConciergeMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// --- Anthology ---

message AnthologyAuthor {
  string id = 1;
  string slug = 2;
  string name = 3;
  string credentials = 4;
  string bio_url = 5;
  string avatar_url = 6;
}

message AnthologyArticle {
  string id = 1;
  string slug = 2;
  AnthologyAuthor author = 3;
  string title = 4;
  string dek = 5;
  string body = 6;
  string hero_url = 7;
  int64 published_at_unix = 8;
  bool sovereign_only = 9;
}

message ListAnthologyArticlesRequest {}
message ListAnthologyArticlesResponse {
  repeated AnthologyArticle articles = 1;
}

message GetAnthologyArticleRequest {
  string slug = 1;
}
message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// --- Pharmacology ---

message PharmacologyEntry {
  string id = 1;
  string drug_name = 2;
  double dose_mg = 3;
  string schedule = 4;
  string kind = 5; // prescribed | off_label | otc
  string evidence_rating = 6; // A | B | C
  string notes = 7;            // decrypted server-side, plain text on the wire
  string started_on = 8;       // YYYY-MM-DD
  bool active = 9;
}

message ListMyPharmacologyRequest {}
message ListMyPharmacologyResponse {
  repeated PharmacologyEntry entries = 1;
}

message AddPharmacologyRequest {
  string drug_name = 1;
  double dose_mg = 2;
  string schedule = 3;
  string kind = 4;
  string evidence_rating = 5;
  string notes = 6;
  string started_on = 7;
}
message AddPharmacologyResponse {
  PharmacologyEntry entry = 1;
}

message RemovePharmacologyRequest {
  string entry_id = 1;
}
message RemovePharmacologyResponse {}

// --- DNA ---

message DnaUpload {
  string id = 1;
  string source = 2; // 23andme | ancestry | nebula | manual
  string status = 3; // pending | parsing | ready | failed
  string sha256 = 4;
  int64 parsed_at_unix = 5;
  int64 created_at_unix = 6;
}

message SnpEntry {
  string rsid = 1;
  string genotype = 2;
  string interpretation = 3;
  string evidence = 4;
}

message RegisterDnaUploadRequest {
  string media_asset_id = 1;
  string source = 2;
}
message RegisterDnaUploadResponse {
  DnaUpload upload = 1;
}

message ListMyDnaUploadsRequest {}
message ListMyDnaUploadsResponse {
  repeated DnaUpload uploads = 1;
}

message ListMyDnaSnpsRequest {}
message ListMyDnaSnpsResponse {
  repeated SnpEntry snps = 1;
}

// --- Lab partners ---

message LabPartner {
  string id = 1;
  string slug = 2;
  string name = 3;
  string region = 4;
  string referral_url = 5;
  int32 member_discount_pct = 6;
  string panel_summary = 7;
  string hero_url = 8;
  bool sovereign_only = 9;
}

message ListLabPartnersRequest {
  string region = 1; // optional filter
}
message ListLabPartnersResponse {
  repeated LabPartner partners = 1;
}

// === Phase 3.5 message types ===

// --- Manual lab extraction ---

message LabMarkerValue {
  string metric_code = 1;
  double value = 2;
  string unit = 3;
}

message ExtractLabMarkersRequest {
  string report_id = 1;
  repeated LabMarkerValue markers = 2;
  int64 recorded_at_unix = 3;
}
message ExtractLabMarkersResponse {
  int32 inserted = 1;
}

// --- Clinician shares ---

message ClinicianShare {
  string token = 1;
  string share_url = 2;
  string scope = 3;
  int64 created_at_unix = 4;
  int64 expires_at_unix = 5;
  bool revoked = 6;
}

message CreateClinicianShareRequest {
  int32 ttl_days = 1;
  string scope = 2;
}
message CreateClinicianShareResponse {
  ClinicianShare share = 1;
}

message ListMyClinicianSharesRequest {}
message ListMyClinicianSharesResponse {
  repeated ClinicianShare shares = 1;
}

message RevokeClinicianShareRequest {
  string token = 1;
}
message RevokeClinicianShareResponse {}

// --- Jet-lag protocol (Apex × Nomad) ---

message JetLagStep {
  int32 day_offset = 1;
  string light_action = 2;
  string melatonin_action = 3;
  string meal_action = 4;
  string notes = 5;
}

message GetJetLagProtocolRequest {
  int32 origin_tz_offset_min = 1;
  int32 dest_tz_offset_min = 2;
  int64 travel_at_unix = 3;
}
message GetJetLagProtocolResponse {
  int32 timezone_shift_hours = 1;
  string direction = 2;
  repeated JetLagStep steps = 3;
  string summary = 4;
}

// === Phase 4 message types ===

// --- Almanac ---

message GenerateHealthAlmanacRequest {
  string year = 1; // empty = current year
}
message GenerateHealthAlmanacResponse {
  string media_asset_id = 1;
  string public_url = 2;
  int64 generated_at_unix = 3;
  int32 page_count = 4;
}

// --- Imaging ---

message ImagingStudy {
  string id = 1;
  string modality = 2;        // e.g. "Coronary CTA", "Whole-Body MRI", "DEXA"
  string provider = 3;
  string performed_on = 4;    // YYYY-MM-DD
  string findings_text = 5;
  string headline_metric = 6; // e.g. "CAC score"
  double headline_value = 7;
  string headline_unit = 8;
  string media_asset_id = 9;
  int64 created_at_unix = 10;
}

message SubmitImagingStudyRequest {
  string modality = 1;
  string provider = 2;
  string performed_on = 3;
  string findings_text = 4;
  string headline_metric = 5;
  double headline_value = 6;
  string headline_unit = 7;
  string media_asset_id = 8;
}
message SubmitImagingStudyResponse {
  ImagingStudy study = 1;
}

message ListMyImagingStudiesRequest {}
message ListMyImagingStudiesResponse {
  repeated ImagingStudy studies = 1;
}

// --- Lounges ---

message Lounge {
  string id = 1;
  string slug = 2;
  string name = 3;
  string city = 4;
  string region = 5;
  string address = 6;
  string amenities = 7;   // comma-separated
  string hero_url = 8;
  bool sovereign_only = 9;
}

message LoungeBooking {
  string id = 1;
  Lounge lounge = 2;
  string amenity = 3;
  int64 scheduled_for_unix = 4;
  string status = 5;
}

message ListLoungesRequest {
  string region = 1;
}
message ListLoungesResponse {
  repeated Lounge lounges = 1;
}

message ListMyLoungeBookingsRequest {}
message ListMyLoungeBookingsResponse {
  repeated LoungeBooking bookings = 1;
}

message CreateLoungeBookingRequest {
  string lounge_id = 1;
  string amenity = 2;
  int64 scheduled_for_unix = 3;
}
message CreateLoungeBookingResponse {
  LoungeBooking booking = 1;
}

message CancelLoungeBookingRequest {
  string booking_id = 1;
}
message CancelLoungeBookingResponse {}

// --- Lab text parser ---

message ParseLabReportTextRequest {
  string report_id = 1;
  string text = 2; // OCR'd or pasted text
}
message ParseLabReportTextResponse {
  repeated LabMarkerValue extracted = 1;
}
