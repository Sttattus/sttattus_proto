  string id = 1;
  string metric_code = 2;
  string display_name = 3;
  string signal_kind = 4; // sustained_shift | rapid_rate_of_change | co_moving_cluster | baseline_breakout
  string direction = 5; // favorable | unfavorable | neutral_shift
  double baseline_value = 6;
  double current_value = 7;
  string unit = 8;
  double delta_pct = 9;
  double slope_per_30d = 10;
  repeated string co_moving_metrics = 11;
  string data_quality = 12; // verified_clinical | consistent_sensor | mixed_unverified | low_sample
  double confidence = 13;
  string summary = 14;
  string non_diagnostic_note = 15;
  string status = 16; // active | acknowledged | monitoring | dismissed_confounder | flagged_for_clinician
  string member_note = 17;
  int64 detected_at_unix = 18;
  int64 updated_at_unix = 19;
}

message ApexScoreSnapshot {
