// === Opportunity Choice 1 (AP1): Health Data Reliability Center message types ===

message HealthUnitConversionRule {
  string id = 1;
  string metric_code = 2;
  string from_unit = 3;
  string to_unit = 4;
  double multiplier = 5;
  double offset_val = 6;
  string conversion_version = 7;
  string notes = 8;
  bool active = 9;
}

message HealthSourceGrant {
  string id = 1;
  string source_code = 2; // health_connect | healthkit | oura | whoop | garmin | apple_watch | dexcom | libre | lab_report | manual
  string display_name = 3;
  string category = 4; // wearable | cgm | clinical_lab | manual
  string status = 5; // active | paused | revoked | error | disconnected
  int32 priority_rank = 6; // Lower rank = higher authority when multiple sources report same metric
  repeated string preferred_metrics = 7; // e.g. ['HRV', 'RHR', 'SLEEP_SCORE']
  int64 last_sync_at_unix = 8;
  string last_error = 9;
  int64 revoked_at_unix = 10;
  int32 observation_count = 11;
}

message CrossPillarHealthGrant {
  string id = 1;
  string target_pillar = 2; // forge | zenith | nomad
  string purpose_code = 3; // forge_readiness | zenith_hrv_load | nomad_circadian
  string display_title = 4;
  string description = 5;
  repeated string allowed_summary_fields = 6;
  bool enabled = 7;
  int64 updated_at_unix = 8;
  string revoked_reason = 9;
}

message ObservationRevision {
  string id = 1;
  string observation_kind = 2; // vital | glucose
  string observation_id = 3;
  string metric_code = 4;
  string actor_role = 5; // member | staff | system
  string action = 6; // create | correct | delete | restore | conflict_resolve | unit_normalize
  int32 revision = 7;
  double prev_value = 8;
  string prev_unit = 9;
  double new_value = 10;
