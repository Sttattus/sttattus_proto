// --- Imaging ---

message ImagingStudy {
  string id = 1;
  string modality = 2; // e.g. "Coronary CTA", "Whole-Body MRI", "DEXA"
  string provider = 3;
  string performed_on = 4; // YYYY-MM-DD
  string findings_text = 5;
  string headline_metric = 6; // e.g. "CAC score"
  double headline_value = 7;
  string headline_unit = 8;
  string media_asset_id = 9;
  int64 created_at_unix = 10;
  // Whether headline_value was recorded at all. A CAC score of 0 is the
  // best possible coronary result and the number a member most wants on
  // the record, so 0 cannot double as "not measured".
  bool headline_value_present = 11;
  // Choice 2 (AP2) — Imaging Intelligence metadata
  string document_format = 12; // pdf | dicom_manifest | image | portal_export
  string isolation_status = 13; // quarantined | scanning | clean | rejected_malware
  string review_state = 14; // provisional | member_confirmed | staff_verified | withdrawn
  string study_uid = 15;
  string revision_kind = 16; // original | addendum | corrected | duplicate
  string parent_study_id = 17;
  string impression_text = 18;
  string follow_up_text = 19;
  repeated ClinicalDocumentFact extracted_facts = 20;
}

message SubmitImagingStudyRequest {
  string modality = 1;
  string provider = 2;
  string performed_on = 3;
  string findings_text = 4;
  string headline_metric = 5;
  double headline_value = 6;
  string headline_unit = 7;
  string media_asset_id = 8;
  // See ImagingStudy.headline_value_present. Absent from an older client
  // means "0 is unset", which is the behaviour that lost a CAC of 0.
  bool headline_value_present = 9;
  string document_format = 10;
  string study_uid = 11;
  string revision_kind = 12;
  string parent_study_id = 13;
  string impression_text = 14;
  string follow_up_text = 15;
}
message SubmitImagingStudyResponse {
  ImagingStudy study = 1;
}

message ListMyImagingStudiesRequest {}
message ListMyImagingStudiesResponse {
  repeated ImagingStudy studies = 1;
}

