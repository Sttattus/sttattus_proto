// === Opportunity Choice 7 (AP7): Medication, Supplement, and Interaction Safety message types ===

message ReconciledMedicationItem {
  string id = 1;
  string item_kind = 2; // prescription | otc | supplement
  string display_name = 3;
  repeated string active_ingredients = 4; // e.g. ["rosuvastatin"], ["magnesium_glycinate"], ["red_yeast_rice", "monacolin_k"]
  string rxnorm_or_atc_code = 5; // e.g. "RxNorm:301542" | "ATC:C10AA07" | "DSLD:MAG-300"
  double dose_amount = 6;
  string dose_unit = 7; // mg | mcg | IU | g | mL
  string schedule = 8; // e.g. "Evening with dinner", "Morning fasting"
  string prescriber_name = 9;
  string pharmacy_name = 10;
  string indication = 11;
  string started_on = 12; // YYYY-MM-DD
  string stopped_on = 13; // YYYY-MM-DD (empty if active)
  string reconciliation_status = 14; // reconciled | needs_clinician_confirm | discontinued
  string refill_due_date = 15; // YYYY-MM-DD
  string lot_or_batch_code = 16;
  bool travel_letter_ready = 17;
  string safe_disposal_guidance = 18;
  string member_notes = 19;
  int64 updated_at_unix = 20;
}

message AllergyIntoleranceEntry {
  string id = 1;
  string substance = 2; // e.g. "Penicillin", "NSAIDs (Ibuprofen)", "Shellfish Iodine"
  string substance_class = 3; // beta_lactam | nsaid | statin | excipient | food | other
  string reaction_kind = 4; // allergy | intolerance | contraindication
  string severity = 5; // mild | moderate | severe_anaphylaxis
  string manifestation = 6; // e.g. "Urticaria and bronchospasm", "GI distress"
  string recorded_on = 7; // YYYY-MM-DD
  bool verified_by_clinician = 8;
  string notes = 9;
}

message SafetyInteractionRule {
  string id = 1;
  string rule_code = 2;
  string version = 3; // e.g. "v2026.1"
  string interaction_vector = 4; // drug_drug | drug_supplement | duplicate_ingredient | dose_ceiling | pregnancy_lactation | pre_procedure | lab_interference | food_timing | allergy_cross_reactivity
  string trigger_a = 5; // ingredient or class A
  string trigger_b = 6; // ingredient, context, lab, or allergy class B
  string action_tier = 7; // informational | pharmacist_review | clinician_review | urgent_care_resource
  string title = 8;
  string clinical_summary = 9;
  string non_directive_guidance = 10; // Never tells member to stop/alter prescribed treatment without clinician
  string appointment_question_prompt = 11;
  string source_vendor = 12; // e.g. "RxNorm / DailyMed + Stockley / Natural Medicines 2026"
  string jurisdiction = 13; // US | EU | UK | GLOBAL
  string reviewer_name = 14;
  string reviewer_credentials = 15;
  string status = 16; // active | draft | withdrawn
