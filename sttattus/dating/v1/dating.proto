syntax = "proto3";

package sttattus.dating.v1;

import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/dating/v1;datingv1";

enum SwipeDirection {
  SWIPE_DIRECTION_UNSPECIFIED = 0;
  SWIPE_DIRECTION_PASS = 1;
  SWIPE_DIRECTION_LIKE = 2;
  SWIPE_DIRECTION_SUPER = 3;
}

enum DatingIntent {
  DATING_INTENT_UNSPECIFIED = 0;
  DATING_INTENT_CASUAL = 1;
  DATING_INTENT_RELATIONSHIP = 2;
  DATING_INTENT_FRIENDS = 3;
  DATING_INTENT_NETWORKING = 4;
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message DatingProfile {
  string user_id = 1;
  string name = 2;
  string bio = 3;
  DatingIntent intent = 4;
  int32 behavioral_score = 5;
  string tier = 6;
  double luminance = 7;
  Vec3 position = 8;
  int32 intellectual_pace = 9;
  int32 emotional_granularity = 10;
  int32 physical_drive = 11;
  int32 social_battery = 12;
  repeated string photo_urls = 13;
  double vault_rank = 14;
  double apex_rank = 15;
  double forge_rank = 16;

  // --- Demographics (A9P5) ---
  // Derived from birth_date server-side; ignored on UpdateProfile.
  int32 age = 17;
  // 'man' | 'woman' | 'nonbinary' | 'other'. Empty when unset.
  string gender = 18;
  string city = 19;
  string country_code = 20;
  repeated string interests = 21;
  // ISO-8601 date (YYYY-MM-DD). Writable; `age` is computed from it.
  string birth_date = 22;
}

// Discovery preferences (A9P5). Backs the Settings distance/age/show-me
// controls and filters StreamDiscovery candidates.
message DiscoveryPreferences {
  int32 max_distance_miles = 1;
  int32 min_age = 2;
  int32 max_age = 3;
  // 'everyone' | 'men' | 'women' | 'nonbinary'
  string show_me = 4;
}

message GetDiscoveryPreferencesRequest {}
message GetDiscoveryPreferencesResponse {
  DiscoveryPreferences preferences = 1;
}

message UpdateDiscoveryPreferencesRequest {
  DiscoveryPreferences preferences = 1;
}
message UpdateDiscoveryPreferencesResponse {
  DiscoveryPreferences preferences = 1;
}

message Candidate {
  DatingProfile profile = 1;
  double match_score = 2; // computed by Rust scoring
}

message Match {
  string id = 1;
  DatingProfile other = 2;
  int64 created_at = 3;
  int64 last_message_at = 4;
}

message Message {
  string id = 1;
  string match_id = 2;
  string sender_id = 3;
  string body = 4;
  int32 tension_level = 5;
  int64 created_at = 6;
  int64 read_at = 7;
}

message GetProfileRequest {
  string user_id = 1; // empty = current user
}
message GetProfileResponse {
  DatingProfile profile = 1;
}

message UpdateProfileRequest {
  DatingProfile profile = 1;
}
message UpdateProfileResponse {
  DatingProfile profile = 1;
}

message StreamDiscoveryRequest {
  int32 batch_size = 1;
}
message StreamDiscoveryResponse {
  Candidate candidate = 1;
}

message SwipeRequest {
  string target_user_id = 1;
  SwipeDirection direction = 2;
}
message SwipeResponse {
  bool is_match = 1;
  Match match = 2; // populated when is_match
}

message ListMatchesRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListMatchesResponse {
  repeated Match matches = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message UnmatchRequest {
  string match_id = 1;
}
message UnmatchResponse {}

message StreamMessagesRequest {
  string match_id = 1;
}
message StreamMessagesResponse {
  Message message = 1;
}

message SendMessageRequest {
  string match_id = 1;
  string body = 2;
}
message SendMessageResponse {
  Message message = 1;
}

// === Identity verification (A9.2) ===

message AtlasVerification {
  string id = 1;
  string provider = 2; // persona | onfido | veriff | manual
  string external_id = 3;
  string status = 4;
  string highest_check = 5;
  string reason = 6;
  int64 created_at = 7; // unix seconds
  int64 decided_at = 8; // unix seconds, 0 when undecided
  string hosted_flow_url = 9;
}

message StartVerificationRequest {}
message StartVerificationResponse {
  AtlasVerification verification = 1;
}

message GetLatestVerificationRequest {}
message GetLatestVerificationResponse {
  AtlasVerification verification = 1;
}

// === Tension Seats (A9.4) ===

message TensionSeat {
  string id = 1;
  int32 slot = 2; // 0..4
  string state = 3;
  string target_id = 4;
  string bid_message = 5;
  int64 expires_at = 6;
  int64 shattered_at = 7;
  int64 accepted_at = 8;
}

message ListTensionSeatsRequest {}
message ListTensionSeatsResponse {
  repeated TensionSeat seats = 1;
}

message PlaceTensionBidRequest {
  string seat_id = 1;
  string target_id = 2;
  string bid_message = 3;
}
message PlaceTensionBidResponse {
  TensionSeat seat = 1;
}

message ReleaseTensionSeatRequest {
  string seat_id = 1;
}
message ReleaseTensionSeatResponse {
  TensionSeat seat = 1;
}

// === Akashic Record v2 (A9.5) ===

message AkashicChapter {
  string id = 1;
  string chapter_key = 2;
  string title = 3;
  string body = 4;
  string visibility = 5;
}

message ListAuthorAkashicRequest {}
message ListAuthorAkashicResponse {
  repeated AkashicChapter chapters = 1;
}

message ListVisibleAkashicRequest {
  string target_user_id = 1;
}
message ListVisibleAkashicResponse {
  repeated AkashicChapter chapters = 1;
}

message UpsertAkashicChapterRequest {
  string chapter_key = 1;
  string title = 2;
  string body = 3;
  string visibility = 4;
}
message UpsertAkashicChapterResponse {
  AkashicChapter chapter = 1;
}

message DeleteAkashicChapterRequest {
  string chapter_key = 1;
}
message DeleteAkashicChapterResponse {}

// === Safety center (A9.6) ===

message UserBlock {
  string id = 1;
  string blocked_id = 2;
  string reason = 3;
  int64 created_at = 4;
}

message ListMyBlocksRequest {}
message ListMyBlocksResponse {
  repeated UserBlock blocks = 1;
}

message BlockUserRequest {
  string blocked_id = 1;
  string reason = 2;
}
message BlockUserResponse {
  UserBlock block = 1;
}

message UnblockUserRequest {
  string blocked_id = 1;
}
message UnblockUserResponse {}

message UserReport {
  string id = 1;
  string reported_id = 2;
  string category = 3;
  string description = 4;
  string status = 5;
  int64 created_at = 6;
  int64 decided_at = 7;
}

message ListMyReportsRequest {}
message ListMyReportsResponse {
  repeated UserReport reports = 1;
}

message ReportUserRequest {
  string reported_id = 1;
  string category = 2;
  string description = 3;
}
message ReportUserResponse {
  UserReport report = 1;
}

message PanicContact {
  string contact_phone_e164 = 1;
  string contact_name = 2;
  string context_note = 3;
}

message GetPanicContactRequest {}
message GetPanicContactResponse {
  PanicContact contact = 1;
}

message UpsertPanicContactRequest {
  string contact_phone_e164 = 1;
  string contact_name = 2;
  string context_note = 3;
}
message UpsertPanicContactResponse {
  PanicContact contact = 1;
}

// === Privacy axes (A9.8) ===

message PrivacyAxes {
  string vault_rank = 1;
  string apex_rank = 2;
  string forge_rank = 3;
  string luminance = 4;
  string intellectual_pace = 5;
  string emotional_granularity = 6;
  string physical_drive = 7;
  string social_battery = 8;
  string tier = 9;
}

message GetPrivacyAxesRequest {}
message GetPrivacyAxesResponse {
  PrivacyAxes axes = 1;
}

message UpsertPrivacyAxesRequest {
  PrivacyAxes axes = 1;
}
message UpsertPrivacyAxesResponse {
  PrivacyAxes axes = 1;
}

// === Atlas map v2 (A9P2.2) ===

message AtlasMapPoint {
  string user_id = 1;
  string name = 2;
  double x = 3;
  double y = 4;
  double z = 5;
  double luminance = 6;
  string tier = 7;
  DatingIntent intent = 8;
  int32 intellectual_pace = 9;
}

message ListAtlasMapPointsRequest {}
message ListAtlasMapPointsResponse {
  repeated AtlasMapPoint points = 1;
}

// === Agora V3 live rooms (A9P2.3 / A9P2.7 expansion) ===

message AgoraRoom {
  string id = 1;
  string host_id = 2;
  string title = 3;
  string cluster = 4;
  int32 max_guests = 5;
  string status = 6;
  string livekit_room_name = 7;
  int64 started_at = 8;
  int64 ended_at = 9;
  bool is_video_enabled = 10;
  bool is_encrypted = 11;
}

message ListLiveRoomsRequest {
  string cluster = 1;
}
message ListLiveRoomsResponse {
  repeated AgoraRoom rooms = 1;
}

message CreateAgoraRoomRequest {
  string title = 1;
  string cluster = 2;
  int32 max_guests = 3;
  bool enable_video = 4;
}
message CreateAgoraRoomResponse {
  AgoraRoom room = 1;
}

message EndAgoraRoomRequest {
  string room_id = 1;
}
message EndAgoraRoomResponse {
  AgoraRoom room = 1;
}

message MintLiveKitTokenRequest {
  string room_id = 1;
}
message MintLiveKitTokenResponse {
  string token = 1;
  string ws_url = 2;
}

// === Voice + video messages (A9P2.4) ===

message MessageAttachment {
  string id = 1;
  string message_id = 2;
  string media_asset_id = 3;
  string kind = 4;
  int32 duration_seconds = 5;
}

message AttachMediaToMessageRequest {
  string message_id = 1;
  string media_asset_id = 2;
  string kind = 3;
  int32 duration_seconds = 4;
}
message AttachMediaToMessageResponse {
  MessageAttachment attachment = 1;
}

message ListMessageAttachmentsRequest {
  string message_id = 1;
}
message ListMessageAttachmentsResponse {
  repeated MessageAttachment attachments = 1;
}

// === Restaurant partner integration (A9P2.5) ===

message Restaurant {
  string id = 1;
  string name = 2;
  string city = 3;
  string neighborhood = 4;
  string partner = 5;
  string partner_external_id = 6;
  bool is_atlas_curated = 7;
  string cuisine = 8;
  int32 price_tier = 9;
}

message ListRestaurantsRequest {
  string city = 1;
}
message ListRestaurantsResponse {
  repeated Restaurant restaurants = 1;
}

message Reservation {
  string id = 1;
  string restaurant_id = 2;
  string match_id = 3;
  int32 party_size = 4;
  int64 requested_at = 5;
  string status = 6;
  string partner_reservation_id = 7;
  string note = 8;
  int64 created_at = 9;
  int64 decided_at = 10;
}

message CreateReservationRequest {
  string restaurant_id = 1;
  string match_id = 2;
  int32 party_size = 3;
  int64 requested_at = 4;
  string note = 5;
}
message CreateReservationResponse {
  Reservation reservation = 1;
}

message ListMyReservationsRequest {}
message ListMyReservationsResponse {
  repeated Reservation reservations = 1;
}

message CancelReservationRequest {
  string id = 1;
}
message CancelReservationResponse {
  Reservation reservation = 1;
}

// === Compatibility Matrix (A9P2.6 / A9P3 expansion) ===

message CompatibilityFactor {
  string label = 1;
  double score = 2; // 0..1
  string interpretation = 3;
}

message CompatibilityMatrix {
  string left_user_id = 1;
  string right_user_id = 2;
  double aggregate_score = 3;
  repeated CompatibilityFactor factors = 4;
  string dynamic_tension_status = 5;
}

message GetCompatibilityMatrixRequest {
  string other_user_id = 1;
}
message GetCompatibilityMatrixResponse {
  CompatibilityMatrix matrix = 1;
}

// === Gift Ledger (A9P3 expansion) ===

message Gift {
  string id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  string asset_type = 4; // 'currency' | 'status_booster' | 'shards'
  double value = 5;
  string message = 6;
  int64 sent_at = 7;
  bool is_anonymous = 8;
}

message SendGiftRequest {
  string receiver_id = 1;
  string asset_type = 2;
  double value = 3;
  string message = 4;
  bool anonymous = 5;
}
message SendGiftResponse {
  Gift gift = 1;
}

message ListGiftLedgerRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListGiftLedgerResponse {
  repeated Gift gifts = 1;
  sttattus.common.v1.PageResponse page = 2;
}

// === Missions (A9P2 / retention) ===

message Mission {
  string id = 1;
  string title = 2;
  string description = 3;
  string requirement_type = 4;
  int32 requirement_value = 5;
  int32 experience_reward = 6;
  bool completed = 7;
  int64 completed_at = 8; // unix seconds, 0 when not completed
}

message ListMissionsRequest {}
message ListMissionsResponse {
  repeated Mission missions = 1;
}

message CompleteMissionRequest {
  string mission_id = 1;
}
message CompleteMissionResponse {
  int32 experience_reward = 1;
  int64 completed_at = 2;
}

// === Concierge matchmaker (A9P3 §4.4.30, Sovereign) ===

message ConciergeThread {
  string id = 1;
  string matchmaker_name = 2;
  string subject = 3;
  string status = 4;
  int64 sla_due_at = 5;
  int64 created_at = 6;
}

message ConciergeMessage {
  string id = 1;
  string thread_id = 2;
  string sender_role = 3; // user | matchmaker | system
  string body = 4;
  int64 created_at = 5;
}

message StartConciergeThreadRequest {
  string subject = 1;
  string opening_message = 2;
}
message StartConciergeThreadResponse {
  ConciergeThread thread = 1;
}

message ListMyConciergeThreadsRequest {}
message ListMyConciergeThreadsResponse {
  repeated ConciergeThread threads = 1;
}

message GetConciergeThreadRequest {
  string thread_id = 1;
}
message GetConciergeThreadResponse {
  ConciergeThread thread = 1;
  repeated ConciergeMessage messages = 2;
}

message PostConciergeMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// === Matchmaker proposals (A9P3 §4.4.30) ===

message MatchmakerProposal {
  string id = 1;
  string candidate_user_id = 2;
  string candidate_name = 3;
  string rationale = 4;
  string status = 5; // proposed | accepted | declined
  int64 created_at = 6;
}

message ListMatchmakerProposalsRequest {}
message ListMatchmakerProposalsResponse {
  repeated MatchmakerProposal proposals = 1;
}

message RespondMatchmakerProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
}
message RespondMatchmakerProposalResponse {
  MatchmakerProposal proposal = 1;
}

// === Atlas Letters (A9P3 §4.14.96) ===

message AtlasLetter {
  string id = 1;
  string slug = 2;
  string title = 3;
  string dek = 4;
  string body = 5;
  string hero_url = 6;
  string author_name = 7;
  string author_credentials = 8;
  bool sovereign_only = 9;
  int64 published_at = 10;
}

message ListAtlasLettersRequest {}
message ListAtlasLettersResponse {
  repeated AtlasLetter letters = 1;
}

message GetAtlasLetterRequest {
  string slug = 1;
}
message GetAtlasLetterResponse {
  AtlasLetter letter = 1;
}

// === Events / Salons (A9P3 §4.3.33) ===

message AtlasEvent {
  string id = 1;
  string slug = 2;
  string title = 3;
  string city = 4;
  string venue = 5;
  string kind = 6;
  string dress_code = 7;
  string description = 8;
  int32 capacity = 9;
  bool sovereign_only = 10;
  int64 starts_at = 11;
  string my_rsvp_status = 12; // '' when not RSVP'd
  int32 going_count = 13;
}

message ListEventsRequest {
  string city = 1;
}
message ListEventsResponse {
  repeated AtlasEvent events = 1;
}

message RsvpEventRequest {
  string event_id = 1;
  bool cancel = 2;
}
message RsvpEventResponse {
  string status = 1;
}

message ListMyEventRsvpsRequest {}
message ListMyEventRsvpsResponse {
  repeated AtlasEvent events = 1;
}

// === Member profile share (A9P3.5 — token-based read-only snapshot) ===

message ProfileShareToken {
  string id = 1;
  string token = 2;
  string url = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
  bool revoked = 6;
}

message CreateProfileShareRequest {
  int32 ttl_days = 1; // 0 => default 14
}
message CreateProfileShareResponse {
  ProfileShareToken share = 1;
}

message ListMyProfileSharesRequest {}
message ListMyProfileSharesResponse {
  repeated ProfileShareToken shares = 1;
}

message RevokeProfileShareRequest {
  string id = 1;
}
message RevokeProfileShareResponse {}

// === Atlas Year in Review (A9P4 — annual recap PDF) ===

message GenerateAtlasYearbookRequest {
  string year = 1; // empty => current year
}
message GenerateAtlasYearbookResponse {
  string media_asset_id = 1;
  string public_url = 2;
  int32 page_count = 3;
  int64 generated_at = 4;
}

// === Event check-in (A9P4 — salons NFC-at-the-door analogue) ===

message CheckInEventRequest {
  string event_id = 1;
}
message CheckInEventResponse {
  string status = 1; // attended
}

// === Cross-pillar gate explainer (A9 §3 honest gating) ===

message CrossPillarGate {
  string pillar = 1; // vault | apex | forge
  double current_score = 2;
  double required_score = 3;
  bool met = 4;
}

message GetCrossPillarGateRequest {}
message GetCrossPillarGateResponse {
  repeated CrossPillarGate gates = 1;
  bool all_met = 2;
  string headline = 3;
}

service DatingService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc StreamDiscovery(StreamDiscoveryRequest) returns (stream StreamDiscoveryResponse);
  rpc Swipe(SwipeRequest) returns (SwipeResponse);
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);
  // A9 — leave a match ("Exit Bridge"). Shatters it for both parties.
  rpc Unmatch(UnmatchRequest) returns (UnmatchResponse);
  rpc StreamMessages(StreamMessagesRequest) returns (stream StreamMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc StartVerification(StartVerificationRequest) returns (StartVerificationResponse);
  rpc GetLatestVerification(GetLatestVerificationRequest) returns (GetLatestVerificationResponse);

  rpc ListTensionSeats(ListTensionSeatsRequest) returns (ListTensionSeatsResponse);
  rpc PlaceTensionBid(PlaceTensionBidRequest) returns (PlaceTensionBidResponse);
  rpc ReleaseTensionSeat(ReleaseTensionSeatRequest) returns (ReleaseTensionSeatResponse);

  rpc ListAuthorAkashic(ListAuthorAkashicRequest) returns (ListAuthorAkashicResponse);
  rpc ListVisibleAkashic(ListVisibleAkashicRequest) returns (ListVisibleAkashicResponse);
  rpc UpsertAkashicChapter(UpsertAkashicChapterRequest) returns (UpsertAkashicChapterResponse);
  rpc DeleteAkashicChapter(DeleteAkashicChapterRequest) returns (DeleteAkashicChapterResponse);

  rpc ListMyBlocks(ListMyBlocksRequest) returns (ListMyBlocksResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
  rpc ListMyReports(ListMyReportsRequest) returns (ListMyReportsResponse);
  rpc ReportUser(ReportUserRequest) returns (ReportUserResponse);
  rpc GetPanicContact(GetPanicContactRequest) returns (GetPanicContactResponse);
  rpc UpsertPanicContact(UpsertPanicContactRequest) returns (UpsertPanicContactResponse);

  rpc GetPrivacyAxes(GetPrivacyAxesRequest) returns (GetPrivacyAxesResponse);
  rpc UpsertPrivacyAxes(UpsertPrivacyAxesRequest) returns (UpsertPrivacyAxesResponse);

  rpc ListAtlasMapPoints(ListAtlasMapPointsRequest) returns (ListAtlasMapPointsResponse);

  rpc ListLiveRooms(ListLiveRoomsRequest) returns (ListLiveRoomsResponse);
  rpc CreateAgoraRoom(CreateAgoraRoomRequest) returns (CreateAgoraRoomResponse);
  rpc EndAgoraRoom(EndAgoraRoomRequest) returns (EndAgoraRoomResponse);
  rpc MintLiveKitToken(MintLiveKitTokenRequest) returns (MintLiveKitTokenResponse);

  rpc AttachMediaToMessage(AttachMediaToMessageRequest) returns (AttachMediaToMessageResponse);
  rpc ListMessageAttachments(ListMessageAttachmentsRequest) returns (ListMessageAttachmentsResponse);

  rpc ListRestaurants(ListRestaurantsRequest) returns (ListRestaurantsResponse);
  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse);
  rpc ListMyReservations(ListMyReservationsRequest) returns (ListMyReservationsResponse);
  rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);

  // A9P2.6 / A9P3 — deep compatibility matrix.
  rpc GetCompatibilityMatrix(GetCompatibilityMatrixRequest) returns (GetCompatibilityMatrixResponse);

  // A9P3 — Gift Ledger
  rpc SendGift(SendGiftRequest) returns (SendGiftResponse);
  rpc ListGiftLedger(ListGiftLedgerRequest) returns (ListGiftLedgerResponse);

  // A9P5 — Discovery preferences (distance / age range / show-me)
  rpc GetDiscoveryPreferences(GetDiscoveryPreferencesRequest) returns (GetDiscoveryPreferencesResponse);
  rpc UpdateDiscoveryPreferences(UpdateDiscoveryPreferencesRequest) returns (UpdateDiscoveryPreferencesResponse);

  // A9P2 — Missions (server-backed; replaces the local-only ObjectBox path)
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);
  rpc CompleteMission(CompleteMissionRequest) returns (CompleteMissionResponse);

  // A9P3 — Concierge matchmaker (Sovereign)
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // A9P3 — Matchmaker proposals
  rpc ListMatchmakerProposals(ListMatchmakerProposalsRequest) returns (ListMatchmakerProposalsResponse);
  rpc RespondMatchmakerProposal(RespondMatchmakerProposalRequest) returns (RespondMatchmakerProposalResponse);

  // A9P3 — Atlas Letters editorial
  rpc ListAtlasLetters(ListAtlasLettersRequest) returns (ListAtlasLettersResponse);
  rpc GetAtlasLetter(GetAtlasLetterRequest) returns (GetAtlasLetterResponse);

  // A9P3 — Events / Salons
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc RsvpEvent(RsvpEventRequest) returns (RsvpEventResponse);
  rpc ListMyEventRsvps(ListMyEventRsvpsRequest) returns (ListMyEventRsvpsResponse);

  // A9 — Cross-pillar gate explainer
  rpc GetCrossPillarGate(GetCrossPillarGateRequest) returns (GetCrossPillarGateResponse);

  // A9P3.5 — Member profile share (token-based)
  rpc CreateProfileShare(CreateProfileShareRequest) returns (CreateProfileShareResponse);
  rpc ListMyProfileShares(ListMyProfileSharesRequest) returns (ListMyProfileSharesResponse);
  rpc RevokeProfileShare(RevokeProfileShareRequest) returns (RevokeProfileShareResponse);

  // A9P4 — Category-leading
  rpc GenerateAtlasYearbook(GenerateAtlasYearbookRequest) returns (GenerateAtlasYearbookResponse);
  rpc CheckInEvent(CheckInEventRequest) returns (CheckInEventResponse);
}
