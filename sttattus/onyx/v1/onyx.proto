  google.protobuf.Timestamp snoozed_until = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message IntelligenceGraphMeetingBriefSection {
  string kind = 1; // context | claims | contradictions | decisions | questions | tasks | changes
  string title = 2;
  string body = 3;
  repeated string node_ids = 4;
  repeated IntelligenceGraphSourceAnchor citations = 5;
}

message IntelligenceGraphMeetingBrief {
  string id = 1;
  string title = 2;
  string purpose = 3;
  string status = 4; // draft | reviewed | archived
  string scope = 5; // private | room
  string room_id = 6;
  repeated string selected_node_ids = 7;
  repeated IntelligenceGraphMeetingBriefSection sections = 8;
  string manifest_checksum = 9;
  int64 version = 10;
  google.protobuf.Timestamp window_start = 11;
  google.protobuf.Timestamp window_end = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message IntelligenceGraphOverview {
  int32 active_nodes = 1;
  int32 active_edges = 2;
  int32 pending_suggestions = 3;
  int32 unresolved_questions = 4;
  int32 contradictions = 5;
  int32 due_resurfacing = 6;
  int32 meeting_briefs = 7;
  google.protobuf.Timestamp last_changed_at = 8;
}

message GetPersonalIntelligenceGraphRequest {
  string query = 1;
  repeated string node_types = 2;
  repeated string relations = 3;
  string scope = 4; // all | private | room
  string room_id = 5;
  bool include_archived = 6;
  int32 limit = 7;
}
message GetPersonalIntelligenceGraphResponse {
  IntelligenceGraphOverview overview = 1;
  repeated IntelligenceGraphNode nodes = 2;
  repeated IntelligenceGraphEdge edges = 3;
}

message UpsertIntelligenceGraphNodeRequest {
  string id = 1;
  string node_type = 2;
  string title = 3;
  string summary = 4;
  string scope = 5;
  string room_id = 6;
  string verification_status = 7;
  double confidence = 8;
  string confidence_basis = 9;
  google.protobuf.Timestamp valid_from = 10;
  google.protobuf.Timestamp valid_to = 11;
  repeated IntelligenceGraphSourceAnchor anchors = 12;
  int64 expected_version = 13;
  string client_mutation_id = 14;
}
message UpsertIntelligenceGraphNodeResponse {
  IntelligenceGraphNode node = 1;
}

message SetIntelligenceGraphNodeStateRequest {
  string id = 1;
  string action = 2; // archive | restore | delete
  string reason = 3;
  int64 expected_version = 4;
  string client_mutation_id = 5;
}
message SetIntelligenceGraphNodeStateResponse {
  IntelligenceGraphNode node = 1;
}

message MergeIntelligenceGraphNodesRequest {
  string primary_node_id = 1;
  string duplicate_node_id = 2;
  string reason = 3;
  int64 expected_primary_version = 4;
  int64 expected_duplicate_version = 5;
  string client_mutation_id = 6;
}
message MergeIntelligenceGraphNodesResponse {
  IntelligenceGraphNode primary_node = 1;
  IntelligenceGraphNode merged_node = 2;
}

message SplitIntelligenceGraphNodeRequest {
  string source_node_id = 1;
  string new_title = 2;
  string new_summary = 3;
  repeated string move_anchor_ids = 4;
  repeated string move_edge_ids = 5;
  string reason = 6;
  int64 expected_version = 7;
  string client_mutation_id = 8;
}
message SplitIntelligenceGraphNodeResponse {
  IntelligenceGraphNode source_node = 1;
  IntelligenceGraphNode new_node = 2;
}

message UpsertIntelligenceGraphEdgeRequest {
  string id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  string relation = 4;
  string label = 5;
  string scope = 6;
  string room_id = 7;
  double confidence = 8;
  string confidence_basis = 9;
  string explanation = 10;
  repeated IntelligenceGraphSourceAnchor anchors = 11;
  int64 expected_version = 12;
  string client_mutation_id = 13;
}
message UpsertIntelligenceGraphEdgeResponse {
  IntelligenceGraphEdge edge = 1;
}

message SetIntelligenceGraphEdgeStateRequest {
  string id = 1;
  string action = 2; // archive | restore | delete
  string reason = 3;
  int64 expected_version = 4;
  string client_mutation_id = 5;
}
message SetIntelligenceGraphEdgeStateResponse {
  IntelligenceGraphEdge edge = 1;
}

message GenerateIntelligenceGraphSuggestionsRequest {
  string scope = 1; // all | annotations | watchlists | briefs | rooms
  string room_id = 2;
  int32 limit = 3;
  string client_mutation_id = 4;
}
message GenerateIntelligenceGraphSuggestionsResponse {
  int32 generated = 1;
  repeated IntelligenceGraphSuggestion suggestions = 2;
}
message ListIntelligenceGraphSuggestionsRequest {
  string status = 1; // pending | accepted | rejected | expired | all
  int32 limit = 2;
}
message ListIntelligenceGraphSuggestionsResponse {
  repeated IntelligenceGraphSuggestion suggestions = 1;
}
message SetIntelligenceGraphSuggestionStateRequest {
  string id = 1;
  string action = 2; // accept | reject
  string note = 3;
  string client_mutation_id = 4;
}
message SetIntelligenceGraphSuggestionStateResponse {
  IntelligenceGraphSuggestion suggestion = 1;
  IntelligenceGraphNode accepted_node = 2;
  IntelligenceGraphEdge accepted_edge = 3;
}

message ListIntelligenceGraphTimelineRequest {
  repeated string node_ids = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 limit = 4;
}
message ListIntelligenceGraphTimelineResponse {
  repeated IntelligenceGraphTimelineEvent events = 1;
}

message ListIntelligenceGraphResurfacingRequest {
  string state = 1; // pending | snoozed | completed | dismissed | all
  int32 limit = 2;
}
message ListIntelligenceGraphResurfacingResponse {
  repeated IntelligenceGraphResurfacingItem items = 1;
}
message SetIntelligenceGraphResurfacingStateRequest {
  string id = 1;
  string action = 2; // snooze | complete | dismiss | reopen
  google.protobuf.Timestamp snoozed_until = 3;
  string reason = 4;
  string client_mutation_id = 5;
}
message SetIntelligenceGraphResurfacingStateResponse {
  IntelligenceGraphResurfacingItem item = 1;
}

message CreateIntelligenceGraphMeetingBriefRequest {
  string title = 1;
  string purpose = 2;
  string scope = 3;
  string room_id = 4;
  repeated string node_ids = 5;
  google.protobuf.Timestamp window_start = 6;
  google.protobuf.Timestamp window_end = 7;
  string client_mutation_id = 8;
}
message CreateIntelligenceGraphMeetingBriefResponse {
  IntelligenceGraphMeetingBrief brief = 1;
}
message GetIntelligenceGraphMeetingBriefRequest {
  string id = 1;
}
message GetIntelligenceGraphMeetingBriefResponse {
  IntelligenceGraphMeetingBrief brief = 1;
}
message ListIntelligenceGraphMeetingBriefsRequest {
  string status = 1;
  int32 limit = 2;
}
message ListIntelligenceGraphMeetingBriefsResponse {
  repeated IntelligenceGraphMeetingBrief briefs = 1;
}

message ExportPersonalIntelligenceGraphRequest {
  string format = 1; // json | markdown | csv
  bool include_archived = 2;
}
message ExportPersonalIntelligenceGraphResponse {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  string checksum = 4;
  google.protobuf.Timestamp generated_at = 5;
}

message RebuildPersonalIntelligenceGraphRequest {
  string reason = 1;
  string client_mutation_id = 2;
}
message RebuildPersonalIntelligenceGraphResponse {
  string job_id = 1;
  string status = 2;
}

service OnyxService {
  // Profile Management
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // Content Delivery (Server-Side Gated)
  rpc ListContent(ListContentRequest) returns (ListContentResponse);

  // Exclusivity Mechanics
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);

  // P6.2 — content + library reads.
  rpc GetContent(GetContentRequest) returns (GetContentResponse);
  rpc ListShelf(ListShelfRequest) returns (ListShelfResponse);
  rpc ListContinue(ListContinueRequest) returns (ListContinueResponse);
  rpc GetShelves(GetShelvesRequest) returns (GetShelvesResponse);
  rpc RecordProgress(RecordProgressRequest) returns (RecordProgressResponse);

  // P6.6 — spend points to unlock one gated piece.
  rpc RedeemContent(RedeemContentRequest) returns (RedeemContentResponse);
  // P6.6 — open a Stripe checkout for the Onyx network subscription.
  rpc CreateSubscriptionCheckout(CreateSubscriptionCheckoutRequest) returns (CreateSubscriptionCheckoutResponse);

  // P2 — creators.
  rpc GetCreator(GetCreatorRequest) returns (GetCreatorResponse);
  rpc ListCreatorWorks(ListCreatorWorksRequest) returns (ListCreatorWorksResponse);
  rpc FollowCreator(FollowCreatorRequest) returns (FollowCreatorResponse);

  // P2 — search.
  rpc SearchContent(SearchContentRequest) returns (SearchContentResponse);

  // P2 — notes / highlights.
  rpc AddNote(AddNoteRequest) returns (AddNoteResponse);
  rpc ListMyNotes(ListMyNotesRequest) returns (ListMyNotesResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // Reader OS — stable passages, private highlights/notes/bookmarks,
  // cross-library search/export, and an offline-safe change cursor.
  rpc UpsertReaderAnnotation(UpsertReaderAnnotationRequest) returns (UpsertReaderAnnotationResponse);
  rpc DeleteReaderAnnotation(DeleteReaderAnnotationRequest) returns (DeleteReaderAnnotationResponse);
  rpc ListMyReaderAnnotations(ListMyReaderAnnotationsRequest) returns (ListMyReaderAnnotationsResponse);
  rpc SearchReader(SearchReaderRequest) returns (SearchReaderResponse);
  rpc SearchIntelligence(SearchIntelligenceRequest) returns (SearchIntelligenceResponse);
  rpc RecordIntelligenceSearchOutcome(RecordIntelligenceSearchOutcomeRequest) returns (RecordIntelligenceSearchOutcomeResponse);
  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse);
  rpc UpsertSavedQuery(UpsertSavedQueryRequest) returns (UpsertSavedQueryResponse);
  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (DeleteSavedQueryResponse);
  rpc ListWatchlists(ListWatchlistsRequest) returns (ListWatchlistsResponse);
  rpc UpsertWatchlist(UpsertWatchlistRequest) returns (UpsertWatchlistResponse);
  rpc DeleteWatchlist(DeleteWatchlistRequest) returns (DeleteWatchlistResponse);
  rpc RefreshWatchlist(RefreshWatchlistRequest) returns (RefreshWatchlistResponse);
  rpc ListIntelligenceAlerts(ListIntelligenceAlertsRequest) returns (ListIntelligenceAlertsResponse);
  rpc SetIntelligenceAlertState(SetIntelligenceAlertStateRequest) returns (SetIntelligenceAlertStateResponse);
  rpc GetIntelligenceQueue(GetIntelligenceQueueRequest) returns (GetIntelligenceQueueResponse);
  rpc RecordIntelligenceFeedback(RecordIntelligenceFeedbackRequest) returns (RecordIntelligenceFeedbackResponse);
  rpc ExportReaderData(ExportReaderDataRequest) returns (ExportReaderDataResponse);
  rpc ListReaderSyncChanges(ListReaderSyncChangesRequest) returns (ListReaderSyncChangesResponse);

  // P2 — personal library / account.
  rpc ListMyUnlocks(ListMyUnlocksRequest) returns (ListMyUnlocksResponse);
  rpc ListMySubscriptions(ListMySubscriptionsRequest) returns (ListMySubscriptionsResponse);
  rpc ListMyFollows(ListMyFollowsRequest) returns (ListMyFollowsResponse);

  // P2 — sovereign window calendar.
  rpc ListSovereignWindow(ListSovereignWindowRequest) returns (ListSovereignWindowResponse);

  // P2 — multi-part series.
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesResponse);
  rpc GetSeries(GetSeriesRequest) returns (GetSeriesResponse);

  // P2.5 — captions, today summary, cross-pillar unlock bus.
  rpc GenerateCaptions(GenerateCaptionsRequest) returns (GenerateCaptionsResponse);
  rpc GetCaptionJob(GetCaptionJobRequest) returns (GetCaptionJobResponse);
  rpc GetListeningPreferences(GetListeningPreferencesRequest) returns (GetListeningPreferencesResponse);
  rpc UpdateListeningPreferences(UpdateListeningPreferencesRequest) returns (UpdateListeningPreferencesResponse);
  rpc CreateListeningBookmark(CreateListeningBookmarkRequest) returns (CreateListeningBookmarkResponse);
  rpc ListListeningBookmarks(ListListeningBookmarksRequest) returns (ListListeningBookmarksResponse);
  rpc DeleteListeningBookmark(DeleteListeningBookmarkRequest) returns (DeleteListeningBookmarkResponse);
  rpc ListListeningQueue(ListListeningQueueRequest) returns (ListListeningQueueResponse);
  rpc SetListeningQueue(SetListeningQueueRequest) returns (SetListeningQueueResponse);
  rpc CreateAudioOverview(CreateAudioOverviewRequest) returns (CreateAudioOverviewResponse);
  rpc ListAudioOverviews(ListAudioOverviewsRequest) returns (ListAudioOverviewsResponse);
  rpc GetAudioOverview(GetAudioOverviewRequest) returns (GetAudioOverviewResponse);
  rpc DeleteAudioOverview(DeleteAudioOverviewRequest) returns (DeleteAudioOverviewResponse);
  rpc ListListeningPronunciations(ListListeningPronunciationsRequest) returns (ListListeningPronunciationsResponse);
  rpc GetTodaySummary(GetTodaySummaryRequest) returns (GetTodaySummaryResponse);
  rpc GetCrossPillarUnlocks(GetCrossPillarUnlocksRequest) returns (GetCrossPillarUnlocksResponse);

  // P3 — curator concierge desk.
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // P3 — live / the salon.
  rpc ListLiveEvents(ListLiveEventsRequest) returns (ListLiveEventsResponse);
  rpc GetLiveEvent(GetLiveEventRequest) returns (GetLiveEventResponse);
  rpc RsvpLiveEvent(RsvpLiveEventRequest) returns (RsvpLiveEventResponse);
  rpc GetLiveSalon(GetLiveSalonRequest) returns (GetLiveSalonResponse);
  rpc UpsertLiveReservation(UpsertLiveReservationRequest) returns (UpsertLiveReservationResponse);
  rpc InviteLiveGuest(InviteLiveGuestRequest) returns (InviteLiveGuestResponse);
  rpc GenerateLiveCalendarPass(GenerateLiveCalendarPassRequest) returns (GenerateLiveCalendarPassResponse);
  rpc JoinLiveEvent(JoinLiveEventRequest) returns (JoinLiveEventResponse);
  rpc ListLiveActivity(ListLiveActivityRequest) returns (ListLiveActivityResponse);
  rpc PostLiveMessage(PostLiveMessageRequest) returns (PostLiveMessageResponse);
  rpc UpvoteLiveQuestion(UpvoteLiveQuestionRequest) returns (UpvoteLiveQuestionResponse);
  rpc VoteLivePoll(VoteLivePollRequest) returns (VoteLivePollResponse);
  rpc SetLiveHandRaise(SetLiveHandRaiseRequest) returns (SetLiveHandRaiseResponse);
  rpc ReactLiveEvent(ReactLiveEventRequest) returns (ReactLiveEventResponse);
  rpc UpsertLiveNote(UpsertLiveNoteRequest) returns (UpsertLiveNoteResponse);
  rpc ListLiveNotes(ListLiveNotesRequest) returns (ListLiveNotesResponse);
  rpc DeleteLiveNote(DeleteLiveNoteRequest) returns (DeleteLiveNoteResponse);
  rpc GetLiveReplay(GetLiveReplayRequest) returns (GetLiveReplayResponse);

  // P3 — posthumous archive (encrypted at rest).
  rpc SetPosthumousArchive(SetPosthumousArchiveRequest) returns (SetPosthumousArchiveResponse);
  rpc GetPosthumousArchive(GetPosthumousArchiveRequest) returns (GetPosthumousArchiveResponse);

  // P3 — editorial anthology.
  rpc ListAnthologies(ListAnthologiesRequest) returns (ListAnthologiesResponse);
  rpc GetAnthology(GetAnthologyRequest) returns (GetAnthologyResponse);

  // P3.5 — signed share embeds + offline manifest + device grants.
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  rpc ListMyShareLinks(ListMyShareLinksRequest) returns (ListMyShareLinksResponse);
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse);
  rpc GetOfflineManifest(GetOfflineManifestRequest) returns (GetOfflineManifestResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc AcknowledgePurge(AcknowledgePurgeRequest) returns (AcknowledgePurgeResponse);
  rpc GetDeviceGrants(GetDeviceGrantsRequest) returns (GetDeviceGrantsResponse);
  rpc RevokeMyDevice(RevokeMyDeviceRequest) returns (RevokeMyDeviceResponse);
  rpc MarkMyDeviceLost(MarkMyDeviceLostRequest) returns (MarkMyDeviceLostResponse);
  rpc GetPurgeReceipt(GetPurgeReceiptRequest) returns (GetPurgeReceiptResponse);
  rpc ListOfflineManifestItems(ListOfflineManifestItemsRequest) returns (ListOfflineManifestItemsResponse);
  rpc RefreshOfflineRenditions(RefreshOfflineRenditionsRequest) returns (RefreshOfflineRenditionsResponse);
  rpc RecordOfflineEvent(RecordOfflineEventRequest) returns (RecordOfflineEventResponse);

  // P4 — year-in-onyx recap, annual archive PDF, silent reactions.
  rpc GetYearInOnyx(GetYearInOnyxRequest) returns (GetYearInOnyxResponse);
  rpc GenerateAnnualArchive(GenerateAnnualArchiveRequest) returns (GenerateAnnualArchiveResponse);
  rpc ReactToContent(ReactToContentRequest) returns (ReactToContentResponse);

  // Reader OS capture — private imports with durable processing and explicit
  // duplicate/failure recovery.
  rpc CreateIngestionItem(CreateIngestionItemRequest) returns (CreateIngestionItemResponse);
  rpc ListMyIngestionItems(ListMyIngestionItemsRequest) returns (ListMyIngestionItemsResponse);
  rpc GetIngestionItem(GetIngestionItemRequest) returns (GetIngestionItemResponse);
  rpc RetryIngestionItem(RetryIngestionItemRequest) returns (RetryIngestionItemResponse);
  rpc SetIngestionItemState(SetIngestionItemStateRequest) returns (SetIngestionItemStateResponse);
  rpc ResolveIngestionDuplicate(ResolveIngestionDuplicateRequest) returns (ResolveIngestionDuplicateResponse);

  // Evidence briefing — source cards, claim-level citations, reproducible
  // selected-source runs, and correction overlays on historical output.
  rpc GetEvidenceWorkspace(GetEvidenceWorkspaceRequest) returns (GetEvidenceWorkspaceResponse);
  rpc CreateEvidenceBrief(CreateEvidenceBriefRequest) returns (CreateEvidenceBriefResponse);
  rpc ListMyEvidenceBriefs(ListMyEvidenceBriefsRequest) returns (ListMyEvidenceBriefsResponse);
  rpc GetEvidenceBrief(GetEvidenceBriefRequest) returns (GetEvidenceBriefResponse);

  // Choice 6 — a creator submits and revises work while editorial, rights,
  // accessibility, contracts, statements and member commerce remain auditable.
  rpc GetCreatorStudio(GetCreatorStudioRequest) returns (GetCreatorStudioResponse);
  rpc SubmitCreatorPitch(SubmitCreatorPitchRequest) returns (SubmitCreatorPitchResponse);
  rpc UpdateCreatorProject(UpdateCreatorProjectRequest) returns (UpdateCreatorProjectResponse);
  rpc SubmitCreatorProject(SubmitCreatorProjectRequest) returns (SubmitCreatorProjectResponse);
  rpc SignCreatorContract(SignCreatorContractRequest) returns (SignCreatorContractResponse);
  rpc ListMyCreatorSubscriptionsDetailed(ListMyCreatorSubscriptionsDetailedRequest) returns (ListMyCreatorSubscriptionsDetailedResponse);
  rpc CancelCreatorSubscription(CancelCreatorSubscriptionRequest) returns (CancelCreatorSubscriptionResponse);
  rpc GetMyCommerce(GetMyCommerceRequest) returns (GetMyCommerceResponse);
  rpc CreateCommerceCase(CreateCommerceCaseRequest) returns (CreateCommerceCaseResponse);

  // Choice 9 — governed, invite-only research and decision rooms.
  rpc ListResearchRooms(ListResearchRoomsRequest) returns (ListResearchRoomsResponse);
  rpc GetResearchRoom(GetResearchRoomRequest) returns (GetResearchRoomResponse);
  rpc CreateResearchRoom(CreateResearchRoomRequest) returns (CreateResearchRoomResponse);
  rpc UpdateResearchRoom(UpdateResearchRoomRequest) returns (UpdateResearchRoomResponse);
  rpc InviteResearchRoomMember(InviteResearchRoomMemberRequest) returns (InviteResearchRoomMemberResponse);
  rpc RespondResearchRoomInvite(RespondResearchRoomInviteRequest) returns (RespondResearchRoomInviteResponse);
  rpc ChangeResearchRoomMember(ChangeResearchRoomMemberRequest) returns (ChangeResearchRoomMemberResponse);
  rpc RevokeResearchRoomMember(RevokeResearchRoomMemberRequest) returns (RevokeResearchRoomMemberResponse);
  rpc AddResearchRoomItem(AddResearchRoomItemRequest) returns (AddResearchRoomItemResponse);
  rpc RemoveResearchRoomItem(RemoveResearchRoomItemRequest) returns (RemoveResearchRoomItemResponse);
  rpc PostResearchRoomComment(PostResearchRoomCommentRequest) returns (PostResearchRoomCommentResponse);
  rpc SetResearchRoomThreadStatus(SetResearchRoomThreadStatusRequest) returns (SetResearchRoomThreadStatusResponse);
  rpc UpsertResearchRoomTask(UpsertResearchRoomTaskRequest) returns (UpsertResearchRoomTaskResponse);
  rpc UpsertResearchRoomMeeting(UpsertResearchRoomMeetingRequest) returns (UpsertResearchRoomMeetingResponse);
  rpc UpsertResearchRoomDecision(UpsertResearchRoomDecisionRequest) returns (UpsertResearchRoomDecisionResponse);
  rpc RecordResearchRoomApproval(RecordResearchRoomApprovalRequest) returns (RecordResearchRoomApprovalResponse);
  rpc SearchResearchRoom(SearchResearchRoomRequest) returns (SearchResearchRoomResponse);
  rpc RequestResearchRoomExport(RequestResearchRoomExportRequest) returns (RequestResearchRoomExportResponse);
  rpc ReportResearchRoomAbuse(ReportResearchRoomAbuseRequest) returns (ReportResearchRoomAbuseResponse);
  rpc ListResearchRoomAudit(ListResearchRoomAuditRequest) returns (ListResearchRoomAuditResponse);
  rpc ListResearchRoomGrants(ListResearchRoomGrantsRequest) returns (ListResearchRoomGrantsResponse);
  rpc UpsertResearchRoomGrant(UpsertResearchRoomGrantRequest) returns (UpsertResearchRoomGrantResponse);
  rpc RevokeResearchRoomGrant(RevokeResearchRoomGrantRequest) returns (RevokeResearchRoomGrantResponse);
  rpc CreateResearchRoomShareLink(CreateResearchRoomShareLinkRequest) returns (CreateResearchRoomShareLinkResponse);
  rpc ListResearchRoomShareLinks(ListResearchRoomShareLinksRequest) returns (ListResearchRoomShareLinksResponse);
  rpc RevokeResearchRoomShareLink(RevokeResearchRoomShareLinkRequest) returns (RevokeResearchRoomShareLinkResponse);
  rpc ResolveResearchRoomShareLink(ResolveResearchRoomShareLinkRequest) returns (ResolveResearchRoomShareLinkResponse);
  rpc GetResearchRoomOfflineManifest(GetResearchRoomOfflineManifestRequest) returns (GetResearchRoomOfflineManifestResponse);
  rpc AcknowledgeResearchRoomOfflinePurge(AcknowledgeResearchRoomOfflinePurgeRequest) returns (AcknowledgeResearchRoomOfflinePurgeResponse);
  rpc ListResearchRoomOfflinePurges(ListResearchRoomOfflinePurgesRequest) returns (ListResearchRoomOfflinePurgesResponse);
  rpc LeaveResearchRoom(LeaveResearchRoomRequest) returns (LeaveResearchRoomResponse);

  // Choice 10 — private, member-owned intelligence graph.
  rpc GetPersonalIntelligenceGraph(GetPersonalIntelligenceGraphRequest) returns (GetPersonalIntelligenceGraphResponse);
  rpc UpsertIntelligenceGraphNode(UpsertIntelligenceGraphNodeRequest) returns (UpsertIntelligenceGraphNodeResponse);
  rpc SetIntelligenceGraphNodeState(SetIntelligenceGraphNodeStateRequest) returns (SetIntelligenceGraphNodeStateResponse);
  rpc MergeIntelligenceGraphNodes(MergeIntelligenceGraphNodesRequest) returns (MergeIntelligenceGraphNodesResponse);
  rpc SplitIntelligenceGraphNode(SplitIntelligenceGraphNodeRequest) returns (SplitIntelligenceGraphNodeResponse);
  rpc UpsertIntelligenceGraphEdge(UpsertIntelligenceGraphEdgeRequest) returns (UpsertIntelligenceGraphEdgeResponse);
  rpc SetIntelligenceGraphEdgeState(SetIntelligenceGraphEdgeStateRequest) returns (SetIntelligenceGraphEdgeStateResponse);
  rpc GenerateIntelligenceGraphSuggestions(GenerateIntelligenceGraphSuggestionsRequest) returns (GenerateIntelligenceGraphSuggestionsResponse);
  rpc ListIntelligenceGraphSuggestions(ListIntelligenceGraphSuggestionsRequest) returns (ListIntelligenceGraphSuggestionsResponse);
  rpc SetIntelligenceGraphSuggestionState(SetIntelligenceGraphSuggestionStateRequest) returns (SetIntelligenceGraphSuggestionStateResponse);
  rpc ListIntelligenceGraphTimeline(ListIntelligenceGraphTimelineRequest) returns (ListIntelligenceGraphTimelineResponse);
  rpc ListIntelligenceGraphResurfacing(ListIntelligenceGraphResurfacingRequest) returns (ListIntelligenceGraphResurfacingResponse);
  rpc SetIntelligenceGraphResurfacingState(SetIntelligenceGraphResurfacingStateRequest) returns (SetIntelligenceGraphResurfacingStateResponse);
  rpc CreateIntelligenceGraphMeetingBrief(CreateIntelligenceGraphMeetingBriefRequest) returns (CreateIntelligenceGraphMeetingBriefResponse);
  rpc GetIntelligenceGraphMeetingBrief(GetIntelligenceGraphMeetingBriefRequest) returns (GetIntelligenceGraphMeetingBriefResponse);
  rpc ListIntelligenceGraphMeetingBriefs(ListIntelligenceGraphMeetingBriefsRequest) returns (ListIntelligenceGraphMeetingBriefsResponse);
  rpc ExportPersonalIntelligenceGraph(ExportPersonalIntelligenceGraphRequest) returns (ExportPersonalIntelligenceGraphResponse);
  rpc RebuildPersonalIntelligenceGraph(RebuildPersonalIntelligenceGraphRequest) returns (RebuildPersonalIntelligenceGraphResponse);
}
