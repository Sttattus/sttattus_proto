syntax = "proto3";

package sttattus.onyx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/onyx/v1;onyxv1";

// GatingCriteria defines the status requirements to access content.
message GatingCriteria {
  string required_tier = 1; // e.g., 'gold', 'sovereign'
  double min_sttattus_score = 2;
  double min_vault_rank = 3; // Verified Wealth requirement
  double min_apex_rank = 4; // Verified Biological requirement
}

// OnyxProfile represents a user's identity within the network.
message OnyxProfile {
  string user_id = 1;
  string stage_name = 2;
  string bio = 3;
  bool is_creator = 4;
  double min_entry_score = 5; // Requirement to view this profile
  google.protobuf.Timestamp verified_at = 6;
  // Populated only when the caller requests their own profile. This is the
  // network-wide Stripe entitlement, not a creator subscription.
  bool has_network_subscription = 7;
  string creator_status = 8;
  string creator_slug = 9;
}

// OnyxContent represents an exclusive media item.
message OnyxContent {
  string id = 1;
  string creator_id = 2;
  string media_id = 3; // Link to MediaService asset
  string title = 4;
  string caption = 5;
  GatingCriteria gating = 6;
  int32 price_points = 7;
  bool is_locked = 8; // True if the requesting user doesn't meet gating
  string signed_url = 9; // Only populated if is_locked is false
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;

  // P6.2 — content kind + delivery fields.
  // article | audio | video.
  string kind = 12;
  // Long-form markdown body, used when kind == article.
  string body_markdown = 13;
  int32 duration_seconds = 14;
  string audio_url = 15;
  string video_url = 16;
  string hero_image_url = 17;
  string captions_url = 18;
  // articles | audio | video | curator | "" (catalog-only).
  string shelf_code = 19;

  // The caller's progress on this piece, when one exists. -1 when no
  // progress row exists.
  double progress_completion = 20;
  int32 progress_position_seconds = 21;

  // P4 — member-only silent reactions. Populated on GetContent; 0 in list
  // responses (avoids an N+1 across rails).
  int32 reaction_count = 22;
  bool i_reacted = 23;

  // Reader OS — populated on GetContent for articles. List responses carry
  // only the revision identity so rails remain light.
  string revision_id = 24;
  int32 revision_number = 25;
  repeated DocumentBlock document_blocks = 26;
  string progress_passage_key = 27;
  int32 progress_offset = 28;
  bool is_private_capture = 29;
  string source_capture_id = 30;
}

// A stable, addressable passage in one immutable editorial revision.
message DocumentBlock {
  string id = 1;
  string revision_id = 2;
  string passage_key = 3;
  int32 ordinal = 4;
  string block_type = 5; // paragraph | heading | quote | list | code | other
  string markdown = 6;
  string plain_text = 7;
}

// Subscription represents an exclusive link between user and creator.
message Subscription {
  string creator_id = 1;
  string status = 2; // 'active', 'expired'
  google.protobuf.Timestamp granted_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  string creator_name = 5;
  string product_id = 6;
  string price_id = 7;
  int32 points_paid = 8;
  bool cancel_at_period_end = 9;
  bool can_cancel = 10;
  string client_mutation_id = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// REQ/RES
message CreateProfileRequest {
  string stage_name = 1;
  string bio = 2;
}

message CreateProfileResponse {
  OnyxProfile profile = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  OnyxProfile profile = 1;
}

message ListContentRequest {
  string creator_id = 1; // Optional: filter by creator
}

message ListContentResponse {
  repeated OnyxContent content = 1;
}

message SubscribeRequest {
  string creator_id = 1;
  string client_mutation_id = 2;
}

message SubscribeResponse {
  Subscription subscription = 1;
}

// === P6.2 ===

message GetContentRequest {
  string id = 1;
}

message GetContentResponse {
  OnyxContent content = 1;
}

message ListShelfRequest {
  // articles | audio | video | curator.
  string shelf_code = 1;
  int32 limit = 2;
}

message ListShelfResponse {
  repeated OnyxContent items = 1;
}

message ListContinueRequest {
  int32 limit = 1;
}

message ListContinueResponse {
  repeated OnyxContent items = 1;
}

message GetShelvesRequest {}

// Shelf is one named editorial section in the library.
message Shelf {
  string code = 1;
  string title = 2;
  // Editorial copy on the shelf.
  string blurb = 3;
  repeated OnyxContent items = 4;
}

message GetShelvesResponse {
  repeated Shelf shelves = 1;
}

message RecordProgressRequest {
  string content_id = 1;
  // 0..1 fraction. >= 1 marks complete.
  double completion = 2;
  int32 position_seconds = 3;
  string passage_key = 4;
  int32 offset = 5;
  // Device observation time, retained while offline so an older device can
  // never overwrite the newer read/listen locator during reconciliation.
  google.protobuf.Timestamp observed_at = 6;
  // Idempotency identity for an offline journal entry.
  string client_mutation_id = 7;
  // read | listen. Both share one canonical passage locator so switching
  // modes resumes the same source position.
  string mode = 8;
}

message RecordProgressResponse {
  double completion = 1;
  int32 position_seconds = 2;
  string passage_key = 3;
  int32 offset = 4;
  google.protobuf.Timestamp observed_at = 5;
  string client_mutation_id = 6;
  string mode = 7;
}

// === P6.6 — subscription + points redemption ===

message RedeemContentRequest {
  string content_id = 1;
  string client_mutation_id = 2;
}

message RedeemContentResponse {
  string content_id = 1;
  int32 points_spent = 2;
}

message CreateSubscriptionCheckoutRequest {
  string success_url = 1;
  string cancel_url = 2;
  string client_mutation_id = 3;
  string product_code = 4;
}

message CreateSubscriptionCheckoutResponse {
  // Stripe-hosted checkout URL. Empty when billing is not configured.
  string checkout_url = 1;
  string checkout_intent_id = 2;
  string stripe_session_id = 3;
  string status = 4;
}

// === P2 — creators, search, notes, library, series, sovereign window ===

// CreatorProfile is the public surface for a named editor / filmmaker /
// writer / teacher.
message CreatorProfile {
  string user_id = 1;
  string stage_name = 2;
  string bio = 3;
  string portrait_url = 4;
  int32 works_count = 5;
  int32 follower_count = 6;
  bool is_following = 7; // by the caller
  bool is_subscribed = 8; // by the caller
  string creator_status = 9;
  double min_entry_score = 10;
  int32 subscription_point_price = 11;
}

message GetCreatorRequest {
  string user_id = 1;
}
message GetCreatorResponse {
  CreatorProfile creator = 1;
}

message ListCreatorWorksRequest {
  string user_id = 1;
  int32 limit = 2;
}
message ListCreatorWorksResponse {
  repeated OnyxContent items = 1;
}

message FollowCreatorRequest {
  string user_id = 1;
  bool follow = 2; // true = follow, false = unfollow
}
message FollowCreatorResponse {
  bool following = 1;
}

message SearchContentRequest {
  string query = 1;
  string kind = 2; // optional filter: article | audio | video | ""
  string shelf_code = 3; // optional filter
  int32 limit = 4;
}
message SearchContentResponse {
  repeated OnyxContent items = 1;
}

// Note is a member's private annotation on a piece.
message Note {
  string id = 1;
  string content_id = 2;
  string body = 3;
  string anchor = 4; // optional quoted locator the note attaches to
  google.protobuf.Timestamp created_at = 5;
  string content_title = 6; // hydrated for the all-notes list
}
message AddNoteRequest {
  string content_id = 1;
  string body = 2;
  string anchor = 3;
}
message AddNoteResponse {
  Note note = 1;
}
message ListMyNotesRequest {
  string content_id = 1; // empty = every note across the library
}
message ListMyNotesResponse {
  repeated Note notes = 1;
}
message DeleteNoteRequest {
  string note_id = 1;
}
message DeleteNoteResponse {}

// Reader OS annotations supersede the original free-form Note contract while
// the Note RPCs remain available as a backwards-compatible view of kind=note.
// A bookmark may omit quote/body; a highlight requires quote; a note requires
// body. Passage keys are stable across editorial revisions when text survives.
message ReaderAnnotation {
  string id = 1;
  string content_id = 2;
  string revision_id = 3;
  string passage_key = 4;
  string kind = 5; // highlight | note | bookmark
  string quote = 6;
  string body = 7;
  string color = 8;
  repeated string tags = 9;
  int32 start_offset = 10;
  int32 end_offset = 11;
  int64 version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string content_title = 15;
}

message UpsertReaderAnnotationRequest {
  string id = 1; // empty creates; populated updates the caller's annotation
  string content_id = 2;
  string revision_id = 3;
  string passage_key = 4;
  string kind = 5;
  string quote = 6;
  string body = 7;
  string color = 8;
  repeated string tags = 9;
  int32 start_offset = 10;
  int32 end_offset = 11;
  string client_mutation_id = 12; // UUID; makes offline retries idempotent
  int64 expected_version = 13; // 0 creates; updates use optimistic concurrency
}
message UpsertReaderAnnotationResponse {
  ReaderAnnotation annotation = 1;
  int64 sync_sequence = 2;
}

message DeleteReaderAnnotationRequest {
  string annotation_id = 1;
  string client_mutation_id = 2;
  int64 expected_version = 3;
}
message DeleteReaderAnnotationResponse {
  int64 sync_sequence = 1;
}

message ListMyReaderAnnotationsRequest {
  string content_id = 1;
  string kind = 2;
  string color = 3;
  string tag = 4;
  string query = 5;
  int32 limit = 6;
}
message ListMyReaderAnnotationsResponse {
  repeated ReaderAnnotation annotations = 1;
  int64 latest_sync_sequence = 2;
}

message ReaderSearchResult {
  string scope = 1; // content | annotation
  OnyxContent content = 2;
  ReaderAnnotation annotation = 3;
  string snippet = 4;
}
message SearchReaderRequest {
  string query = 1;
  string scope = 2; // all | content | annotations
  string kind = 3; // optional content-kind filter
  int32 limit = 4;
}
message SearchReaderResponse {
  repeated ReaderSearchResult results = 1;
}

// Choice 7 — private, access-aware search, watchlists and a finite daily
// intelligence queue. Ranking reasons are deliberately returned to the member;
// a recommendation that cannot explain itself is not an Onyx recommendation.
message IntelligenceSearchFilters {
  string scope = 1; // all | editorial | captures | annotations
  repeated string kinds = 2; // article | audio | video
  string creator_id = 3;
  string language_code = 4;
  google.protobuf.Timestamp published_after = 5;
  google.protobuf.Timestamp published_before = 6;
  string read_state = 7; // any | unread | in_progress | completed
  string entitlement = 8; // any | readable | locked
  repeated string tags = 9;
  string sort = 10; // relevance | newest | editorial
  string jurisdiction = 11;
  double min_evidence_quality = 12;
  string change_kind = 13; // any | new | updated | corrected
  string project_id = 14;
}

message SearchIntelligenceRequest {
  string query = 1;
  IntelligenceSearchFilters filters = 2;
  int32 limit = 3;
}

message IntelligenceSearchResult {
  string result_id = 1;
  string scope = 2; // content | annotation
  OnyxContent content = 3;
  ReaderAnnotation annotation = 4;
  string snippet = 5;
  double score = 6;
  repeated string reasons = 7;
  repeated string matched_terms = 8;
  string cluster_key = 9;
  string change_kind = 10; // new | updated | corrected
  bool entitled = 11;
}

message SearchIntelligenceResponse {
  repeated IntelligenceSearchResult results = 1;
  int32 total = 2;
  string query_digest = 3;
  int32 elapsed_ms = 4;
  string ranking_version = 5;
  string search_event_id = 6;
}

message RecordIntelligenceSearchOutcomeRequest {
  string search_event_id = 1;
  string action = 2; // open | reformulate | save | citation_open
  string result_id = 3;
  string client_mutation_id = 4;
}
message RecordIntelligenceSearchOutcomeResponse {}

message OnyxSavedQuery {
  string id = 1;
  string name = 2;
  string query = 3;
  IntelligenceSearchFilters filters = 4;
  reserved 5, 6; // alert automation belongs to typed watchlists
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListSavedQueriesRequest {}
message ListSavedQueriesResponse {
  repeated OnyxSavedQuery queries = 1;
}
message UpsertSavedQueryRequest {
  string id = 1;
  string name = 2;
  string query = 3;
  IntelligenceSearchFilters filters = 4;
  reserved 5, 6;
  string client_mutation_id = 7;
}
message UpsertSavedQueryResponse {
  OnyxSavedQuery query = 1;
}
message DeleteSavedQueryRequest {
  string id = 1;
  string client_mutation_id = 2;
}
message DeleteSavedQueryResponse {}

message OnyxWatchlistTerm {
  string kind = 1; // topic | entity | company | person | place
  string label = 2;
  repeated string aliases = 3;
  double weight = 4;
}

message OnyxWatchlist {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated OnyxWatchlistTerm terms = 4;
  double threshold = 5;
  string frequency = 6; // instant | daily | weekly
  bool paused = 7;
  google.protobuf.Timestamp last_refreshed_at = 8;
  int32 unread_alerts = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListWatchlistsRequest {}
message ListWatchlistsResponse {
  repeated OnyxWatchlist watchlists = 1;
}
message UpsertWatchlistRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated OnyxWatchlistTerm terms = 4;
  double threshold = 5;
  string frequency = 6;
  bool paused = 7;
  string client_mutation_id = 8;
}
message UpsertWatchlistResponse {
  OnyxWatchlist watchlist = 1;
}
message DeleteWatchlistRequest {
  string id = 1;
  string client_mutation_id = 2;
}
message DeleteWatchlistResponse {}
message RefreshWatchlistRequest {
  string id = 1;
  string client_mutation_id = 2;
}
message RefreshWatchlistResponse {
  OnyxWatchlist watchlist = 1;
  int32 new_alerts = 2;
}

message OnyxIntelligenceAlert {
  string id = 1;
  string watchlist_id = 2;
  string watchlist_name = 3;
  OnyxContent content = 4;
  string signal_kind = 5; // new | updated | corrected
  double score = 6;
  repeated string reasons = 7;
  string state = 8; // unread | read | dismissed
  google.protobuf.Timestamp detected_at = 9;
}

message ListIntelligenceAlertsRequest {
  string watchlist_id = 1;
  string state = 2; // all | unread | read | dismissed
  int32 limit = 3;
}
message ListIntelligenceAlertsResponse {
  repeated OnyxIntelligenceAlert alerts = 1;
}
message SetIntelligenceAlertStateRequest {
  string id = 1;
  string state = 2; // read | dismissed
  string client_mutation_id = 3;
}
message SetIntelligenceAlertStateResponse {
  OnyxIntelligenceAlert alert = 1;
}

message OnyxIntelligenceQueueItem {
  string id = 1;
  OnyxContent content = 2;
  int32 rank = 3;
  double score = 4;
  repeated string reasons = 5;
  int32 estimated_minutes = 6;
  string cluster_key = 7;
  bool editorial_pin = 8;
  bool watchlist_match = 9;
  string feedback = 10;
}

message GetIntelligenceQueueRequest {
  string mode = 1; // personalized | chronological | editorial
  int32 time_budget_minutes = 2;
  bool refresh = 3;
}
message GetIntelligenceQueueResponse {
  repeated OnyxIntelligenceQueueItem items = 1;
  string queue_date = 2;
  string mode = 3;
  int32 estimated_minutes = 4;
  string ranking_version = 5;
}
message RecordIntelligenceFeedbackRequest {
  string queue_item_id = 1;
  string action = 2; // more | less | hide | not_relevant | open | save
  string client_mutation_id = 3;
}
message RecordIntelligenceFeedbackResponse {
  OnyxIntelligenceQueueItem item = 1;
}

message ExportReaderDataRequest {
  string format = 1;
} // markdown | json
message ExportReaderDataResponse {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  google.protobuf.Timestamp generated_at = 4;
}

message ReaderSyncChange {
  int64 sequence = 1;
  string entity_type = 2;
  string entity_id = 3;
  string operation = 4; // upsert | delete
  int64 version = 5;
  google.protobuf.Timestamp changed_at = 6;
}
message ListReaderSyncChangesRequest {
  int64 after_sequence = 1;
  int32 limit = 2;
}
message ListReaderSyncChangesResponse {
  repeated ReaderSyncChange changes = 1;
  int64 latest_sequence = 2;
  bool has_more = 3;
}

message ListMyUnlocksRequest {
  int32 limit = 1;
}
message ListMyUnlocksResponse {
  repeated OnyxContent items = 1;
}

message ListMySubscriptionsRequest {}
message ListMySubscriptionsResponse {
  repeated CreatorProfile creators = 1;
}

// Follows are distinct from subscriptions: FollowCreator is free and costs no
// points, while a subscription is redeemed. Without this the follow written by
// FollowCreator can never be read back by anyone.
message ListMyFollowsRequest {}
message ListMyFollowsResponse {
  repeated CreatorProfile creators = 1;
}

// WindowEntry is a piece on its way from the Sovereign window to public.
message WindowEntry {
  OnyxContent content = 1;
  int32 days_until_public = 2; // days until public_at (>= 0)
  bool in_sovereign_window = 3; // public_at is still in the future
}
message ListSovereignWindowRequest {
  int32 limit = 1;
}
message ListSovereignWindowResponse {
  repeated WindowEntry entries = 1;
}

// Series is a multi-part curated arc.
message Series {
  string id = 1;
  string slug = 2;
  string title = 3;
  string blurb = 4;
  string creator_id = 5;
  string creator_name = 6;
  string hero_image_url = 7;
  repeated OnyxContent parts = 8;
}
message ListSeriesRequest {
  int32 limit = 1;
}
message ListSeriesResponse {
  repeated Series series = 1;
}
message GetSeriesRequest {
  string id = 1;
}
message GetSeriesResponse {
  Series series = 1;
}

// === P2.5 — captions, today summary, cross-pillar unlock bus ===

// CaptionJob is the state of a caption/transcript generation request.
message CaptionJob {
  string content_id = 1;
  string status = 2; // queued | running | done | unavailable | failed
  string captions_url = 3; // populated when status == done
  string error = 4; // honest reason when status == unavailable / failed
  // Durable job identity. Empty only for captions created before the durable
  // queue contract was introduced.
  string job_id = 5;
  // Normalized BCP-47 language tag used by the transcriber.
  string language_code = 6;
  // Stable, bounded machine-readable failure code. `error` remains safe
  // member-facing copy and never carries a raw provider response.
  string error_code = 7;
  int32 attempt_count = 8;
  int32 max_attempts = 9;
  google.protobuf.Timestamp next_attempt_at = 10;
}
message GenerateCaptionsRequest {
  string content_id = 1;
  // Optional BCP-47 language tag. Empty defaults to English for wire
  // compatibility with older clients.
  string language_code = 2;
}
message GenerateCaptionsResponse {
  CaptionJob job = 1;
}
message GetCaptionJobRequest {
  string job_id = 1;
}
message GetCaptionJobResponse {
  CaptionJob job = 1;
}

message ListeningPreferences {
  string voice_name = 1;
  string voice_locale = 2;
  double speed = 3;
  double pitch = 4;
  bool skip_headings = 5;
  bool skip_citations = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message GetListeningPreferencesRequest {}
message GetListeningPreferencesResponse {
  ListeningPreferences preferences = 1;
}
message UpdateListeningPreferencesRequest {
  string voice_name = 1;
  string voice_locale = 2;
  double speed = 3;
  double pitch = 4;
  bool skip_headings = 5;
  bool skip_citations = 6;
}
message UpdateListeningPreferencesResponse {
  ListeningPreferences preferences = 1;
}

message ListeningBookmark {
  string id = 1;
  string content_id = 2;
  string kind = 3; // bookmark | clip
  int32 position_seconds = 4;
  int32 end_position_seconds = 5;
  string passage_key = 6;
  int32 passage_offset = 7;
  string label = 8;
  string note = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
message CreateListeningBookmarkRequest {
  string content_id = 1;
  string kind = 2;
  int32 position_seconds = 3;
  int32 end_position_seconds = 4;
  string passage_key = 5;
  int32 passage_offset = 6;
  string label = 7;
  string note = 8;
}
message CreateListeningBookmarkResponse {
  ListeningBookmark bookmark = 1;
}
message ListListeningBookmarksRequest {
  string content_id = 1;
}
message ListListeningBookmarksResponse {
  repeated ListeningBookmark bookmarks = 1;
}
message DeleteListeningBookmarkRequest {
  string bookmark_id = 1;
}
message DeleteListeningBookmarkResponse {}

message ListeningQueueEntry {
  OnyxContent content = 1;
  int32 ordinal = 2;
  google.protobuf.Timestamp added_at = 3;
}
message ListListeningQueueRequest {}
message ListListeningQueueResponse {
  repeated ListeningQueueEntry entries = 1;
}
message SetListeningQueueRequest {
  repeated string content_ids = 1;
}
message SetListeningQueueResponse {
  repeated ListeningQueueEntry entries = 1;
}

message AudioOverviewCitation {
  string source_content_id = 1;
  string source_revision_id = 2;
  string passage_key = 3;
  string quote = 4;
  string relation = 5;
}
message AudioOverviewSegment {
  string id = 1;
  int32 ordinal = 2;
  string chapter_title = 3;
  string speaker_label = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
  string transcript_text = 7;
  repeated AudioOverviewCitation citations = 8;
}
message AudioOverview {
  string id = 1;
  string title = 2;
  string status = 3;
  string language_code = 4;
  string source_set_fingerprint = 5;
  string transcript_text = 6;
  string provider = 7;
  string model = 8;
  string error_code = 9;
  int32 cost_minor = 10;
  string currency = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated AudioOverviewSegment segments = 14;
}
message CreateAudioOverviewRequest {
  string title = 1;
  repeated string content_ids = 2;
  string language_code = 3;
  string client_mutation_id = 4;
}
message CreateAudioOverviewResponse {
  AudioOverview overview = 1;
}
message ListAudioOverviewsRequest {
  int32 limit = 1;
}
message ListAudioOverviewsResponse {
  repeated AudioOverview overviews = 1;
}
message GetAudioOverviewRequest {
  string overview_id = 1;
}
message GetAudioOverviewResponse {
  AudioOverview overview = 1;
}
message DeleteAudioOverviewRequest {
  string overview_id = 1;
}
message DeleteAudioOverviewResponse {}

message ListeningPronunciation {
  string id = 1;
  string phrase = 2;
  string pronunciation = 3;
  string language_code = 4;
  string scope = 5;
  bool match_case = 6;
  int32 version = 7;
}
message ListListeningPronunciationsRequest {
  string content_id = 1;
  string language_code = 2;
}
message ListListeningPronunciationsResponse {
  repeated ListeningPronunciation pronunciations = 1;
}

message GetTodaySummaryRequest {}
message GetTodaySummaryResponse {
  // The single most-recent published piece — today's editorial drop.
  OnyxContent todays_drop = 1;
  int32 in_progress_count = 2;
  int32 window_count = 3; // pieces currently in the Sovereign window
  int32 unlock_count = 4; // pieces the caller has redeemed
  double onyx_score = 5;
}

// CrossPillarUnlock is a piece the caller can open because of a specific
// pillar standing — the inverse of the LockedGate.
message CrossPillarUnlock {
  OnyxContent content = 1;
  // tier | score | vault | apex — which requirement the caller clears.
  string unlocked_by = 2;
  string detail = 3; // e.g. "Vault 60 — you have 76"
}
message GetCrossPillarUnlocksRequest {
  int32 limit = 1;
}
message GetCrossPillarUnlocksResponse {
  repeated CrossPillarUnlock unlocks = 1;
}

// === P3 — concierge, live events, posthumous archive, anthology ===

message ConciergeMessage {
  string id = 1;
  string sender = 2; // member | system | editor
  string body = 3;
  google.protobuf.Timestamp created_at = 4;

  // The concierge who wrote it. Empty for member and system messages, and
  // for replies written before authorship was recorded.
  //
  // Every desk on the platform answered as an anonymous "STAFF" until
  // 2026-08-23; lexicon's tutor desk had carried a name since migration 0079
  // and was the only one. A white-glove desk that will not say who is
  // speaking is not white-glove.
  string author_name = 5;
}
message ConciergeThread {
  string id = 1;
  string subject = 2;
  string topic = 3; // request | creator | commission | general
  string status = 4; // open | answered | closed
