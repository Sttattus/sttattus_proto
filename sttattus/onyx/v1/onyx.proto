syntax = "proto3";

package sttattus.onyx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/onyx/v1;onyxv1";

// GatingCriteria defines the status requirements to access content.
message GatingCriteria {
  string required_tier = 1; // e.g., 'gold', 'sovereign'
  double min_sttattus_score = 2;
  double min_vault_rank = 3; // Verified Wealth requirement
  double min_apex_rank = 4; // Verified Biological requirement
}

// OnyxProfile represents a user's identity within the network.
message OnyxProfile {
  string user_id = 1;
  string stage_name = 2;
  string bio = 3;
  bool is_creator = 4;
  double min_entry_score = 5; // Requirement to view this profile
  google.protobuf.Timestamp verified_at = 6;
  // Populated only when the caller requests their own profile. This is the
  // network-wide Stripe entitlement, not a creator subscription.
  bool has_network_subscription = 7;
}

// OnyxContent represents an exclusive media item.
message OnyxContent {
  string id = 1;
  string creator_id = 2;
  string media_id = 3; // Link to MediaService asset
  string title = 4;
  string caption = 5;
  GatingCriteria gating = 6;
  int32 price_points = 7;
  bool is_locked = 8; // True if the requesting user doesn't meet gating
  string signed_url = 9; // Only populated if is_locked is false
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;

  // P6.2 — content kind + delivery fields.
  // article | audio | video.
  string kind = 12;
  // Long-form markdown body, used when kind == article.
  string body_markdown = 13;
  int32 duration_seconds = 14;
  string audio_url = 15;
  string video_url = 16;
  string hero_image_url = 17;
  string captions_url = 18;
  // articles | audio | video | curator | "" (catalog-only).
  string shelf_code = 19;

  // The caller's progress on this piece, when one exists. -1 when no
  // progress row exists.
  double progress_completion = 20;
  int32 progress_position_seconds = 21;

  // P4 — member-only silent reactions. Populated on GetContent; 0 in list
  // responses (avoids an N+1 across rails).
  int32 reaction_count = 22;
  bool i_reacted = 23;

  // Reader OS — populated on GetContent for articles. List responses carry
  // only the revision identity so rails remain light.
  string revision_id = 24;
  int32 revision_number = 25;
  repeated DocumentBlock document_blocks = 26;
  string progress_passage_key = 27;
  int32 progress_offset = 28;
  bool is_private_capture = 29;
  string source_capture_id = 30;
}

// A stable, addressable passage in one immutable editorial revision.
message DocumentBlock {
  string id = 1;
  string revision_id = 2;
  string passage_key = 3;
  int32 ordinal = 4;
  string block_type = 5; // paragraph | heading | quote | list | code | other
  string markdown = 6;
  string plain_text = 7;
}

// Subscription represents an exclusive link between user and creator.
message Subscription {
  string creator_id = 1;
  string status = 2; // 'active', 'expired'
  google.protobuf.Timestamp granted_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// REQ/RES
message CreateProfileRequest {
  string stage_name = 1;
  string bio = 2;
}

message CreateProfileResponse {
  OnyxProfile profile = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  OnyxProfile profile = 1;
}

message ListContentRequest {
  string creator_id = 1; // Optional: filter by creator
}

message ListContentResponse {
  repeated OnyxContent content = 1;
}

message SubscribeRequest {
  string creator_id = 1;
}

message SubscribeResponse {
  Subscription subscription = 1;
}

// === P6.2 ===

message GetContentRequest {
  string id = 1;
}

message GetContentResponse {
  OnyxContent content = 1;
}

message ListShelfRequest {
  // articles | audio | video | curator.
  string shelf_code = 1;
  int32 limit = 2;
}

message ListShelfResponse {
  repeated OnyxContent items = 1;
}

message ListContinueRequest {
  int32 limit = 1;
}

message ListContinueResponse {
  repeated OnyxContent items = 1;
}

message GetShelvesRequest {}

// Shelf is one named editorial section in the library.
message Shelf {
  string code = 1;
  string title = 2;
  // Editorial copy on the shelf.
  string blurb = 3;
  repeated OnyxContent items = 4;
}

message GetShelvesResponse {
  repeated Shelf shelves = 1;
}

message RecordProgressRequest {
  string content_id = 1;
  // 0..1 fraction. >= 1 marks complete.
  double completion = 2;
  int32 position_seconds = 3;
  string passage_key = 4;
  int32 offset = 5;
}

message RecordProgressResponse {
  double completion = 1;
  int32 position_seconds = 2;
  string passage_key = 3;
  int32 offset = 4;
}

// === P6.6 — subscription + points redemption ===

message RedeemContentRequest {
  string content_id = 1;
}

message RedeemContentResponse {
  string content_id = 1;
  int32 points_spent = 2;
}

message CreateSubscriptionCheckoutRequest {
  string success_url = 1;
  string cancel_url = 2;
}

message CreateSubscriptionCheckoutResponse {
  // Stripe-hosted checkout URL. Empty when billing is not configured.
  string checkout_url = 1;
}

// === P2 — creators, search, notes, library, series, sovereign window ===

// CreatorProfile is the public surface for a named editor / filmmaker /
// writer / teacher.
message CreatorProfile {
  string user_id = 1;
  string stage_name = 2;
  string bio = 3;
  string portrait_url = 4;
  int32 works_count = 5;
  int32 follower_count = 6;
  bool is_following = 7; // by the caller
  bool is_subscribed = 8; // by the caller
}

message GetCreatorRequest {
  string user_id = 1;
}
message GetCreatorResponse {
  CreatorProfile creator = 1;
}

message ListCreatorWorksRequest {
  string user_id = 1;
  int32 limit = 2;
}
message ListCreatorWorksResponse {
  repeated OnyxContent items = 1;
}

message FollowCreatorRequest {
  string user_id = 1;
  bool follow = 2; // true = follow, false = unfollow
}
message FollowCreatorResponse {
  bool following = 1;
}

message SearchContentRequest {
  string query = 1;
  string kind = 2; // optional filter: article | audio | video | ""
  string shelf_code = 3; // optional filter
  int32 limit = 4;
}
message SearchContentResponse {
  repeated OnyxContent items = 1;
}

// Note is a member's private annotation on a piece.
message Note {
  string id = 1;
  string content_id = 2;
  string body = 3;
  string anchor = 4; // optional quoted locator the note attaches to
  google.protobuf.Timestamp created_at = 5;
  string content_title = 6; // hydrated for the all-notes list
}
message AddNoteRequest {
  string content_id = 1;
  string body = 2;
  string anchor = 3;
}
message AddNoteResponse {
  Note note = 1;
}
message ListMyNotesRequest {
  string content_id = 1; // empty = every note across the library
}
message ListMyNotesResponse {
  repeated Note notes = 1;
}
message DeleteNoteRequest {
  string note_id = 1;
}
message DeleteNoteResponse {}

// Reader OS annotations supersede the original free-form Note contract while
// the Note RPCs remain available as a backwards-compatible view of kind=note.
// A bookmark may omit quote/body; a highlight requires quote; a note requires
// body. Passage keys are stable across editorial revisions when text survives.
message ReaderAnnotation {
  string id = 1;
  string content_id = 2;
  string revision_id = 3;
  string passage_key = 4;
  string kind = 5; // highlight | note | bookmark
  string quote = 6;
  string body = 7;
  string color = 8;
  repeated string tags = 9;
  int32 start_offset = 10;
  int32 end_offset = 11;
  int64 version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string content_title = 15;
}

message UpsertReaderAnnotationRequest {
  string id = 1; // empty creates; populated updates the caller's annotation
  string content_id = 2;
  string revision_id = 3;
  string passage_key = 4;
  string kind = 5;
  string quote = 6;
  string body = 7;
  string color = 8;
  repeated string tags = 9;
  int32 start_offset = 10;
  int32 end_offset = 11;
  string client_mutation_id = 12; // UUID; makes offline retries idempotent
  int64 expected_version = 13; // 0 creates; updates use optimistic concurrency
}
message UpsertReaderAnnotationResponse {
  ReaderAnnotation annotation = 1;
  int64 sync_sequence = 2;
}

message DeleteReaderAnnotationRequest {
  string annotation_id = 1;
  string client_mutation_id = 2;
  int64 expected_version = 3;
}
message DeleteReaderAnnotationResponse {
  int64 sync_sequence = 1;
}

message ListMyReaderAnnotationsRequest {
  string content_id = 1;
  string kind = 2;
  string color = 3;
  string tag = 4;
  string query = 5;
  int32 limit = 6;
}
message ListMyReaderAnnotationsResponse {
  repeated ReaderAnnotation annotations = 1;
  int64 latest_sync_sequence = 2;
}

message ReaderSearchResult {
  string scope = 1; // content | annotation
  OnyxContent content = 2;
  ReaderAnnotation annotation = 3;
  string snippet = 4;
}
message SearchReaderRequest {
  string query = 1;
  string scope = 2; // all | content | annotations
  string kind = 3; // optional content-kind filter
  int32 limit = 4;
}
message SearchReaderResponse {
  repeated ReaderSearchResult results = 1;
}

message ExportReaderDataRequest {
  string format = 1;
} // markdown | json
message ExportReaderDataResponse {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  google.protobuf.Timestamp generated_at = 4;
}

message ReaderSyncChange {
  int64 sequence = 1;
  string entity_type = 2;
  string entity_id = 3;
  string operation = 4; // upsert | delete
  int64 version = 5;
  google.protobuf.Timestamp changed_at = 6;
}
message ListReaderSyncChangesRequest {
  int64 after_sequence = 1;
  int32 limit = 2;
}
message ListReaderSyncChangesResponse {
  repeated ReaderSyncChange changes = 1;
  int64 latest_sequence = 2;
  bool has_more = 3;
}

message ListMyUnlocksRequest {
  int32 limit = 1;
}
message ListMyUnlocksResponse {
  repeated OnyxContent items = 1;
}

message ListMySubscriptionsRequest {}
message ListMySubscriptionsResponse {
  repeated CreatorProfile creators = 1;
}

// Follows are distinct from subscriptions: FollowCreator is free and costs no
// points, while a subscription is redeemed. Without this the follow written by
// FollowCreator can never be read back by anyone.
message ListMyFollowsRequest {}
message ListMyFollowsResponse {
  repeated CreatorProfile creators = 1;
}

// WindowEntry is a piece on its way from the Sovereign window to public.
message WindowEntry {
  OnyxContent content = 1;
  int32 days_until_public = 2; // days until public_at (>= 0)
  bool in_sovereign_window = 3; // public_at is still in the future
}
message ListSovereignWindowRequest {
  int32 limit = 1;
}
message ListSovereignWindowResponse {
  repeated WindowEntry entries = 1;
}

// Series is a multi-part curated arc.
message Series {
  string id = 1;
  string slug = 2;
  string title = 3;
  string blurb = 4;
  string creator_id = 5;
  string creator_name = 6;
  string hero_image_url = 7;
  repeated OnyxContent parts = 8;
}
message ListSeriesRequest {
  int32 limit = 1;
}
message ListSeriesResponse {
  repeated Series series = 1;
}
message GetSeriesRequest {
  string id = 1;
}
message GetSeriesResponse {
  Series series = 1;
}

// === P2.5 — captions, today summary, cross-pillar unlock bus ===

// CaptionJob is the state of a caption/transcript generation request.
message CaptionJob {
  string content_id = 1;
  string status = 2; // queued | running | done | unavailable | failed
  string captions_url = 3; // populated when status == done
  string error = 4; // honest reason when status == unavailable / failed
}
message GenerateCaptionsRequest {
  string content_id = 1;
}
message GenerateCaptionsResponse {
  CaptionJob job = 1;
}

message GetTodaySummaryRequest {}
message GetTodaySummaryResponse {
  // The single most-recent published piece — today's editorial drop.
  OnyxContent todays_drop = 1;
  int32 in_progress_count = 2;
  int32 window_count = 3; // pieces currently in the Sovereign window
  int32 unlock_count = 4; // pieces the caller has redeemed
  double onyx_score = 5;
}

// CrossPillarUnlock is a piece the caller can open because of a specific
// pillar standing — the inverse of the LockedGate.
message CrossPillarUnlock {
  OnyxContent content = 1;
  // tier | score | vault | apex — which requirement the caller clears.
  string unlocked_by = 2;
  string detail = 3; // e.g. "Vault 60 — you have 76"
}
message GetCrossPillarUnlocksRequest {
  int32 limit = 1;
}
message GetCrossPillarUnlocksResponse {
  repeated CrossPillarUnlock unlocks = 1;
}

// === P3 — concierge, live events, posthumous archive, anthology ===

message ConciergeMessage {
  string id = 1;
  string sender = 2; // member | system | editor
  string body = 3;
  google.protobuf.Timestamp created_at = 4;

  // The concierge who wrote it. Empty for member and system messages, and
  // for replies written before authorship was recorded.
  //
  // Every desk on the platform answered as an anonymous "STAFF" until
  // 2026-08-23; lexicon's tutor desk had carried a name since migration 0079
  // and was the only one. A white-glove desk that will not say who is
  // speaking is not white-glove.
  string author_name = 5;
}
message ConciergeThread {
  string id = 1;
  string subject = 2;
  string topic = 3; // request | creator | commission | general
  string status = 4; // open | answered | closed
  google.protobuf.Timestamp sla_due_at = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated ConciergeMessage messages = 7;
}
message StartConciergeThreadRequest {
  string subject = 1;
  string topic = 2;
  string first_message = 3;
}
message StartConciergeThreadResponse {
  ConciergeThread thread = 1;
}
message ListMyConciergeThreadsRequest {}
message ListMyConciergeThreadsResponse {
  repeated ConciergeThread threads = 1;
}
message GetConciergeThreadRequest {
  string thread_id = 1;
}
message GetConciergeThreadResponse {
  ConciergeThread thread = 1;
}
message PostConciergeMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

message LiveEvent {
  string id = 1;
  string title = 2;
  string blurb = 3;
  string host_name = 4;
  string required_tier = 5;
  google.protobuf.Timestamp starts_at = 6;
  int32 capacity = 7;
  int32 rsvp_count = 8;
  bool is_rsvped = 9; // by the caller
  string status = 10; // scheduled | live | recorded
  // When recorded, the onyx_content id of the archived recording ("" if none).
  string recording_content_id = 11;
  string hero_image_url = 12;
  // True when required_tier is above what this member has earned. The server
  // refuses the RSVP either way; this is so the client can say why instead of
  // offering a button it knows will be refused. Mirrors Programme.locked.
  bool locked = 13;
}
message ListLiveEventsRequest {
  int32 limit = 1;
}
message ListLiveEventsResponse {
  repeated LiveEvent events = 1;
}
message GetLiveEventRequest {
  string id = 1;
}
message GetLiveEventResponse {
  LiveEvent event = 1;
}
message RsvpLiveEventRequest {
  string id = 1;
  bool rsvp = 2; // true = reserve, false = cancel
}
message RsvpLiveEventResponse {
  bool rsvped = 1;
  int32 rsvp_count = 2;
}

message PosthumousArchive {
  // The pieces designated to drop to heirs on the Legacy trigger.
  repeated string content_ids = 1;
  // Free-text instruction to the heirs (stored AES-GCM-encrypted at rest).
  string instructions = 2;
  bool armed = 3;
  google.protobuf.Timestamp updated_at = 4;
}
message SetPosthumousArchiveRequest {
  repeated string content_ids = 1;
  string instructions = 2;
  bool armed = 3;
}
message SetPosthumousArchiveResponse {
  PosthumousArchive archive = 1;
}
message GetPosthumousArchiveRequest {}
message GetPosthumousArchiveResponse {
  PosthumousArchive archive = 1;
}

message Anthology {
  string id = 1;
  string slug = 2;
  string title = 3;
  string editor_note = 4; // the editor's introduction
  string editor_name = 5;
  string hero_image_url = 6;
  repeated OnyxContent pieces = 7;
}
message ListAnthologiesRequest {
  int32 limit = 1;
}
message ListAnthologiesResponse {
  repeated Anthology anthologies = 1;
}
message GetAnthologyRequest {
  string id = 1;
}
message GetAnthologyResponse {
  Anthology anthology = 1;
}

// === P3.5 — signed share embeds + offline manifest ===

message ShareLink {
  string token = 1;
  string content_id = 2;
  string url = 3; // public /share/onyx/:token URL
  string watermark = 4; // the sharer's name, stamped on the shared view
  google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
}
message CreateShareLinkRequest {
  string content_id = 1;
}
message CreateShareLinkResponse {
  ShareLink link = 1;
}
message ListMyShareLinksRequest {}
message ListMyShareLinksResponse {
  repeated ShareLink links = 1;
}
message RevokeShareLinkRequest {
  string token = 1;
}
message RevokeShareLinkResponse {}

message EncryptedRendition {
  enum RenditionStatus {
    RENDITION_STATUS_UNSPECIFIED = 0;
    RENDITION_STATUS_PREPARING = 1;
    RENDITION_STATUS_READY = 2;
    RENDITION_STATUS_FAILED = 3;
  }
  enum OfflinePackageType {
    OFFLINE_PACKAGE_TYPE_UNSPECIFIED = 0;
    OFFLINE_PACKAGE_TYPE_PROTOBUF_ARTICLE = 1;
    OFFLINE_PACKAGE_TYPE_EVIDENCE_BRIEF = 2;
    OFFLINE_PACKAGE_TYPE_RAW_AUDIO = 3;
    OFFLINE_PACKAGE_TYPE_CAPTIONS = 4;
    OFFLINE_PACKAGE_TYPE_PDF = 5;
  }
  string content_id = 1;
  string rendition_id = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string wrapped_cek = 5; // CEK wrapped with device's public key (base64)
  string iv = 6; // Base64 Initialization Vector (base nonce)
  string signed_download_url = 7;
  string content_hash = 8; // SHA-256 digest of the ciphertext content
  string revision_id = 9;
  int32 chunk_size = 10;
  RenditionStatus status = 11;
  google.protobuf.Timestamp url_expires_at = 12;
  string policy_version = 13;
  int64 source_version = 14;
  OfflinePackageType package_type = 15;
}

message GetOfflineManifestRequest {
  string device_id = 1;
}

message GetOfflineManifestResponse {
  // The pieces the caller may keep offline (unlocked + ungated).
  repeated OnyxContent items = 1;
  // The watermark / anti-piracy policy shown on the downloads surface.
  string watermark_policy = 2;
  // Encrypted renditions for the granted items.
  repeated EncryptedRendition encrypted_renditions = 3;
  google.protobuf.Timestamp grant_expires_at = 4;
  bool requires_purge = 5;
  // A server-issued challenge nonce for the client to sign when acknowledging a purge
  string purge_challenge = 6;
}

message RegisterDeviceRequest {
  string device_name = 1;
  // X.509 SPKI RSA public key PEM, non-exportable from Keystore
  string public_key_pem = 2;
  string attestation_data = 3;
  // Key ID or fingerprint to handle idempotency
  string key_fingerprint = 4;
  string app_version = 5;
  string os_version = 6;
  string security_level = 7; // e.g., "STRONGBOX", "TRUSTED_ENVIRONMENT", "SOFTWARE"
  string install_id = 8;
}

message RegisterDeviceResponse {
  string device_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message AcknowledgePurgeRequest {
  string device_id = 1;
  repeated string purged_content_ids = 2;
  string purge_challenge = 3;
  // Base64 signature of the purge_challenge using the device's private Keystore key
  string challenge_signature = 4;
}

message AcknowledgePurgeResponse {
  string receipt_id = 1;
}

message GetDeviceGrantsRequest {}

message DeviceGrantInfo {
  string device_id = 1;
  string device_name = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp last_sync_at = 6;
  string security_level = 7;
  string claimed_security_level = 8;
  string verified_security_level = 9;
  string attestation_status = 10;
  string purge_receipt_id = 11;
  repeated string pending_purge_content_ids = 12;
}

message GetDeviceGrantsResponse {
  repeated DeviceGrantInfo grants = 1;
}

message RevokeMyDeviceRequest {
  string device_id = 1;
}

message RevokeMyDeviceResponse {}

message MarkMyDeviceLostRequest {
  string device_id = 1;
}

message MarkMyDeviceLostResponse {}

message GetPurgeReceiptRequest {
  string receipt_id = 1;
}

message GetPurgeReceiptResponse {
  string receipt_id = 1;
  string device_id = 2;
  repeated string purged_content_ids = 3;
  // challenge_signature removed for security
  google.protobuf.Timestamp created_at = 5;
}

message ListOfflineManifestItemsRequest {
  string device_id = 1;
}

message OfflineManifestItemInfo {
  string content_id = 1;
  string rendition_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListOfflineManifestItemsResponse {
  repeated OfflineManifestItemInfo items = 1;
}

message RefreshOfflineRenditionsRequest {
  string device_id = 1;
  repeated string rendition_ids = 2;
}

message RefreshedRendition {
  string rendition_id = 1;
  string signed_download_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  string policy_version = 4;
  int64 source_version = 5;
}

message RefreshOfflineRenditionsResponse {
  repeated RefreshedRendition renditions = 1;
}

message RecordOfflineEventRequest {
  string id = 1;
  string device_id = 2;
  string content_id = 3;
  string rendition_id = 4;
  string event_type = 5;
  string outcome = 6;
  string error_code = 7;
  int64 bytes = 8;
  int32 latency_ms = 9;
  string metadata_json = 10;
}

message RecordOfflineEventResponse {
  string id = 1;
  bool success = 2;
}

// === P4 — year-in-onyx recap, annual archive, silent reactions ===

message GetYearInOnyxRequest {
  string year = 1; // optional; defaults to the current year
}
message GetYearInOnyxResponse {
  string year = 1;
  int32 pieces_started = 2;
  int32 pieces_finished = 3;
  int32 salons_attended = 4;
  int32 unlocks = 5;
  double onyx_score = 6;
  // Creators the member consumed, then creators they follow. Both surfaces
  // label this "CREATORS YOU FOLLOWED", so follows must be represented.
  repeated string top_creators = 7;
  repeated string notable_titles = 8; // finished pieces worth recalling
  // The most recent Annual Archive for this year, absent when never generated.
  AnnualArchive latest_archive = 9;
}

// AnnualArchive describes a generated archive PDF. public_url is a *signed*,
// short-lived URL and is re-issued on every read — it must never be cached by
// a client, and the stored r2:// locator must never be sent in its place.
message AnnualArchive {
  string media_asset_id = 1;
  string public_url = 2;
  google.protobuf.Timestamp generated_at = 3;
  int64 size_bytes = 4;
}

message GenerateAnnualArchiveRequest {
  string year = 1;
}
message GenerateAnnualArchiveResponse {
  string media_asset_id = 1;
  string public_url = 2;
  int32 page_count = 3;
  google.protobuf.Timestamp generated_at = 4;
}

message ReactToContentRequest {
  string content_id = 1;
  bool react = 2; // true = react, false = remove
}
message ReactToContentResponse {
  int32 reaction_count = 1;
  bool reacted = 2;
}

// === Reader OS capture + ingestion factory ===

// IngestionItem is the member-visible lifecycle of one private capture. The
// immutable original and parser diagnostics stay server-side; this DTO exposes
// only the provenance and recovery information the owner needs.
message IngestionItem {
  string id = 1;
  string source_type = 2; // text | url | rss | email | file | share
  string title = 3;
  string source_url = 4;
  string media_asset_id = 5;
  string original_filename = 6;
  string detected_mime = 7;
  int64 size_bytes = 8;
  string status = 9; // queued | processing | ready | needs_review | duplicate | failed | quarantined | archived
  string stage = 10;
  string error_message = 11;
  string duplicate_of_id = 12;
  string content_id = 13;
  string parser_version = 14;
  string checksum = 15;
  string language_code = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message CreateIngestionItemRequest {
  string source_type = 1;
  string title = 2;
  string source_url = 3;
  string body_text = 4;
  string media_asset_id = 5;
  string original_filename = 6;
}
message CreateIngestionItemResponse {
  IngestionItem item = 1;
}

message ListMyIngestionItemsRequest {
  string status = 1;
  int32 limit = 2;
}
message ListMyIngestionItemsResponse {
  repeated IngestionItem items = 1;
}

message GetIngestionItemRequest {
  string id = 1;
}
message GetIngestionItemResponse {
  IngestionItem item = 1;
}

message RetryIngestionItemRequest {
  string id = 1;
}
message RetryIngestionItemResponse {
  IngestionItem item = 1;
}

message SetIngestionItemStateRequest {
  string id = 1;
  string action = 2; // archive | restore | delete
}
message SetIngestionItemStateResponse {
  IngestionItem item = 1;
}

message ResolveIngestionDuplicateRequest {
  string id = 1;
  string action = 2; // keep_both | use_existing
}
message ResolveIngestionDuplicateResponse {
  IngestionItem item = 1;
}

// === Evidence briefing engine ===

// A policy-bearing provenance card. Administrative notes and internal storage
// locators never cross this member-facing contract.
message EvidenceSource {
  string id = 1;
  string content_id = 2;
  string revision_id = 3;
  string source_kind = 4;
  string title = 5;
  string canonical_url = 6;
  string archive_url = 7;
  string author = 8;
  string publisher = 9;
  string publisher_owner = 10;
  string jurisdiction = 11;
  string rights_status = 12;
  string funding = 13;
  string methods = 14;
  string conflicts = 15;
  string status = 16;
  google.protobuf.Timestamp published_at = 17;
  google.protobuf.Timestamp retrieved_at = 18;
}

message EvidenceCitation {
  string id = 1;
  string source_id = 2;
  string source_title = 3;
  string revision_id = 4;
  string passage_key = 5;
  string quote = 6;
  string relation = 7; // supports | contradicts | insufficient
  string independence_key = 8;
  string canonical_url = 9;
}

message EvidenceClaim {
  string id = 1;
  string content_id = 2;
  string revision_id = 3;
  string statement = 4;
  string classification = 5; // factual | analysis | opinion | question
  string verification_status = 6; // machine | verified | disputed | corrected | retracted
  double confidence = 7;
  int32 version = 8;
  repeated EvidenceCitation citations = 9;
}

message EvidenceCorrection {
  string id = 1;
  string source_id = 2;
  string claim_id = 3;
  string kind = 4; // correction | clarification | retraction
  string summary = 5;
  string replacement_text = 6;
  google.protobuf.Timestamp effective_at = 7;
  google.protobuf.Timestamp published_at = 8;
}

message GetEvidenceWorkspaceRequest {
  string content_id = 1;
}
message GetEvidenceWorkspaceResponse {
  string content_id = 1;
  string content_title = 2;
  string revision_id = 3;
  repeated EvidenceSource sources = 4;
  repeated EvidenceClaim claims = 5;
  repeated EvidenceCorrection corrections = 6;
  bool can_brief = 7;
  string policy_notice = 8;
}

message BriefPoint {
  string text = 1;
  string classification = 2; // factual | analysis
  repeated EvidenceCitation citations = 3;
}

message EvidenceBrief {
  string id = 1;
  string mode = 2;
  string question = 3;
  string title = 4;
  string status = 5;
  repeated BriefPoint points = 6;
  string model_key = 7;
  string prompt_key = 8;
  int32 prompt_version = 9;
  string source_manifest_checksum = 10;
  google.protobuf.Timestamp cutoff_at = 11;
  google.protobuf.Timestamp generated_at = 12;
  repeated EvidenceCorrection corrections = 13;
  int32 source_count = 14;
}

message CreateEvidenceBriefRequest {
  repeated string content_ids = 1;
  string mode = 2;
  string question = 3;
  repeated string pinned_source_ids = 4;
  repeated string excluded_source_ids = 5;
  google.protobuf.Timestamp cutoff_at = 6;
}
message CreateEvidenceBriefResponse {
  EvidenceBrief brief = 1;
}
message ListMyEvidenceBriefsRequest {
  int32 limit = 1;
}
message ListMyEvidenceBriefsResponse {
  repeated EvidenceBrief briefs = 1;
}
message GetEvidenceBriefRequest {
  string id = 1;
}
message GetEvidenceBriefResponse {
  EvidenceBrief brief = 1;
}

service OnyxService {
  // Profile Management
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // Content Delivery (Server-Side Gated)
  rpc ListContent(ListContentRequest) returns (ListContentResponse);

  // Exclusivity Mechanics
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);

  // P6.2 — content + library reads.
  rpc GetContent(GetContentRequest) returns (GetContentResponse);
  rpc ListShelf(ListShelfRequest) returns (ListShelfResponse);
  rpc ListContinue(ListContinueRequest) returns (ListContinueResponse);
  rpc GetShelves(GetShelvesRequest) returns (GetShelvesResponse);
  rpc RecordProgress(RecordProgressRequest) returns (RecordProgressResponse);

  // P6.6 — spend points to unlock one gated piece.
  rpc RedeemContent(RedeemContentRequest) returns (RedeemContentResponse);
  // P6.6 — open a Stripe checkout for the Onyx network subscription.
  rpc CreateSubscriptionCheckout(CreateSubscriptionCheckoutRequest) returns (CreateSubscriptionCheckoutResponse);

  // P2 — creators.
  rpc GetCreator(GetCreatorRequest) returns (GetCreatorResponse);
  rpc ListCreatorWorks(ListCreatorWorksRequest) returns (ListCreatorWorksResponse);
  rpc FollowCreator(FollowCreatorRequest) returns (FollowCreatorResponse);

  // P2 — search.
  rpc SearchContent(SearchContentRequest) returns (SearchContentResponse);

  // P2 — notes / highlights.
  rpc AddNote(AddNoteRequest) returns (AddNoteResponse);
  rpc ListMyNotes(ListMyNotesRequest) returns (ListMyNotesResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // Reader OS — stable passages, private highlights/notes/bookmarks,
  // cross-library search/export, and an offline-safe change cursor.
  rpc UpsertReaderAnnotation(UpsertReaderAnnotationRequest) returns (UpsertReaderAnnotationResponse);
  rpc DeleteReaderAnnotation(DeleteReaderAnnotationRequest) returns (DeleteReaderAnnotationResponse);
  rpc ListMyReaderAnnotations(ListMyReaderAnnotationsRequest) returns (ListMyReaderAnnotationsResponse);
  rpc SearchReader(SearchReaderRequest) returns (SearchReaderResponse);
  rpc ExportReaderData(ExportReaderDataRequest) returns (ExportReaderDataResponse);
  rpc ListReaderSyncChanges(ListReaderSyncChangesRequest) returns (ListReaderSyncChangesResponse);

  // P2 — personal library / account.
  rpc ListMyUnlocks(ListMyUnlocksRequest) returns (ListMyUnlocksResponse);
  rpc ListMySubscriptions(ListMySubscriptionsRequest) returns (ListMySubscriptionsResponse);
  rpc ListMyFollows(ListMyFollowsRequest) returns (ListMyFollowsResponse);

  // P2 — sovereign window calendar.
  rpc ListSovereignWindow(ListSovereignWindowRequest) returns (ListSovereignWindowResponse);

  // P2 — multi-part series.
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesResponse);
  rpc GetSeries(GetSeriesRequest) returns (GetSeriesResponse);

  // P2.5 — captions, today summary, cross-pillar unlock bus.
  rpc GenerateCaptions(GenerateCaptionsRequest) returns (GenerateCaptionsResponse);
  rpc GetTodaySummary(GetTodaySummaryRequest) returns (GetTodaySummaryResponse);
  rpc GetCrossPillarUnlocks(GetCrossPillarUnlocksRequest) returns (GetCrossPillarUnlocksResponse);

  // P3 — curator concierge desk.
  rpc StartConciergeThread(StartConciergeThreadRequest) returns (StartConciergeThreadResponse);
  rpc ListMyConciergeThreads(ListMyConciergeThreadsRequest) returns (ListMyConciergeThreadsResponse);
  rpc GetConciergeThread(GetConciergeThreadRequest) returns (GetConciergeThreadResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // P3 — live / the salon.
  rpc ListLiveEvents(ListLiveEventsRequest) returns (ListLiveEventsResponse);
  rpc GetLiveEvent(GetLiveEventRequest) returns (GetLiveEventResponse);
  rpc RsvpLiveEvent(RsvpLiveEventRequest) returns (RsvpLiveEventResponse);

  // P3 — posthumous archive (encrypted at rest).
  rpc SetPosthumousArchive(SetPosthumousArchiveRequest) returns (SetPosthumousArchiveResponse);
  rpc GetPosthumousArchive(GetPosthumousArchiveRequest) returns (GetPosthumousArchiveResponse);

  // P3 — editorial anthology.
  rpc ListAnthologies(ListAnthologiesRequest) returns (ListAnthologiesResponse);
  rpc GetAnthology(GetAnthologyRequest) returns (GetAnthologyResponse);

  // P3.5 — signed share embeds + offline manifest + device grants.
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  rpc ListMyShareLinks(ListMyShareLinksRequest) returns (ListMyShareLinksResponse);
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse);
  rpc GetOfflineManifest(GetOfflineManifestRequest) returns (GetOfflineManifestResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc AcknowledgePurge(AcknowledgePurgeRequest) returns (AcknowledgePurgeResponse);
  rpc GetDeviceGrants(GetDeviceGrantsRequest) returns (GetDeviceGrantsResponse);
  rpc RevokeMyDevice(RevokeMyDeviceRequest) returns (RevokeMyDeviceResponse);
  rpc MarkMyDeviceLost(MarkMyDeviceLostRequest) returns (MarkMyDeviceLostResponse);
  rpc GetPurgeReceipt(GetPurgeReceiptRequest) returns (GetPurgeReceiptResponse);
  rpc ListOfflineManifestItems(ListOfflineManifestItemsRequest) returns (ListOfflineManifestItemsResponse);
  rpc RefreshOfflineRenditions(RefreshOfflineRenditionsRequest) returns (RefreshOfflineRenditionsResponse);
  rpc RecordOfflineEvent(RecordOfflineEventRequest) returns (RecordOfflineEventResponse);

  // P4 — year-in-onyx recap, annual archive PDF, silent reactions.
  rpc GetYearInOnyx(GetYearInOnyxRequest) returns (GetYearInOnyxResponse);
  rpc GenerateAnnualArchive(GenerateAnnualArchiveRequest) returns (GenerateAnnualArchiveResponse);
  rpc ReactToContent(ReactToContentRequest) returns (ReactToContentResponse);

  // Reader OS capture — private imports with durable processing and explicit
  // duplicate/failure recovery.
  rpc CreateIngestionItem(CreateIngestionItemRequest) returns (CreateIngestionItemResponse);
  rpc ListMyIngestionItems(ListMyIngestionItemsRequest) returns (ListMyIngestionItemsResponse);
  rpc GetIngestionItem(GetIngestionItemRequest) returns (GetIngestionItemResponse);
  rpc RetryIngestionItem(RetryIngestionItemRequest) returns (RetryIngestionItemResponse);
  rpc SetIngestionItemState(SetIngestionItemStateRequest) returns (SetIngestionItemStateResponse);
  rpc ResolveIngestionDuplicate(ResolveIngestionDuplicateRequest) returns (ResolveIngestionDuplicateResponse);

  // Evidence briefing — source cards, claim-level citations, reproducible
  // selected-source runs, and correction overlays on historical output.
  rpc GetEvidenceWorkspace(GetEvidenceWorkspaceRequest) returns (GetEvidenceWorkspaceResponse);
  rpc CreateEvidenceBrief(CreateEvidenceBriefRequest) returns (CreateEvidenceBriefResponse);
  rpc ListMyEvidenceBriefs(ListMyEvidenceBriefsRequest) returns (ListMyEvidenceBriefsResponse);
  rpc GetEvidenceBrief(GetEvidenceBriefRequest) returns (GetEvidenceBriefResponse);
}
