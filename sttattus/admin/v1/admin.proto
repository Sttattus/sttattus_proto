syntax = "proto3";

package sttattus.admin.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/auth/v1/auth.proto";
import "sttattus/common/v1/pagination.proto";
import "sttattus/user/v1/user.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/admin/v1;adminv1";

message AdminUserRow {
  sttattus.user.v1.UserProfile profile = 1;
  repeated sttattus.user.v1.AppAccess apps = 2;
}

message ListUsersRequest {
  sttattus.common.v1.PageRequest page = 1;
  string search = 2; // matches email or name (substring, case-insensitive)
  sttattus.auth.v1.AppCode filter_by_app = 3;
  bool only_banned = 4;
  bool only_admins = 5;
}
message ListUsersResponse {
  repeated AdminUserRow rows = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  AdminUserRow row = 1;
}

message BanUserRequest {
  string user_id = 1;
  string reason = 2;
  bool unban = 3; // true = lift the ban
}
message BanUserResponse {
  AdminUserRow row = 1;
}

enum BulkAction {
  BULK_ACTION_UNSPECIFIED = 0;
  BULK_ACTION_BAN = 1;
  BULK_ACTION_UNBAN = 2;
  BULK_ACTION_REVOKE_APP = 3;
}

message BulkActionRequest {
  repeated string user_ids = 1;
  BulkAction action = 2;
  sttattus.auth.v1.AppCode app_code = 3; // for REVOKE_APP
  string reason = 4;
}
message BulkActionResponse {
  int32 affected = 1;
}

message AuditLogEntry {
  string id = 1;
  string actor_id = 2;
  string actor_email = 3;
  string target_user_id = 4;
  string action = 5;
  string payload_json = 6;
  string ip = 7;
  int64 created_at = 8;
}

message ListAuditLogsRequest {
  sttattus.common.v1.PageRequest page = 1;
  string actor_id = 2;
  string target_user_id = 3;
  string action = 4;
}
message ListAuditLogsResponse {
  repeated AuditLogEntry entries = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message DeviceGrantRow {
  string device_id = 1;
  string user_id = 2;
  string device_name = 3;
  string status = 4; // active, revoked, expired, purged, lost
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp last_sync_at = 7;
  string security_level = 8;
  string key_fingerprint = 9;
}

message ListDeviceGrantsRequest {
  string user_id = 1; // optional
  sttattus.common.v1.PageRequest page = 2;
}
message ListDeviceGrantsResponse {
  repeated DeviceGrantRow rows = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message RevokeDeviceGrantRequest {
  string device_id = 1;
  string reason = 2;
}
message RevokeDeviceGrantResponse {
  DeviceGrantRow row = 1;
}

service AdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc BanUser(BanUserRequest) returns (BanUserResponse);
  rpc BulkAction(BulkActionRequest) returns (BulkActionResponse);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc ListDeviceGrants(ListDeviceGrantsRequest) returns (ListDeviceGrantsResponse);
  rpc RevokeDeviceGrant(RevokeDeviceGrantRequest) returns (RevokeDeviceGrantResponse);

  // === Admin Opportunity Choices 1-15 RPCs ===
  rpc GetUniversalWorkItemCaseOverview(GetUniversalWorkItemCaseOverviewRequest) returns (GetUniversalWorkItemCaseOverviewResponse);
  rpc UpsertWorkItemAdapterRule(UpsertWorkItemAdapterRuleRequest) returns (UpsertWorkItemAdapterRuleResponse);
  rpc TransitionUniversalWorkItemState(TransitionUniversalWorkItemStateRequest) returns (TransitionUniversalWorkItemStateResponse);
  rpc GetRoutingSkillsSlaOverview(GetRoutingSkillsSlaOverviewRequest) returns (GetRoutingSkillsSlaOverviewResponse);
  rpc UpsertStaffSkillCapacityProfile(UpsertStaffSkillCapacityProfileRequest) returns (UpsertStaffSkillCapacityProfileResponse);
  rpc TriggerSlaBreachEscalation(TriggerSlaBreachEscalationRequest) returns (TriggerSlaBreachEscalationResponse);
  rpc GetEvidenceSopDecisionOverview(GetEvidenceSopDecisionOverviewRequest) returns (GetEvidenceSopDecisionOverviewResponse);
  rpc RecordEvidenceCustodyAssertion(RecordEvidenceCustodyAssertionRequest) returns (RecordEvidenceCustodyAssertionResponse);
  rpc CommitFourEyesSopDecision(CommitFourEyesSopDecisionRequest) returns (CommitFourEyesSopDecisionResponse);
  rpc GetCommunicationsConciergeOverview(GetCommunicationsConciergeOverviewRequest) returns (GetCommunicationsConciergeOverviewResponse);
  rpc SaveApprovedMacroOrDraft(SaveApprovedMacroOrDraftRequest) returns (SaveApprovedMacroOrDraftResponse);
  rpc DispatchReviewedMemberReply(DispatchReviewedMemberReplyRequest) returns (DispatchReviewedMemberReplyResponse);
  rpc GetVerificationAutomationAppealsOverview(GetVerificationAutomationAppealsOverviewRequest) returns (GetVerificationAutomationAppealsOverviewResponse);
  rpc EvaluateExplainableVerificationRule(EvaluateExplainableVerificationRuleRequest) returns (EvaluateExplainableVerificationRuleResponse);
  rpc ResolveMemberVerificationAppeal(ResolveMemberVerificationAppealRequest) returns (ResolveMemberVerificationAppealResponse);
  rpc GetCatalogContentPolicyStudioOverview(GetCatalogContentPolicyStudioOverviewRequest) returns (GetCatalogContentPolicyStudioOverviewResponse);
  rpc StageCatalogOrPolicyRelease(StageCatalogOrPolicyReleaseRequest) returns (StageCatalogOrPolicyReleaseResponse);
  rpc PublishOrRollbackStudioRelease(PublishOrRollbackStudioReleaseRequest) returns (PublishOrRollbackStudioReleaseResponse);
  rpc GetPlatformReconciliationOpsOverview(GetPlatformReconciliationOpsOverviewRequest) returns (GetPlatformReconciliationOpsOverviewResponse);
  rpc RunSyntheticJourneyOrInvariantCheck(RunSyntheticJourneyOrInvariantCheckRequest) returns (RunSyntheticJourneyOrInvariantCheckResponse);
  rpc ReplayDeadLetterOrDryRunRepair(ReplayDeadLetterOrDryRunRepairRequest) returns (ReplayDeadLetterOrDryRunRepairResponse);
  rpc GetAiControlQualityCalibrationOverview(GetAiControlQualityCalibrationOverviewRequest) returns (GetAiControlQualityCalibrationOverviewResponse);
  rpc RegisterModelDeploymentManifest(RegisterModelDeploymentManifestRequest) returns (RegisterModelDeploymentManifestResponse);
  rpc RecordBlindQaCalibrationReview(RecordBlindQaCalibrationReviewRequest) returns (RecordBlindQaCalibrationReviewResponse);
  rpc GetSecurityPrivacyRecoveryOverview(GetSecurityPrivacyRecoveryOverviewRequest) returns (GetSecurityPrivacyRecoveryOverviewResponse);
  rpc RequestJitPrivilegedElevation(RequestJitPrivilegedElevationRequest) returns (RequestJitPrivilegedElevationResponse);
  rpc ExecutePrivacyOrAccountRecoveryCase(ExecutePrivacyOrAccountRecoveryCaseRequest) returns (ExecutePrivacyOrAccountRecoveryCaseResponse);
  rpc GetFraudAbuseTrustGraphOverview(GetFraudAbuseTrustGraphOverviewRequest) returns (GetFraudAbuseTrustGraphOverviewResponse);
  rpc LogExplainableTrustSignalCluster(LogExplainableTrustSignalClusterRequest) returns (LogExplainableTrustSignalClusterResponse);
  rpc ApplyReversibleTrustSanction(ApplyReversibleTrustSanctionRequest) returns (ApplyReversibleTrustSanctionResponse);
  rpc GetCommerceEntitlementPayoutOverview(GetCommerceEntitlementPayoutOverviewRequest) returns (GetCommerceEntitlementPayoutOverviewResponse);
  rpc CreateLedgerAdjustmentPreview(CreateLedgerAdjustmentPreviewRequest) returns (CreateLedgerAdjustmentPreviewResponse);
  rpc ReconcileEntitlementOrPartnerPayout(ReconcileEntitlementOrPartnerPayoutRequest) returns (ReconcileEntitlementOrPartnerPayoutResponse);
  rpc GetMasterIncidentBulkRemediationOverview(GetMasterIncidentBulkRemediationOverviewRequest) returns (GetMasterIncidentBulkRemediationOverviewResponse);
  rpc StageMasterIncidentCohortPlan(StageMasterIncidentCohortPlanRequest) returns (StageMasterIncidentCohortPlanResponse);
  rpc FanoutIdempotentBulkRemediation(FanoutIdempotentBulkRemediationRequest) returns (FanoutIdempotentBulkRemediationResponse);
  rpc GetWorkforceLearningCertificationOverview(GetWorkforceLearningCertificationOverviewRequest) returns (GetWorkforceLearningCertificationOverviewResponse);
  rpc UpsertStaffCertificationPath(UpsertStaffCertificationPathRequest) returns (UpsertStaffCertificationPathResponse);
  rpc RecordCalibratedSandboxOrCoaching(RecordCalibratedSandboxOrCoachingRequest) returns (RecordCalibratedSandboxOrCoachingResponse);
  rpc GetSimulationReleaseCertificationOverview(GetSimulationReleaseCertificationOverviewRequest) returns (GetSimulationReleaseCertificationOverviewResponse);
  rpc RunFailureClockSimulationScenario(RunFailureClockSimulationScenarioRequest) returns (RunFailureClockSimulationScenarioResponse);
  rpc IssueSignedReleaseCertificate(IssueSignedReleaseCertificateRequest) returns (IssueSignedReleaseCertificateResponse);
  rpc GetIndependentAuditObserverOverview(GetIndependentAuditObserverOverviewRequest) returns (GetIndependentAuditObserverOverviewResponse);
  rpc CreateTimeBoundObserverEngagement(CreateTimeBoundObserverEngagementRequest) returns (CreateTimeBoundObserverEngagementResponse);
  rpc GenerateWatermarkedControlEvidencePack(GenerateWatermarkedControlEvidencePackRequest) returns (GenerateWatermarkedControlEvidencePackResponse);
}

