syntax = "proto3";

package sttattus.travel.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/travel/v1;travelv1";

message NomadStats {
  string user_id = 1;
  int32 exploration_score = 2;
  int32 countries_visited_count = 3;
  string nomad_rank_label = 4; // e.g., 'Voyager'
  double nomad_rank = 5; // Normalized 1-100 status signal
  int32 verified_checkins_count = 6;
}

message Milestone {
  string id = 1;
  string user_id = 2;
  string country_code = 3;
  string city = 4;
  string photo_url = 5;
  string thumbnail_url = 6;
  string accent_color_hex = 7;
  string story = 8;
  int64 achieved_at = 9;
  bool is_verified = 10;
  CheckIn checkin = 11;
}

// CheckIn represents a verified presence event.
message CheckIn {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  string ip_address = 4;
  string city = 5;
  string region = 6;
  string country_code = 7;
  google.protobuf.Timestamp verified_at = 8;
  bool is_elite_hub = 9; // True if this location is in the Jetset Registry
}

// REQ/RES
message ListMilestonesRequest {
  string user_id = 1;
  sttattus.common.v1.PageRequest page = 2;
}
message ListMilestonesResponse {
  repeated Milestone milestones = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message CreateMilestoneRequest {
  string country_code = 1;
  string city = 2;
  string media_asset_id = 3;
  string story = 4;
  int64 achieved_at = 5;
  CheckIn checkin = 6; // Optional: provided if location is available
}
message CreateMilestoneResponse {
  Milestone milestone = 1;
  NomadStats stats = 2;
}

message GetNomadStatsRequest {
  string user_id = 1;
}
message GetNomadStatsResponse {
  NomadStats stats = 1;
}

message ListFeedRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListFeedResponse {
  repeated Milestone milestones = 1; // Reusing milestones for the feed for simplicity
  sttattus.common.v1.PageResponse page = 2;
}

// === Trip entity (N10.2) ===
//
// A Trip groups one or more visits into a single journey.
// audits/nomad.md §10 Phase 1 item 2. A trip can be itinerary-only
// before visits land; once visits roll in (EXIF, boarding-pass scan,
// manual milestone) they attach by trip_id and the trip moves from
// planned -> in_flight -> completed.

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_PLANNED = 1;
  TRIP_STATUS_IN_FLIGHT = 2;
  TRIP_STATUS_COMPLETED = 3;
  TRIP_STATUS_CANCELLED = 4;
}

message Trip {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string cover_url = 4;
  TripStatus status = 5;
  int64 planned_start = 6;
  int64 planned_end = 7;
  int64 actual_start = 8;
  int64 actual_end = 9;
  repeated Milestone visits = 10;
  int64 created_at = 11;
}

message CreateTripRequest {
  string title = 1;
  int64 planned_start = 2;
  int64 planned_end = 3;
}
message CreateTripResponse {
  Trip trip = 1;
}

message UpdateTripRequest {
  string id = 1;
  string title = 2;
  string cover_url = 3;
  TripStatus status = 4;
  int64 planned_start = 5;
  int64 planned_end = 6;
}
message UpdateTripResponse {
  Trip trip = 1;
}

message ListMyTripsRequest {
  // 0 = all statuses.
  TripStatus status_filter = 1;
}
message ListMyTripsResponse {
  repeated Trip trips = 1;
}

message GetTripRequest {
  string id = 1;
}
message GetTripResponse {
  Trip trip = 1;
}

message AttachVisitToTripRequest {
  string trip_id = 1;
  string milestone_id = 2;
}
message AttachVisitToTripResponse {
  Trip trip = 1;
}

message DeleteTripRequest {
  string id = 1;
}
message DeleteTripResponse {}

// === Country chip grid + continent claim (N10.5) ===

message VisitedCountry {
  string country_code = 1;
  string continent = 2;
  int32 visit_count = 3;
  int32 verified_count = 4;
  int64 last_visit = 5;
}

message ContinentClaim {
  string continent = 1;
  int32 count = 2;
}

message ListVisitedCountriesRequest {}
message ListVisitedCountriesResponse {
  repeated VisitedCountry countries = 1;
  repeated ContinentClaim continents = 2;
}

// === Concierge thread (N10.6) ===

message ConciergeMessage {
  string id = 1;
  bool is_staff = 2;
  string sender_user_id = 3;
  string body = 4;
  int64 created_at = 5;
}

message ListConciergeMessagesRequest {}
message ListConciergeMessagesResponse {
  repeated ConciergeMessage messages = 1;
}

message PostConciergeMessageRequest {
  string body = 1;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// === Per-milestone verification signals (N10.7) ===

message VerificationSignals {
  string milestone_id = 1;
  bool exif_gps_present = 2;
  bool exif_gps_matches = 3;
  bool ip_geo_present = 4;
  bool ip_geo_matches = 5;
  bool elite_hub_match = 6;
  bool boarding_pass_present = 7;
  bool boarding_pass_matches = 8;
  bool concierge_witness = 9;
  // Derived: true when ≥ 2 _matches signals fire.
  bool fully_verified = 10;
}

message ListMyVerificationSignalsRequest {
  int32 limit = 1;
}
message ListMyVerificationSignalsResponse {
  repeated VerificationSignals signals = 1;
}

// === Privacy granularity (N10.8) ===

message CountryVisibility {
  string country_code = 1;
  string visibility = 2; // 'public' | 'matched' | 'private'
}

message ListCountryVisibilityRequest {}
message ListCountryVisibilityResponse {
  repeated CountryVisibility entries = 1;
}

message UpsertCountryVisibilityRequest {
  string country_code = 1;
  string visibility = 2;
}
message UpsertCountryVisibilityResponse {
  CountryVisibility entry = 1;
}

message SetMilestoneVisibilityRequest {
  string milestone_id = 1;
  string visit_visibility = 2;
  string photo_visibility = 3;
}
message SetMilestoneVisibilityResponse {}

service TravelService {
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);
  rpc CreateMilestone(CreateMilestoneRequest) returns (CreateMilestoneResponse);
  rpc GetNomadStats(GetNomadStatsRequest) returns (GetNomadStatsResponse);
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);

  // N10.2 — Trip entity lifecycle.
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  rpc UpdateTrip(UpdateTripRequest) returns (UpdateTripResponse);
  rpc ListMyTrips(ListMyTripsRequest) returns (ListMyTripsResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc AttachVisitToTrip(AttachVisitToTripRequest) returns (AttachVisitToTripResponse);
  rpc DeleteTrip(DeleteTripRequest) returns (DeleteTripResponse);

  // N10.5 — country chip grid + continent claim.
  rpc ListVisitedCountries(ListVisitedCountriesRequest) returns (ListVisitedCountriesResponse);

  // N10.6 — Sovereign-tier concierge thread.
  rpc ListConciergeMessages(ListConciergeMessagesRequest) returns (ListConciergeMessagesResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // N10.7 — verification dashboard per milestone.
  rpc ListMyVerificationSignals(ListMyVerificationSignalsRequest) returns (ListMyVerificationSignalsResponse);

  // N10.8 — privacy granularity.
  rpc ListCountryVisibility(ListCountryVisibilityRequest) returns (ListCountryVisibilityResponse);
  rpc UpsertCountryVisibility(UpsertCountryVisibilityRequest) returns (UpsertCountryVisibilityResponse);
  rpc SetMilestoneVisibility(SetMilestoneVisibilityRequest) returns (SetMilestoneVisibilityResponse);
}
