  string item_code = 2;
  string title = 3;
  string status = 4;
  string primary_detail = 5;
  string secondary_detail = 6;
  string governance_notice = 7;
  bool no_missing_rules_as_clear_enforced = 8;
  string updated_at = 9;
}

message GetEntryDocumentReadinessOverviewRequest {
  string filter_status = 1;
}

message GetEntryDocumentReadinessOverviewResponse {
  repeated EntryReadinessRuleItem items = 1;
  string active_policy_version = 2;
  bool no_missing_rules_as_clear_enforced = 3;
  string governance_summary = 4;
}

message EvaluateEntryReadinessRequest {
  string item_code = 1;
  string title = 2;
  string primary_detail = 3;
  string secondary_detail = 4;
}

message EvaluateEntryReadinessResponse {
  EntryReadinessRuleItem item = 1;
}

message EscalateJurisdictionAmbiguityRequest {
  string item_id = 1;
  string action_kind = 2;
  string operator_note = 3;
}

message EscalateJurisdictionAmbiguityResponse {
  EntryReadinessRuleItem item = 1;
