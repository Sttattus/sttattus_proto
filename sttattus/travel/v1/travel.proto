syntax = "proto3";

package sttattus.travel.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/travel/v1;travelv1";

message NomadStats {
  string user_id = 1;
  int32 exploration_score = 2;
  int32 countries_visited_count = 3;
  string nomad_rank_label = 4; // e.g., 'Voyager'
  double nomad_rank = 5; // Normalized 1-100 status signal
  int32 verified_checkins_count = 6;
}

message Milestone {
  string id = 1;
  string user_id = 2;
  string country_code = 3;
  string city = 4;
  string photo_url = 5;
  string thumbnail_url = 6;
  string accent_color_hex = 7;
  string story = 8;
  int64 achieved_at = 9;
  bool is_verified = 10;
  // A verified presence event. Present only when the member actually checked
  // in from the place, which is what makes the milestone verified.
  CheckIn checkin = 11;

  // Where this milestone is, approximately, whether or not it was verified.
  //
  // Coordinates used to travel only inside `checkin`, and `checkin` is only
  // populated for a verified milestone. So a milestone logged from the Globe
  // — city and country, no device fix — reached the client with no position
  // at all, and the Globe's pin layer dropped it. The map stayed empty no
  // matter how much a member logged.
  //
  // Resolved from the city server-side. (0,0) means "we could not place it",
  // and the pin layer must keep skipping that rather than drawing the Gulf of
  // Guinea. Read `is_verified` to colour the pin: this field is a claim about
  // where the member says they were, not proof that they were there.
  double latitude = 12;
  double longitude = 13;
}

// CheckIn represents a verified presence event.
message CheckIn {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  string ip_address = 4;
  string city = 5;
  string region = 6;
  string country_code = 7;
  google.protobuf.Timestamp verified_at = 8;
  bool is_elite_hub = 9; // True if this location is in the Jetset Registry
}

// REQ/RES
message ListMilestonesRequest {
  string user_id = 1;
  sttattus.common.v1.PageRequest page = 2;
}
message ListMilestonesResponse {
  repeated Milestone milestones = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message CreateMilestoneRequest {
  string country_code = 1;
  string city = 2;
  string media_asset_id = 3;
  string story = 4;
  int64 achieved_at = 5;
  CheckIn checkin = 6; // Optional: provided if location is available
}
message CreateMilestoneResponse {
  Milestone milestone = 1;
  NomadStats stats = 2;
}

message GetNomadStatsRequest {
  string user_id = 1;
}
message GetNomadStatsResponse {
  NomadStats stats = 1;
}

message ListFeedRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListFeedResponse {
  repeated Milestone milestones = 1; // Reusing milestones for the feed for simplicity
  sttattus.common.v1.PageResponse page = 2;
}

// === Trip entity (N10.2) ===
//
// A Trip groups one or more visits into a single journey.
// audits/nomad.md §10 Phase 1 item 2. A trip can be itinerary-only
// before visits land; once visits roll in (EXIF, boarding-pass scan,
// manual milestone) they attach by trip_id and the trip moves from
// planned -> in_flight -> completed.

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_PLANNED = 1;
  TRIP_STATUS_IN_FLIGHT = 2;
  TRIP_STATUS_COMPLETED = 3;
  TRIP_STATUS_CANCELLED = 4;
}

message Trip {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string cover_url = 4;
  TripStatus status = 5;
  int64 planned_start = 6;
  int64 planned_end = 7;
  int64 actual_start = 8;
  int64 actual_end = 9;
  repeated Milestone visits = 10;
  int64 created_at = 11;
}

message CreateTripRequest {
  string title = 1;
  int64 planned_start = 2;
  int64 planned_end = 3;
}
message CreateTripResponse {
  Trip trip = 1;
}

message UpdateTripRequest {
  string id = 1;
  string title = 2;
  string cover_url = 3;
  TripStatus status = 4;
  int64 planned_start = 5;
  int64 planned_end = 6;
}
message UpdateTripResponse {
  Trip trip = 1;
}

message ListMyTripsRequest {
  // 0 = all statuses.
  TripStatus status_filter = 1;
}
message ListMyTripsResponse {
  repeated Trip trips = 1;
}

message GetTripRequest {
  string id = 1;
}
message GetTripResponse {
  Trip trip = 1;
}

message AttachVisitToTripRequest {
  string trip_id = 1;
  string milestone_id = 2;
}
message AttachVisitToTripResponse {
  Trip trip = 1;
}

message DeleteTripRequest {
  string id = 1;
}
message DeleteTripResponse {}

// === Country chip grid + continent claim (N10.5) ===

message VisitedCountry {
  string country_code = 1;
  string continent = 2;
  int32 visit_count = 3;
  int32 verified_count = 4;
  int64 last_visit = 5;
}

message ContinentClaim {
  string continent = 1;
  int32 count = 2;
}

message ListVisitedCountriesRequest {}
message ListVisitedCountriesResponse {
  repeated VisitedCountry countries = 1;
  repeated ContinentClaim continents = 2;
}

// === Concierge thread (N10.6) ===

message ConciergeMessage {
  string id = 1;
  bool is_staff = 2;
  string sender_user_id = 3;
  string body = 4;
  int64 created_at = 5;

  // The concierge who wrote it. Empty for member and system messages, and
  // for replies written before authorship was recorded.
  //
  // Every desk on the platform answered as an anonymous "STAFF" until
  // 2026-08-23; lexicon's tutor desk had carried a name since migration 0079
  // and was the only one. A white-glove desk that will not say who is
  // speaking is not white-glove.
  string author_name = 6;
}

message ListConciergeMessagesRequest {}
message ListConciergeMessagesResponse {
  repeated ConciergeMessage messages = 1;
}

message PostConciergeMessageRequest {
  string body = 1;
}
message PostConciergeMessageResponse {
  ConciergeMessage message = 1;
}

// === Per-milestone verification signals (N10.7) ===

message VerificationSignals {
  string milestone_id = 1;
  bool exif_gps_present = 2;
  bool exif_gps_matches = 3;
  bool ip_geo_present = 4;
  bool ip_geo_matches = 5;
  bool elite_hub_match = 6;
  bool boarding_pass_present = 7;
  bool boarding_pass_matches = 8;
  bool concierge_witness = 9;
  // Derived: true when ≥ 2 _matches signals fire.
  bool fully_verified = 10;
}

message ListMyVerificationSignalsRequest {
  int32 limit = 1;
}
message ListMyVerificationSignalsResponse {
  repeated VerificationSignals signals = 1;
}

// === Privacy granularity (N10.8) ===

message CountryVisibility {
  string country_code = 1;
  string visibility = 2; // 'public' | 'matched' | 'private'
}

message ListCountryVisibilityRequest {}
message ListCountryVisibilityResponse {
  repeated CountryVisibility entries = 1;
}

message UpsertCountryVisibilityRequest {
  string country_code = 1;
  string visibility = 2;
}
message UpsertCountryVisibilityResponse {
  CountryVisibility entry = 1;
}

message SetMilestoneVisibilityRequest {
  string milestone_id = 1;
  string visit_visibility = 2;
  string photo_visibility = 3;
}
message SetMilestoneVisibilityResponse {}

service TravelService {
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);
  rpc CreateMilestone(CreateMilestoneRequest) returns (CreateMilestoneResponse);
  rpc GetNomadStats(GetNomadStatsRequest) returns (GetNomadStatsResponse);
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);

  // N10.2 — Trip entity lifecycle.
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  rpc UpdateTrip(UpdateTripRequest) returns (UpdateTripResponse);
  rpc ListMyTrips(ListMyTripsRequest) returns (ListMyTripsResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc AttachVisitToTrip(AttachVisitToTripRequest) returns (AttachVisitToTripResponse);
  rpc DeleteTrip(DeleteTripRequest) returns (DeleteTripResponse);

  // N10.5 — country chip grid + continent claim.
  rpc ListVisitedCountries(ListVisitedCountriesRequest) returns (ListVisitedCountriesResponse);

  // N10.6 — Sovereign-tier concierge thread.
  rpc ListConciergeMessages(ListConciergeMessagesRequest) returns (ListConciergeMessagesResponse);
  rpc PostConciergeMessage(PostConciergeMessageRequest) returns (PostConciergeMessageResponse);

  // N10.7 — verification dashboard per milestone.
  rpc ListMyVerificationSignals(ListMyVerificationSignalsRequest) returns (ListMyVerificationSignalsResponse);

  // N10.8 — privacy granularity.
  rpc ListCountryVisibility(ListCountryVisibilityRequest) returns (ListCountryVisibilityResponse);
  rpc UpsertCountryVisibility(UpsertCountryVisibilityRequest) returns (UpsertCountryVisibilityResponse);
  rpc SetMilestoneVisibility(SetMilestoneVisibilityRequest) returns (SetMilestoneVisibilityResponse);

  // N10P3 â€” Sovereign Expansion
  rpc GetPassportSurface(GetPassportSurfaceRequest) returns (GetPassportSurfaceResponse);
  rpc GetLoungeConcierge(GetLoungeConciergeRequest) returns (GetLoungeConciergeResponse);
  rpc GetTripArchive(GetTripArchiveRequest) returns (GetTripArchiveResponse);

  // N2 — itinerary ingestion (flight-confirmation text -> trip skeleton).
  rpc ParseItineraryText(ParseItineraryTextRequest) returns (ParseItineraryTextResponse);
  rpc ListMyItineraries(ListMyItinerariesRequest) returns (ListMyItinerariesResponse);
  rpc ConfirmItinerary(ConfirmItineraryRequest) returns (ConfirmItineraryResponse);

  // N2 — partner directory (hotels / restaurants / lounges / aviation).
  rpc ListTravelPartners(ListTravelPartnersRequest) returns (ListTravelPartnersResponse);
  rpc GetTravelPartner(GetTravelPartnerRequest) returns (GetTravelPartnerResponse);

  // N3 — Nomad Anthology (named-author insider city guides).
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // N3.5 — public passport share (read-only, time-bound token).
  rpc CreatePassportShare(CreatePassportShareRequest) returns (CreatePassportShareResponse);
  rpc ListMyPassportShares(ListMyPassportSharesRequest) returns (ListMyPassportSharesResponse);
  rpc RevokePassportShare(RevokePassportShareRequest) returns (RevokePassportShareResponse);

  // N4 — Annual Atlas (generated hardcover-grade PDF).
  rpc GenerateNomadAtlas(GenerateNomadAtlasRequest) returns (GenerateNomadAtlasResponse);

  // Choice 1 (N1): Universal Ingestion and Trip Graph
  rpc GetUniversalTripGraphOverview(GetUniversalTripGraphOverviewRequest) returns (GetUniversalTripGraphOverviewResponse);
  rpc UpsertTripGraphSegment(UpsertTripGraphSegmentRequest) returns (UpsertTripGraphSegmentResponse);
  rpc ReconcileParserDiffEvent(ReconcileParserDiffEventRequest) returns (ReconcileParserDiffEventResponse);

  // Choice 2 (N2/N12): Multi-Source Truth and Live Flight Command
  rpc GetLiveFlightCommandOverview(GetLiveFlightCommandOverviewRequest) returns (GetLiveFlightCommandOverviewResponse);
  rpc RecordFlightObservation(RecordFlightObservationRequest) returns (RecordFlightObservationResponse);
  rpc TriggerDisruptionRecoveryPlan(TriggerDisruptionRecoveryPlanRequest) returns (TriggerDisruptionRecoveryPlanResponse);

  // Choice 3 (N4): Encrypted Offline Trip Pack
  rpc GetOfflineTripPackOverview(GetOfflineTripPackOverviewRequest) returns (GetOfflineTripPackOverviewResponse);
  rpc StageOfflineTripPack(StageOfflineTripPackRequest) returns (StageOfflineTripPackResponse);
  rpc SyncOfflineMutationReceipt(SyncOfflineMutationReceiptRequest) returns (SyncOfflineMutationReceiptResponse);

  // Choice 4 (N3): Entry and Document Readiness
  rpc GetEntryDocumentReadinessOverview(GetEntryDocumentReadinessOverviewRequest) returns (GetEntryDocumentReadinessOverviewResponse);
  rpc EvaluateEntryReadiness(EvaluateEntryReadinessRequest) returns (EvaluateEntryReadinessResponse);
  rpc EscalateJurisdictionAmbiguity(EscalateJurisdictionAmbiguityRequest) returns (EscalateJurisdictionAmbiguityResponse);

  // Choice 5 (N11): Pre-Trip Readiness and Packing
  rpc GetPreTripReadinessOverview(GetPreTripReadinessOverviewRequest) returns (GetPreTripReadinessOverviewResponse);
  rpc UpsertPreTripChecklist(UpsertPreTripChecklistRequest) returns (UpsertPreTripChecklistResponse);
  rpc CompletePackingOrHomeTask(CompletePackingOrHomeTaskRequest) returns (CompletePackingOrHomeTaskResponse);

  // Choice 6 (N7/N13): Door-to-Door and Airport Operations
  rpc GetDoorToDoorAirportOverview(GetDoorToDoorAirportOverviewRequest) returns (GetDoorToDoorAirportOverviewResponse);
  rpc SaveDoorToDoorTimeline(SaveDoorToDoorTimelineRequest) returns (SaveDoorToDoorTimelineResponse);
  rpc IssueOrRevokePartnerGroundPass(IssueOrRevokePartnerGroundPassRequest) returns (IssueOrRevokePartnerGroundPassResponse);

  // Choice 7 (N5): Presence Evidence Packet
  rpc GetPresenceEvidencePacketOverview(GetPresenceEvidencePacketOverviewRequest) returns (GetPresenceEvidencePacketOverviewResponse);
  rpc SubmitPresenceEvidencePacket(SubmitPresenceEvidencePacketRequest) returns (SubmitPresenceEvidencePacketResponse);
  rpc FilePresenceVerificationAppeal(FilePresenceVerificationAppealRequest) returns (FilePresenceVerificationAppealResponse);

  // Choice 8 (N6): Residency and Corporate Travel Ledger
  rpc GetResidencyTravelLedgerOverview(GetResidencyTravelLedgerOverviewRequest) returns (GetResidencyTravelLedgerOverviewResponse);
  rpc UpsertResidencyDayLedger(UpsertResidencyDayLedgerRequest) returns (UpsertResidencyDayLedgerResponse);
  rpc RunRollingWindowForecast(RunRollingWindowForecastRequest) returns (RunRollingWindowForecastResponse);

  // Choice 9 (N8): Traveler, Family, and Assistant Collaboration
  rpc GetTravelerCollaborationOverview(GetTravelerCollaborationOverviewRequest) returns (GetTravelerCollaborationOverviewResponse);
  rpc GrantTripCollaborationRole(GrantTripCollaborationRoleRequest) returns (GrantTripCollaborationRoleResponse);
  rpc DispatchSafetyCheckinBroadcast(DispatchSafetyCheckinBroadcastRequest) returns (DispatchSafetyCheckinBroadcastResponse);

  // Choice 10 (N9): Loyalty, Fare, Claims, and Travel Finance
  rpc GetLoyaltyClaimsFinanceOverview(GetLoyaltyClaimsFinanceOverviewRequest) returns (GetLoyaltyClaimsFinanceOverviewResponse);
  rpc UpsertLoyaltyOrCompensationClaim(UpsertLoyaltyOrCompensationClaimRequest) returns (UpsertLoyaltyOrCompensationClaimResponse);
  rpc HandoffTripExpenseToVault(HandoffTripExpenseToVaultRequest) returns (HandoffTripExpenseToVaultResponse);

  // Choice 11 (N14/N15): Accessible Travel and Crisis Command
  rpc GetAccessibleCrisisCommandOverview(GetAccessibleCrisisCommandOverviewRequest) returns (GetAccessibleCrisisCommandOverviewResponse);
  rpc SubmitProviderAssistanceRequest(SubmitProviderAssistanceRequestRequest) returns (SubmitProviderAssistanceRequestResponse);
  rpc RecordCrisisWelfareCheckin(RecordCrisisWelfareCheckinRequest) returns (RecordCrisisWelfareCheckinResponse);

  // Choice 12 (N16): Destination Companion
  rpc GetDestinationCompanionOverview(GetDestinationCompanionOverviewRequest) returns (GetDestinationCompanionOverviewResponse);
  rpc SaveDestinationDayPlan(SaveDestinationDayPlanRequest) returns (SaveDestinationDayPlanResponse);
  rpc LogForegroundProximityQuery(LogForegroundProximityQueryRequest) returns (LogForegroundProximityQueryResponse);

  // Choice 13 (N10): Private Passport and Mobility Proofs
  rpc GetPrivatePassportProofsOverview(GetPrivatePassportProofsOverviewRequest) returns (GetPrivatePassportProofsOverviewResponse);
  rpc MintSignedMobilityDossier(MintSignedMobilityDossierRequest) returns (MintSignedMobilityDossierResponse);
  rpc UpdateFieldPrivacyPolicy(UpdateFieldPrivacyPolicyRequest) returns (UpdateFieldPrivacyPolicyResponse);

  // Choice 14 (N17): Trip Closure and Long-Term Memory
  rpc GetTripClosureMemoryOverview(GetTripClosureMemoryOverviewRequest) returns (GetTripClosureMemoryOverviewResponse);
  rpc ExecuteTripClosureStep(ExecuteTripClosureStepRequest) returns (ExecuteTripClosureStepResponse);
  rpc ArchiveTripMemoryRecord(ArchiveTripMemoryRecordRequest) returns (ArchiveTripMemoryRecordResponse);
}


// === Nomad Anthology (N3) ===

message AnthologyArticle {
  string id = 1;
  string slug = 2;
  string title = 3;
  string dek = 4; // standfirst
  string author = 5;
  string author_title = 6;
  string city = 7;
  string country_code = 8;
  string hero_url = 9;
  string body = 10; // paragraphs split on \n\n
  bool sovereign_only = 11;
  int64 published_at = 12;
  int32 read_minutes = 13;
}

message ListAnthologyArticlesRequest {
  string city = 1; // empty = all
}
message ListAnthologyArticlesResponse {
  repeated AnthologyArticle articles = 1;
}

message GetAnthologyArticleRequest {
  string slug = 1;
}
message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// === Passport share (N3.5) ===

message PassportShare {
  string token = 1;
  string url = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
  bool revoked = 5;
}

message CreatePassportShareRequest {
  int32 ttl_days = 1; // 0 => default 14
}
message CreatePassportShareResponse {
  PassportShare share = 1;
}

message ListMyPassportSharesRequest {}
message ListMyPassportSharesResponse {
  repeated PassportShare shares = 1;
}

message RevokePassportShareRequest {
  string token = 1;
}
message RevokePassportShareResponse {}

// === Annual Atlas (N4) ===

message GenerateNomadAtlasRequest {
  int32 year = 1; // 0 => current year
}
message GenerateNomadAtlasResponse {
  string media_url = 1;
  string media_asset_id = 2;
  int32 page_count = 3;
}

// === Itinerary ingestion (N2) ===
//
// A ParsedItinerary is the structured result of running a flight
// confirmation (pasted email text / boarding-pass scan) through the
// parser. It is a *proposal*: the member confirms it into a real Trip.

message ParsedItinerary {
  string id = 1;
  string trip_id = 2; // empty until confirmed
  string provider = 3; // e.g. 'United', 'Air France'
  string record_locator = 4; // PNR
  string origin_iata = 5;
  string destination_iata = 6;
  int64 depart_at = 7;
  int64 arrive_at = 8;
  string status = 9; // 'pending' | 'confirmed'
  string raw_excerpt = 10;
  int64 created_at = 11;
}

message ParseItineraryTextRequest {
  string raw_text = 1; // pasted confirmation email
}
message ParseItineraryTextResponse {
  ParsedItinerary itinerary = 1;
  bool parsed = 2; // false when no flight fields could be extracted
}

message ListMyItinerariesRequest {
  int32 limit = 1;
}
message ListMyItinerariesResponse {
  repeated ParsedItinerary itineraries = 1;
}

message ConfirmItineraryRequest {
  string itinerary_id = 1;
  string title = 2; // optional override; defaults to a route title
}
message ConfirmItineraryResponse {
  Trip trip = 1;
}

// === Partner directory (N2) ===

message TravelPartner {
  string id = 1;
  string slug = 2;
  string name = 3;
  string category = 4; // 'hotel' | 'restaurant' | 'lounge' | 'aviation' | 'driver'
  string city = 5;
  string country_code = 6;
  string region = 7; // 'Europe' | 'Asia' | ...
  string description = 8;
  string hero_url = 9;
  bool member_rate = 10; // Sttattus Tax / member discount available
  bool sovereign_only = 11;
  string booking_url = 12;
  int32 price_band = 13; // 1-4 ($-$$$$)
}

message ListTravelPartnersRequest {
  string category = 1; // empty = all
  string region = 2; // empty = all
}
message ListTravelPartnersResponse {
  repeated TravelPartner partners = 1;
}

message GetTravelPartnerRequest {
  string slug = 1;
}
message GetTravelPartnerResponse {
  TravelPartner partner = 1;
}

message GetPassportSurfaceRequest {}
message GetPassportSurfaceResponse {
  repeated VisitedCountry countries = 1;
  repeated VerificationSignals all_signals = 2;
  int32 total_stamps = 3;
}

message LoungeDetail {
  string id = 1;
  string name = 2;
  string city = 3;
  string location_description = 4;
  // How busy this lounge usually is: 'Quiet', 'Moderate', 'Busy'.
  //
  // EDITORIAL, NOT LIVE. It is a constant in the curated lounge table and
  // does not change with the hour. The field name says "live" and the app
  // said "LIVE CAPACITY" above it, which promised an occupancy feed that has
  // never existed. Renaming the field would break clients; the comment and
  // the label are the honest fix until something actually measures this.
  string live_capacity_status = 5;
  repeated string amenities = 6;
  string current_menu_url = 7;
}

message GetLoungeConciergeRequest {
  double latitude = 1;
  double longitude = 2;
}
message GetLoungeConciergeResponse {
  LoungeDetail nearest_lounge = 1;
  repeated LoungeDetail other_lounges = 2;
}

message TripArchiveEntry {
  Trip trip = 1;
  double avg_hrv = 2; // from Apex
  int32 total_workouts = 3; // from Forge
  double total_spend = 4; // from Vault
}

message GetTripArchiveRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message GetTripArchiveResponse {
  repeated TripArchiveEntry entries = 1;
  sttattus.common.v1.PageResponse page = 2;
}

// === Nomad Opportunity Choices 1-14 Messages ===

message TripGraphSegmentItem {
  string id = 1;
  string item_code = 2;
  string title = 3;
  string status = 4;
  string primary_detail = 5;
  string secondary_detail = 6;
  string governance_notice = 7;
  bool no_duplicate_segments_enforced = 8;
  string updated_at = 9;
}

message GetUniversalTripGraphOverviewRequest {
  string filter_status = 1;
}

message GetUniversalTripGraphOverviewResponse {
  repeated TripGraphSegmentItem items = 1;
  string active_policy_version = 2;
  bool no_duplicate_segments_enforced = 3;
  string governance_summary = 4;
}

message UpsertTripGraphSegmentRequest {
  string item_code = 1;
  string title = 2;
  string primary_detail = 3;
  string secondary_detail = 4;
}

message UpsertTripGraphSegmentResponse {
