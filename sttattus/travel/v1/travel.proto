message GetOfflineTripPackOverviewRequest {
  string filter_status = 1;
}

message GetOfflineTripPackOverviewResponse {
  repeated OfflineTripPackItem items = 1;
  string active_policy_version = 2;
  bool hardware_key_isolation_enforced = 3;
  string governance_summary = 4;
}

message StageOfflineTripPackRequest {
  string item_code = 1;
  string title = 2;
  string primary_detail = 3;
  string secondary_detail = 4;
}

message StageOfflineTripPackResponse {
  OfflineTripPackItem item = 1;
}

message SyncOfflineMutationReceiptRequest {
  string item_id = 1;
  string action_kind = 2;
  string operator_note = 3;
}

message SyncOfflineMutationReceiptResponse {
  OfflineTripPackItem item = 1;
}

message EntryReadinessRuleItem {
