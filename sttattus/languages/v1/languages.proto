syntax = "proto3";

package sttattus.languages.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/languages/v1;languagesv1";

// CulturalCategory defines the elite domain of knowledge.
enum CulturalCategory {
  CULTURAL_CATEGORY_UNSPECIFIED = 0;
  CULTURAL_CATEGORY_DIPLOMACY = 1; // International relations, etiquette
  CULTURAL_CATEGORY_LUXURY_ASSETS = 2; // Art, Watches, Real Estate
  CULTURAL_CATEGORY_GASTRONOMY = 3; // Wine, Fine Dining
  CULTURAL_CATEGORY_PHILANTHROPY = 4; // Foundations, Social Impact
}

// CulturalNuance represents a specific rule of social grace or etiquette.
message CulturalNuance {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 status_weight = 4; // How much this impacts Cultural Capital
}

// Scenario represents a "Social Blueprint" interaction.
message Scenario {
  string id = 1;
  string title = 2;
  string context_description = 3;
  CulturalCategory category = 4;
  string locale = 5; // e.g., 'fr', 'jp'
  repeated DialogueNode nodes = 6;
  double min_sttattus_score = 7; // Gating requirement

  // The study language. `locale` was the only marker and nothing filtered on
  // it, so a member studying French was offered Spanish dialogue.
  string language = 8;
  string cefr_level = 9;
  // What the member is being tested on, shown before they begin. "Read the
  // room" is the exercise; hiding the objective makes it a guessing game.
  string objective = 10;
}

// DialogueNode is a single step in a social interaction script.
message DialogueNode {
  string id = 1;
  string speaker = 2;
  string content = 3; // The specific linguistic phrasing
  string literal_translation = 4;
  string cultural_insight = 5; // Explanation of WHY this phrasing is high-status
  repeated DialogueOption options = 6;

  // A terminal node: the conversation is over. A scenario that always resolves
  // the same way regardless of the path is not a simulation, so endings are
  // graded — 'strong' | 'adequate' | 'poor' — and carry a debrief saying what
  // the member's choices won or cost.
  bool is_ending = 7;
  string ending_quality = 8;
  string debrief = 9;
}

message DialogueOption {
  string id = 1;
  string content = 2;
  bool is_optimal = 3; // The "Socially Gracious" path
  int32 grace_bonus = 4;

  // Where the conversation goes if this is chosen. Empty means fall through to
  // the next node in order, which is what every scenario did before branching
  // existed — the client walked nodes[i] and incremented i, so every choice led
  // to the same next line.
  string next_node_id = 5;
  // What the other party does in response, shown before the explanation, so a
  // misstep is felt rather than merely described.
  string outcome = 6;
  // What this choice signalled. `is_optimal` says whether it was right; this
  // says how it read.
  string note = 7;
}

message Progress {
  string user_id = 1;
  string scenario_id = 2;
  int32 mastery_level = 3; // 1-100
  int32 cultural_capital_gain = 4;
  google.protobuf.Timestamp last_refined_at = 5;
}

message LinguistStats {
  string user_id = 1;
  int32 eloquence = 2; // Vocabulary & Precision
  int32 social_grace = 3; // Interaction & Etiquette
  int32 cultural_capital = 4; // Aggregated "Soft Status"
  string mastery_rank = 5; // e.g., 'Diplomat', 'Sovereign Orator'
}

// REQ/RES
message ListScenariosRequest {
  CulturalCategory category = 1;
  sttattus.common.v1.PageRequest page = 2;
  // Restrict to one study language. Empty returns every language, which is
  // what the handler did unconditionally before.
  string language = 3;
}
message ListScenariosResponse {
  repeated Scenario scenarios = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message CompleteInteractionRequest {
  string scenario_id = 1;
  int32 total_grace_earned = 2;
  bool completed_optimally = 3;
  int32 response_time_ms = 4;
}
message CompleteInteractionResponse {
  Progress progress = 1;
  LinguistStats stats = 2;
}

message GetLinguistStatsRequest {}
message GetLinguistStatsResponse {
  LinguistStats stats = 1;
}

// === L12.7 — cultural modules ===

message CulturalModule {
  string id = 1;
  string language = 2;
  string slug = 3;
  string title = 4;
  string category = 5;
  string summary = 6;
  string body_markdown = 7;
  string insight = 8;
  int32 duration_minutes = 9;
  string min_cefr = 10;
  bool completed = 11;

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 12;
  string content_unit_id = 13;
  int32 content_revision = 14;
  bool pilot = 15;
}

message ListCulturalModulesRequest {
  string language = 1;
}
message ListCulturalModulesResponse {
  repeated CulturalModule modules = 1;
}

message MarkCulturalCompletedRequest {
  string module_id = 1;
}
message MarkCulturalCompletedResponse {
  CulturalModule module = 1;
}

// === L12.6 — multilingual ===

message UserLanguage {
  string language = 1;
  bool is_primary = 2;
  int64 added_unix = 3;
}

message ListMyLanguagesRequest {}
message ListMyLanguagesResponse {
  repeated UserLanguage languages = 1;
}

message AddMyLanguageRequest {
  string language = 1;
  bool is_primary = 2; // when true, demotes any existing primary
}
message AddMyLanguageResponse {
  UserLanguage language = 1;
}

message RemoveMyLanguageRequest {
  string language = 1;
}
message RemoveMyLanguageResponse {}

message SetMyPrimaryLanguageRequest {
  string language = 1;
}
message SetMyPrimaryLanguageResponse {
  UserLanguage language = 1;
}

// === L12.4 — speaking drill + Whisper pronunciation ===

message SpeakingPrompt {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string phrase = 4;
  string translation = 5;

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 6;
  string content_unit_id = 7;
  int32 content_revision = 8;
  bool pilot = 9;
}

message PhonemeScore {
  string token = 1;
  int32 score = 2; // 0..100
  // What went wrong with this word, in one short phrase. Empty when the word
  // was fine, or when no coach was available to say.
  string note = 3;
}

// SpeakingAttempt is the per-user row hydrated for the drill UI.
// status: 'pending' = scorer not yet run, 'transcribed' = Whisper
// + overlap complete, 'unavailable' = provider missing — client
// renders "transcription unavailable, audio preserved".
message SpeakingAttempt {
  string id = 1;
  string prompt_id = 2;
  string audio_url = 3;
  string status = 4;
  string transcribed = 5;
  int32 score = 6;
  repeated PhonemeScore phonemes = 7;
  int64 created_unix = 8;
  int64 updated_unix = 9;
  // A coaching sentence about the attempt as a whole. A percentage tells a
  // member they were wrong; this tells them what to change.
  string feedback = 10;
  // How the score was arrived at: 'coach' when a language model listened to
  // the transcript and judged it, 'overlap' when it fell back to counting
  // which target words survived transcription. The member is not told a
  // word-count is pronunciation feedback.
  string scored_by = 11;
}

message ListSpeakingPromptsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListSpeakingPromptsResponse {
  repeated SpeakingPrompt prompts = 1;
}

message CreateSpeakingAttemptRequest {
  string prompt_id = 1;
  string audio_url = 2; // R2 key returned from the presign-PUT upload
}
message CreateSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

message GetSpeakingAttemptRequest {
  string attempt_id = 1;
}
message GetSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

// === L12.3 — immersion player ===

// ImmersionClip = one piece of native-context audio with transcript.
// audio_url is empty until R2 ingestion lands — clients render the
// transcript today and surface "audio coming soon" honestly.
message ImmersionClip {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string description = 5;
  string transcript = 6;
  string translation = 7;
  string audio_url = 8;
  int32 duration_seconds = 9;
  string source_note = 10;
  bool completed = 11; // per-user, populated by ListTodayImmersion

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 12;
  string content_unit_id = 13;
  int32 content_revision = 14;
  bool pilot = 15;
}

message ListTodayImmersionRequest {
  string language = 1;
  string cefr_level = 2; // e.g. 'A2'
}
message ListTodayImmersionResponse {
  repeated ImmersionClip clips = 1;
}

message MarkImmersionCompletedRequest {
  string clip_id = 1;
}
message MarkImmersionCompletedResponse {
  ImmersionClip clip = 1;
}

// === L12.2 — today's plan ===

// DailyPlan = the three blocks of today for one (user, language).
// done_unix == 0 means "not yet done"; a non-zero value is the
// stamp from the backend.
message DailyPlan {
  string language = 1;
  string plan_date = 2; // ISO YYYY-MM-DD
  int64 warmup_done_unix = 3;
  int64 immersion_done_unix = 4;
  int64 output_done_unix = 5;

  // L12.2 block bodies — the server picks a today-specific anchor
  // for each block. All three are optional; client renders the
  // fallback structural prompt when empty.
  string warmup_message = 6; // canned message for the warm-up block
  string immersion_clip_id = 7; // lexicon_immersion_clips row
  string immersion_clip_title = 8;
  string speaking_prompt_id = 9; // lexicon_speaking_prompts row
  string speaking_prompt_phrase = 10;

  // Real work done today, counted from answers actually given rather than
  // from a member ticking a box. The *_done_unix fields above are a claim;
  // these are evidence.
  int32 reviews_done = 11;
  int32 new_learned = 12;
  int32 review_target = 13;
  int32 new_target = 14;
}

message GetTodayPlanRequest {
  string language = 1;
}
message GetTodayPlanResponse {
  DailyPlan plan = 1;
}

message MarkPlanBlockRequest {
  string language = 1;
  string block = 2; // 'warmup' | 'immersion' | 'output'
}
message MarkPlanBlockResponse {
  DailyPlan plan = 1;
}

// === L12.1 — CEFR placement test ===

// PlacementQuestion is one multiple-choice question seeded in
// lexicon_placement_questions. Audio URL is empty for non-listening
// skills; clients skip questions whose audio_url is empty for the
// listening skill (the immersion player wires real audio in L12.3).
message PlacementQuestion {
  string id = 1;
  string language = 2;
  string skill = 3;
  string cefr_target = 4; // 'A1'..'C2'
  string prompt = 5;
  repeated string options = 6;
  string audio_url = 7;
}

// PlacementAnswer is one row sent back. selected_index < 0 means
// the user skipped the question.
message PlacementAnswer {
  string question_id = 1;
  int32 selected_index = 2;
}

message ListPlacementQuestionsRequest {
  string language = 1;
  string skill = 2;
}
message ListPlacementQuestionsResponse {
  repeated PlacementQuestion questions = 1;
}

message SubmitPlacementResultRequest {
  string language = 1;
  string skill = 2;
  repeated PlacementAnswer answers = 3;
}

message PlacementResult {
  string language = 1;
  string skill = 2;
  string cefr_level = 3;
  int32 raw_score = 4;
  int32 total = 5;
  string completed_at = 6;
}

message SubmitPlacementResultResponse {
  PlacementResult result = 1;
}

message ListMyPlacementResultsRequest {}
message ListMyPlacementResultsResponse {
  repeated PlacementResult results = 1;
}

// === L12.9 — writing drill + AI rough correction ===

message WritingPrompt {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string prompt = 5;
  int32 min_words = 6;
  int32 max_words = 7;

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 8;
  string content_unit_id = 9;
  int32 content_revision = 10;
  bool pilot = 11;
  // The task explained in the member's base language (the prompt itself is in
  // the target language). Empty when that copy does not exist yet.
  string prompt_translation = 12;
}

// RubricScore is one CEFR-aligned scoring dimension of a writing
// submission (task achievement / coherence / lexical range / accuracy).
message RubricScore {
  string dimension = 1;
  int32 score = 2; // 0..100
  string comment = 3;
}

// WritingSubmission status: 'corrected' = Gemini rough correction ran,
// 'heuristic' = provider unavailable so a deterministic local rubric was
// applied, 'pending' = not yet scored.
// One thing the member got wrong, named rather than merely corrected.
//
// A corrected paragraph with bold on the changes tells a member *what* to
// write next time. It does not tell them which rule they broke, and it cannot
// be practised. This can: `grammar_point_key` links the mistake to a point in
// the grammar corpus, and the engine schedules that point so the member's own
// errors become their review queue.
message WritingError {
  string original = 1; // the span as the member wrote it
  string correction = 2; // what it should have been
  // agreement | tense | mood | preposition | vocabulary | spelling |
  // word_order | register
  string kind = 3;
  string explanation = 4;
  // lexicon_grammar_points.key, when the mistake maps onto a point that is
  // actually taught. Empty when it does not.
  string grammar_point_key = 5;
  // Lexicon Choice 2. An AI-found error is a suspicion, not evidence: it
  // lowers nothing until a short check confirms it. "unverified" until then,
  // "confirmed" or "cleared" by the check, "dismissed" when the member says
  // it is not an error.
  string flag_state = 6;
}

message WritingSubmission {
  string id = 1;
  string prompt_id = 2;
  string language = 3;
  string content = 4;
  string status = 5;
  string corrected_markdown = 6;
  repeated RubricScore rubric = 7;
  int32 score = 8;
  int64 created_unix = 9;
  int64 updated_unix = 10;
  repeated WritingError errors = 11;
  // The single most useful thing to work on next, in one sentence.
  string next_step = 12;
  // Grammar points scheduled into the member's review queue as a result of
  // this piece. Named so the app can say what practice was added rather than
  // silently changing the queue.
  repeated string scheduled_points = 13;
}

message ListWritingPromptsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListWritingPromptsResponse {
  repeated WritingPrompt prompts = 1;
}

message SubmitWritingRequest {
  string prompt_id = 1;
  string content = 2;
}
message SubmitWritingResponse {
  WritingSubmission submission = 1;
}

message ListMyWritingSubmissionsRequest {
  string language = 1;
}
message ListMyWritingSubmissionsResponse {
  repeated WritingSubmission submissions = 1;
}

message GetWritingSubmissionRequest {
  string submission_id = 1;
}
message GetWritingSubmissionResponse {
  WritingSubmission submission = 1;
}

// === L12.10 — reading library (parallel text) ===

message ReadingText {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string summary = 5;
  string body = 6; // target language
  string translation = 7; // native-language parallel
  string source_note = 8;
  int32 word_count = 9;

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 10;
  string content_unit_id = 11;
  int32 content_revision = 12;
  bool pilot = 13;
}

message ListReadingTextsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListReadingTextsResponse {
  repeated ReadingText texts = 1;
}

message GetReadingTextRequest {
  string text_id = 1;
}
message GetReadingTextResponse {
  ReadingText text = 1;
}

// === L12.11 — idiom library ===

message Idiom {
  string id = 1;
  string language = 2;
  string phrase = 3;
  string literal = 4;
  string meaning = 5;
  string example = 6;
  string register = 7; // formal | informal | slang
  string note = 8;

  // Lexicon Choice 1: which governed content unit and revision this came
  // from, whether it is a pilot the member was invited to, and the language
  // its explanatory copy is actually in (the base language when that copy
  // exists; English otherwise, which the app says out loud).
  string copy_language = 9;
  string content_unit_id = 10;
  int32 content_revision = 11;
  bool pilot = 12;
}

message ListIdiomsRequest {
  string language = 1;
}
message ListIdiomsResponse {
  repeated Idiom idioms = 1;
}

// === L12.12 — tutor desk / concierge (Sovereign) ===

message TutorThread {
  string id = 1;
  string language = 2;
  string topic = 3;
  string status = 4; // open | answered | closed
  int64 created_unix = 5;
  int64 sla_due_unix = 6;
  repeated TutorMessage messages = 7;
}

message TutorMessage {
  string id = 1;
  // member | tutor | system. The dashboard writes "staff" for a human reply;
  // clients must treat that as "tutor" rather than showing the member a word
  // from our org chart.
  string sender = 2;
  string body = 3;
  int64 created_unix = 4;
  // The tutor who wrote it. Empty for member and system messages, and for
  // replies written before authorship was recorded.
  string author_name = 5;
}

message StartTutorThreadRequest {
  string language = 1;
  string topic = 2;
  string body = 3;
}
message StartTutorThreadResponse {
  TutorThread thread = 1;
}

message ListMyTutorThreadsRequest {}
message ListMyTutorThreadsResponse {
  repeated TutorThread threads = 1;
}

message GetTutorThreadRequest {
  string thread_id = 1;
}
message GetTutorThreadResponse {
  TutorThread thread = 1;
}

message PostTutorMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostTutorMessageResponse {
  TutorThread thread = 1;
}

// === L12.13 — editorial Anthology ===

message AnthologyArticle {
  string id = 1;
  string slug = 2;
  string language = 3;
  string title = 4;
  string author = 5;
  string author_title = 6;
  string dek = 7;
  string body_markdown = 8;
  bool sovereign_only = 9;
  int64 published_unix = 10;
}

message ListAnthologyArticlesRequest {
  string language = 1;
}
message ListAnthologyArticlesResponse {
  repeated AnthologyArticle articles = 1;
}

message GetAnthologyArticleRequest {
  string article_id = 1;
}
message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// === L12.14 — CEFR certificate issuance + verification ===

message Certificate {
  string id = 1;
  string token = 2; // public verification token
  string language = 3;
  string skill = 4;
  string cefr_level = 5;
  string holder_name = 6;
  int64 issued_unix = 7;
  string verify_url = 8;
}

// IssueCertificate mints a signed CEFR certificate from the user's best
// placement result for (language, skill). Rejects when no qualifying
// result exists.
message IssueCertificateRequest {
  string language = 1;
  string skill = 2;
}
message IssueCertificateResponse {
  Certificate certificate = 1;
}

message ListMyCertificatesRequest {}
message ListMyCertificatesResponse {
  repeated Certificate certificates = 1;
}

// === L12.15 — Annual Linguist Almanac (PDF) ===

message GenerateLinguistAlmanacRequest {}
message GenerateLinguistAlmanacResponse {
  string url = 1;
  int32 page_count = 2;
}

// === L12.16 — public Linguist profile share ===

message CreateLinguistShareRequest {}
message CreateLinguistShareResponse {
  string token = 1;
  string share_url = 2;
}

service LanguagesService {
  // The Protocol: Scenario-based learning
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);
  rpc CompleteInteraction(CompleteInteractionRequest) returns (CompleteInteractionResponse);

  // Status
  rpc GetLinguistStats(GetLinguistStatsRequest) returns (GetLinguistStatsResponse);

  // L12.1 — CEFR placement.
  rpc ListPlacementQuestions(ListPlacementQuestionsRequest) returns (ListPlacementQuestionsResponse);
  rpc SubmitPlacementResult(SubmitPlacementResultRequest) returns (SubmitPlacementResultResponse);
  rpc ListMyPlacementResults(ListMyPlacementResultsRequest) returns (ListMyPlacementResultsResponse);

  // L12.2 — today's plan (three-block daily).
  rpc GetTodayPlan(GetTodayPlanRequest) returns (GetTodayPlanResponse);
  rpc MarkPlanBlock(MarkPlanBlockRequest) returns (MarkPlanBlockResponse);

  // L12.3 — immersion player.
  rpc ListTodayImmersion(ListTodayImmersionRequest) returns (ListTodayImmersionResponse);
  rpc MarkImmersionCompleted(MarkImmersionCompletedRequest) returns (MarkImmersionCompletedResponse);

  // L12.4 — speaking drill + Whisper.
  rpc ListSpeakingPrompts(ListSpeakingPromptsRequest) returns (ListSpeakingPromptsResponse);
  rpc CreateSpeakingAttempt(CreateSpeakingAttemptRequest) returns (CreateSpeakingAttemptResponse);
  rpc GetSpeakingAttempt(GetSpeakingAttemptRequest) returns (GetSpeakingAttemptResponse);

  // L12.6 — multilingual.
  rpc ListMyLanguages(ListMyLanguagesRequest) returns (ListMyLanguagesResponse);
  rpc AddMyLanguage(AddMyLanguageRequest) returns (AddMyLanguageResponse);
  rpc RemoveMyLanguage(RemoveMyLanguageRequest) returns (RemoveMyLanguageResponse);
  rpc SetMyPrimaryLanguage(SetMyPrimaryLanguageRequest) returns (SetMyPrimaryLanguageResponse);

  // L12.7 — cultural modules.
  rpc ListCulturalModules(ListCulturalModulesRequest) returns (ListCulturalModulesResponse);
  rpc MarkCulturalCompleted(MarkCulturalCompletedRequest) returns (MarkCulturalCompletedResponse);

  // L12.9 — writing drill + AI rough correction.
  rpc ListWritingPrompts(ListWritingPromptsRequest) returns (ListWritingPromptsResponse);
  rpc SubmitWriting(SubmitWritingRequest) returns (SubmitWritingResponse);
  rpc ListMyWritingSubmissions(ListMyWritingSubmissionsRequest) returns (ListMyWritingSubmissionsResponse);
  rpc GetWritingSubmission(GetWritingSubmissionRequest) returns (GetWritingSubmissionResponse);

  // L12.10 — reading library (parallel text).
  rpc ListReadingTexts(ListReadingTextsRequest) returns (ListReadingTextsResponse);
  rpc GetReadingText(GetReadingTextRequest) returns (GetReadingTextResponse);

  // L12.11 — idiom library.
  rpc ListIdioms(ListIdiomsRequest) returns (ListIdiomsResponse);

  // L12.12 — tutor desk / concierge (Sovereign).
  rpc StartTutorThread(StartTutorThreadRequest) returns (StartTutorThreadResponse);
  rpc ListMyTutorThreads(ListMyTutorThreadsRequest) returns (ListMyTutorThreadsResponse);
  rpc GetTutorThread(GetTutorThreadRequest) returns (GetTutorThreadResponse);
  rpc PostTutorMessage(PostTutorMessageRequest) returns (PostTutorMessageResponse);

  // L12.13 — editorial Anthology.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // L12.14 — CEFR certificate issuance.
  rpc IssueCertificate(IssueCertificateRequest) returns (IssueCertificateResponse);
  rpc ListMyCertificates(ListMyCertificatesRequest) returns (ListMyCertificatesResponse);

  // L12.15 — Annual Linguist Almanac.
  rpc GenerateLinguistAlmanac(GenerateLinguistAlmanacRequest) returns (GenerateLinguistAlmanacResponse);

  // L12.16 — public Linguist profile share.
  rpc CreateLinguistShare(CreateLinguistShareRequest) returns (CreateLinguistShareResponse);

  // L13 — the practice engine. Spaced repetition over a concept/lexeme corpus,
  // which is the learning loop the app was missing entirely: the Today plan's
  // three blocks were self-report checkboxes and lexicon_progress was never
  // read or written by anything.
  rpc GetPracticeSession(GetPracticeSessionRequest) returns (GetPracticeSessionResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc GetPracticeStats(GetPracticeStatsRequest) returns (GetPracticeStatsResponse);
  rpc GetMemberPrefs(GetMemberPrefsRequest) returns (GetMemberPrefsResponse);
  rpc SetMemberPrefs(SetMemberPrefsRequest) returns (SetMemberPrefsResponse);

  // Lexicon Choice 2 — the mastery graph and the adaptive Today plan. Every
  // plan item says why it is there, and a plan is reproducible from the
  // stored evidence it was built from.
  rpc GetAdaptivePlan(GetAdaptivePlanRequest) returns (GetAdaptivePlanResponse);
  rpc SkipPlanItem(SkipPlanItemRequest) returns (SkipPlanItemResponse);
  rpc GetMasteryMap(GetMasteryMapRequest) returns (GetMasteryMapResponse);
  rpc GetNodeEvidence(GetNodeEvidenceRequest) returns (GetNodeEvidenceResponse);
  rpc DismissWritingFlag(DismissWritingFlagRequest) returns (DismissWritingFlagResponse);

  // Legacy (Deprecated but kept for bridge)
  rpc ListWords(ListWordsRequest) returns (ListWordsResponse);
}

// ============================================================================
// L13 — practice engine
// ============================================================================

// Exercise escalates as an item strengthens: recognition first, production
// last. The same lexeme is drilled a different way each time it comes due.
enum ExerciseKind {
  EXERCISE_KIND_UNSPECIFIED = 0;
  EXERCISE_KIND_RECOGNISE = 1; // see target language, choose meaning
  EXERCISE_KIND_RECALL = 2; // see meaning, choose target language
  EXERCISE_KIND_LISTEN = 3; // hear it, choose meaning
  EXERCISE_KIND_CLOZE = 4; // fill the gap in a real sentence
  EXERCISE_KIND_TYPE = 5; // produce it from memory, typed
  EXERCISE_KIND_SPEAK = 6; // produce it aloud
  EXERCISE_KIND_CONJUGATE = 7; // give the requested cell of a verb paradigm
}

// What a schedulable item actually is. Vocabulary alone is not a language: a
// member who knows five hundred nouns and cannot conjugate `tener` cannot say
// anything. All three kinds share one queue and one scheduler.
enum StudyItemKind {
  STUDY_ITEM_KIND_UNSPECIFIED = 0;
  STUDY_ITEM_KIND_LEXEME = 1; // a word
  STUDY_ITEM_KIND_GRAMMAR = 2; // a grammar point's drill item
  STUDY_ITEM_KIND_VERB_FORM = 3; // one cell of a conjugation table
}

// Whether a practice session could introduce new material.
enum NewMaterialStatus {
  NEW_MATERIAL_STATUS_UNSPECIFIED = 0;
  // New items were offered (or none were due to be, within the daily budget).
  NEW_MATERIAL_STATUS_OPEN = 1;
  // No level of this course is available yet; reviews continue.
  NEW_MATERIAL_STATUS_PAUSED_IN_PREPARATION = 2;
  // The level the member reached is released but held while a gate is fixed.
  NEW_MATERIAL_STATUS_PAUSED_HELD = 3;
  // Every available item has been introduced; the next level is not open yet.
  NEW_MATERIAL_STATUS_LEVEL_EXHAUSTED = 4;
}

// One thing to answer. `prompt` is always written in the member's base
// language or the target, depending on kind; the client never has to decide.
message PracticeCard {
  string lexeme_id = 1;
  string concept_id = 2;
  ExerciseKind exercise = 3;
  // What the member is shown.
  string prompt = 4;
  // Supporting line under the prompt (a sentence, a gloss). May be empty.
  string prompt_detail = 5;
  // Multiple-choice options; empty for TYPE and SPEAK.
  repeated string options = 6;
  // Index into `options`. Sent so the client can grade instantly and show the
  // answer without a round trip; the server re-grades authoritatively on
  // SubmitAnswer and its verdict is the one that is recorded.
  int32 correct_index = 7;
  // The canonical written answer, revealed after the member answers.
  string answer = 8;
  string answer_detail = 9;
  string audio_url = 10;
  string ipa = 11;
  // SRS state, for the strength bar.
  int32 strength = 12;
  bool is_new = 13;
  string target_language = 14;
  string base_language = 15;
  // An item the member keeps losing. Flagged so the client can say why it
  // has come back rather than looking like it forgot they knew it.
  bool is_leech = 16;

  // Which kind of item this is, and its id. `lexeme_id` above stays populated
  // for vocabulary so an older client keeps working.
  StudyItemKind item_kind = 17;
  string item_id = 18;
  // Why the answer is the answer. A drill that marks you wrong and moves on
  // teaches you to guess, so grammar and conjugation cards carry the reason.
  string rationale = 19;
  // What is being practised: the grammar point's title, or the verb and the
  // cell being asked for ("tener - preterite").
  string point_title = 20;
  // True when this cell breaks the pattern its verb class would predict. A
  // regular cell is a rule; an irregular one is a fact to memorise.
  bool irregular = 21;

  // Lexicon Choice 1 — content lineage. The governed unit and revision this
  // card was built from; SubmitAnswer echoes them so the answer is recorded
  // against what the member actually saw.
  string content_unit_id = 22;
  int32 content_revision = 23;
  // Material being piloted with a cohort the member belongs to.
  bool pilot = 24;
  // The item changed since the member last answered it (a correction was
  // published), so the app can say so instead of looking inconsistent.
  bool corrected_since_seen = 25;
  // The language the prompt detail, rationale and point title are written
  // in. Equal to base_language unless that copy does not exist yet.
  string copy_language = 26;
  // Lexicon Choice 2: why this card is in the session now.
  PlanReason reason = 27;
  // Lexicon Choice 3: set on a retest card — the answer it follows up.
  string retest_of = 28;
}

message GetPracticeSessionRequest {
  // The language being learned.
  string language = 1;
  // How many cards to build. Server clamps to a sane range.
  int32 limit = 2;
  // Languages this device can actually speak, from the platform TTS voice
  // list. Listening exercises are only scheduled for a language named here
  // (or for an item with recorded audio): a listen card on a device with no
  // voice installed has no prompt at all and cannot be answered.
  repeated string tts_languages = 3;
  // Lexicon Choice 2: serve the cards of one item of today's plan (its nodes
  // and skill) instead of the general due queue.
  string plan_item_id = 4;
}
message GetPracticeSessionResponse {
  repeated PracticeCard cards = 1;
  int32 due_count = 2;
  int32 new_count = 3;
  // True when the corpus has nothing for this language, which is a content
  // gap and must not be dressed up as "you are all caught up".
  bool corpus_empty = 4;
  // Lexicon Choice 1 — whether this session could introduce new material,
  // and if not, why. Due reviews are always served.
  NewMaterialStatus new_material = 5;
}

message SubmitAnswerRequest {
  string lexeme_id = 1;
  ExerciseKind exercise = 2;
  string answer_given = 3;
  // Client-side grading is advisory; the server decides.
  bool client_correct = 4;
  int32 elapsed_ms = 5;
  string language = 6;
  // Present for grammar and conjugation items. When unset the request is
  // read as a vocabulary answer against lexeme_id, which is what the
  // already-deployed client sends.
  StudyItemKind item_kind = 7;
  string item_id = 8;
  // Lexicon Choice 1 — the unit and revision the card was built from.
  string content_unit_id = 9;
  int32 content_revision = 10;
  // Lexicon Choice 2. A client-generated id for this answer: a retry after a
  // dropped connection (or an offline replay) is recognised and not counted
  // twice.
  string client_event_id = 11;
  // The member asked for a hint before answering; a hinted success is weaker
  // evidence than an unaided one.
  bool hint_used = 12;
  // The plan item this answer was given for, when the session came from one.
  string plan_item_id = 13;
  // Lexicon Choice 3: this answers a retest card; the miss it follows up
  // (PracticeCard.retest_of).
  string retest_of = 14;
  // The learner produced the answer (typed, spoken, written by hand, built
  // from tiles) rather than choosing an offered option. It changes how a
  // miss is classified, never whether the answer is right.
  bool typed = 15;
}
message SubmitAnswerResponse {
  bool correct = 1;
  // The answer as it should have been given.
  string expected = 2;
  int32 strength = 3;
  // When this item comes back.
  google.protobuf.Timestamp due_at = 4;
  int32 reviews_done_today = 5;
  int32 new_learned_today = 6;
  // The explanation for this item, so the client can show it after an answer
  // without holding the card.
  string rationale = 7;
  // Lexicon Choice 2: this client_event_id had already been recorded; the
  // response describes the first recording and nothing was counted again.
  bool duplicate = 8;

  // Lexicon Choice 3 — the repair after a wrong answer. Empty when correct.
  // What kind of mistake it was (the grader's taxonomy).
  AnswerErrorKind error_kind = 9;
  // The answer as the server received it, and where it differs from the
  // expected one, run by run.
  string given = 10;
  repeated AnswerDiffSegment diff = 11;
  // Up to two real sentences using the word or point.
  repeated ExampleSentence examples = 12;
  // A short lesson on the word, point or verb.
  MicroLesson lesson = 13;
  // The same thing again in a new context, for the app to ask two cards
  // later. Its answer carries retest_of.
  PracticeCard retest = 14;
  // The grader that judged this answer (the error kind's rules).
  string grader_version = 15;
}

// Lexicon Choice 3 — the taxonomy of a wrong answer.
enum AnswerErrorKind {
  ANSWER_ERROR_KIND_UNSPECIFIED = 0;
  ANSWER_ERROR_KIND_SLIP = 1; // one letter off on something the learner knows
  ANSWER_ERROR_KIND_SPELLING = 2;
  ANSWER_ERROR_KIND_MORPHOLOGY = 3; // another form of the same word
  ANSWER_ERROR_KIND_AGREEMENT = 4; // gender or number
  ANSWER_ERROR_KIND_WORD_ORDER = 5;
  ANSWER_ERROR_KIND_LISTENING_DISCRIMINATION = 6; // a near-homophone, by ear
  ANSWER_ERROR_KIND_FALSE_FRIEND = 7;
  ANSWER_ERROR_KIND_REGISTER = 8; // formal / informal
  ANSWER_ERROR_KIND_PRONUNCIATION = 9;
  ANSWER_ERROR_KIND_CONCEPT_GAP = 10; // not known yet
}

enum AnswerDiffOp {
  ANSWER_DIFF_OP_UNSPECIFIED = 0;
  ANSWER_DIFF_OP_SAME = 1;
  ANSWER_DIFF_OP_MISSING = 2; // in the expected answer, not in the learner's
  ANSWER_DIFF_OP_EXTRA = 3; // in the learner's answer, not in the expected
}

message AnswerDiffSegment {
  AnswerDiffOp op = 1;
  string text = 2;
}

message ExampleSentence {
  string text = 1;
  // In the member's base language.
  string translation = 2;
  string audio_url = 3;
}

message MicroLesson {
  string title = 1;
  string body = 2;
  repeated ExampleSentence examples = 3;
  // Short lines to read together — a verb's persons in one tense.
  repeated string lines = 4;
}

message GetPracticeStatsRequest {
  string language = 1;
}
message GetPracticeStatsResponse {
  int32 due_now = 1;
  int32 learning = 2;
  int32 mastered = 3;
  int32 total_seen = 4;
  int32 corpus_size = 5;
  int32 reviews_today = 6;
  int32 new_today = 7;
  int32 streak_days = 8;
  // Per-kind corpus sizes. One number hides the case where a language has
  // vocabulary and no grammar at all.
  int32 corpus_vocabulary = 9;
  int32 corpus_grammar = 10;
  int32 corpus_verb_forms = 11;
}

message MemberPrefs {
  string base_language = 1;
  int32 daily_new_target = 2;
  int32 daily_review_target = 3;
  // Lexicon Choice 2 — how the member wants Today planned. On
  // SetMemberPrefs a field left out keeps its stored value (an older app
  // that only sends the base language must not reset these):
  // GOAL_MODE_UNSPECIFIED and daily_minutes 0 mean "unchanged", and the
  // optional fields are applied only when present. vacation_until "" clears it.
  GoalMode goal_mode = 4;
  // Time budget for Today, 5–90 minutes.
  int32 daily_minutes = 5;
  // The device's offset from UTC, so "today" is the member's day.
  optional int32 utc_offset_minutes = 6;
  // New material pauses until this date (YYYY-MM-DD, inclusive); empty = off.
  optional string vacation_until = 7;
  // Accessibility pacing: more time per item, and latency never counts
  // against an answer.
  optional bool extra_time = 8;
}
message GetMemberPrefsRequest {}
message GetMemberPrefsResponse {
  MemberPrefs prefs = 1;
}
message SetMemberPrefsRequest {
  MemberPrefs prefs = 1;
}
message SetMemberPrefsResponse {
  MemberPrefs prefs = 1;
}

// Deprecated Word-based messages (for transition)
message Word {
  string id = 1;
  string payload_json = 2;
}
message ListWordsRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListWordsResponse {
  repeated Word words = 1;
}

// ============================================================================
// Lexicon Choice 2 — mastery graph and adaptive Today
// ============================================================================

// What an observation is evidence of. The same word can be recognised long
// before it can be recalled, spelled, heard or said; each is tracked apart.
enum MasterySkill {
  MASTERY_SKILL_UNSPECIFIED = 0;
  MASTERY_SKILL_RECOGNITION = 1; // see it, know what it means
  MASTERY_SKILL_RECALL = 2; // produce it from its meaning
  MASTERY_SKILL_SPELLING = 3; // write it exactly, accents included
  MASTERY_SKILL_LISTENING = 4; // hear it, know what it means
  MASTERY_SKILL_PRONUNCIATION = 5; // say it so it is understood
  MASTERY_SKILL_PRODUCTION = 6; // use it in free speech
  MASTERY_SKILL_GRAMMAR = 7; // apply a grammar point in context
  MASTERY_SKILL_CONJUGATION = 8; // produce the right verb form
  MASTERY_SKILL_READING = 9;
  MASTERY_SKILL_WRITING = 10;
  MASTERY_SKILL_CONVERSATION = 11;
}

// What the member is learning for. It changes the mix of Today, never what
// counts as knowing something.
enum GoalMode {
  GOAL_MODE_UNSPECIFIED = 0;
  GOAL_MODE_BALANCED = 1;
  GOAL_MODE_TRAVEL = 2;
  GOAL_MODE_FAMILY = 3;
  GOAL_MODE_ACADEMIC = 4;
  GOAL_MODE_RELOCATION = 5;
  GOAL_MODE_EXAM = 6;
  GOAL_MODE_BUSINESS = 7;
  GOAL_MODE_PRONUNCIATION = 8;
  GOAL_MODE_MAINTENANCE = 9;
}

enum PlanItemKind {
  PLAN_ITEM_KIND_UNSPECIFIED = 0;
  PLAN_ITEM_KIND_REVIEW = 1; // due retrieval
  PLAN_ITEM_KIND_NEW = 2; // new material from an open level
  PLAN_ITEM_KIND_REPAIR = 3; // a leech, a weak skill or a prerequisite
  PLAN_ITEM_KIND_CONTRAST = 4; // two items the member confuses, side by side
  PLAN_ITEM_KIND_CHECK = 5; // a short check of an AI-suspected error
  PLAN_ITEM_KIND_LISTENING = 6; // listening drill on known words
  PLAN_ITEM_KIND_SPEAKING = 7; // a speaking prompt
  PLAN_ITEM_KIND_READING = 8; // a graded reading text
  PLAN_ITEM_KIND_WRITING = 9; // a writing prompt
}

enum PlanItemState {
  PLAN_ITEM_STATE_UNSPECIFIED = 0;
  PLAN_ITEM_STATE_PENDING = 1;
  PLAN_ITEM_STATE_DONE = 2; // completed by evidence, never by a tap
  PLAN_ITEM_STATE_SKIPPED = 3; // "not today"; can be restored
}

enum PlanReasonCode {
  PLAN_REASON_CODE_UNSPECIFIED = 0;
  PLAN_REASON_CODE_DUE = 1; // predicted recall fell below the threshold
  PLAN_REASON_CODE_LEECH = 2; // lost again and again
  PLAN_REASON_CODE_WEAK_SKILL = 3; // a skill well below the member's others
  PLAN_REASON_CODE_INTERFERENCE = 4; // two items confused with each other
  PLAN_REASON_CODE_PREREQUISITE = 5; // needed by something else in the plan
  PLAN_REASON_CODE_CHECK_AI_FLAG = 6; // the writing coach suspected an error
  PLAN_REASON_CODE_NEW = 7; // next material in an open level
  PLAN_REASON_CODE_CATCH_UP = 8; // back after missed days
  PLAN_REASON_CODE_GOAL = 9; // the goal mode asks for this skill
  PLAN_REASON_CODE_RETEST = 10; // Choice 3: missed a moment ago, again another way
}

// Why something is in the plan. `params` carries the numbers behind the
// sentence (skill, estimate, lapses, the two confused items, days missed…) so
// the app can say it in the member's language; evidence_count is how many
// observations the claim rests on.
message PlanReason {
  PlanReasonCode code = 1;
  map<string, string> params = 2;
  int32 evidence_count = 3;
}

message PlanItem {
  string id = 1;
  PlanItemKind kind = 2;
  MasterySkill skill = 3;
  // What the item covers, as the member would name it (words, a grammar
  // point's title, a prompt).
  repeated string labels = 4;
  int32 estimated_minutes = 5;
  PlanItemState state = 6;
  PlanReason reason = 7;
  // Answers (or one attempt/completion) needed, and how many are done.
  int32 target_count = 8;
  int32 done_count = 9;
  // For speaking/reading/writing items: the activity to open.
  string activity_id = 10;
  string activity_title = 11;
}

message AdaptivePlan {
  string revision_id = 1;
  string language = 2;
  string plan_date = 3; // the member's local date, YYYY-MM-DD
  int32 revision = 4;
  string policy_version = 5;
  GoalMode goal_mode = 6;
  int32 budget_minutes = 7;
  int32 estimated_minutes = 8;
  repeated PlanItem items = 9;
  // Back after a gap: how many days were missed and how many at-risk items
  // were spread over the coming days instead of all landing today.
  int32 missed_days = 10;
  int32 deferred_count = 11;
  bool vacation = 12;
  // What the plan was built from; the same inputs rebuild the same plan.
  string inputs_digest = 13;
  int64 generated_unix = 14;
  NewMaterialStatus new_material = 15;
}

message GetAdaptivePlanRequest {
  string language = 1;
  int32 utc_offset_minutes = 2;
  // Build a new revision now (after settings change or new evidence) instead
  // of returning today's current one.
  bool regenerate = 3;
}
message GetAdaptivePlanResponse {
  AdaptivePlan plan = 1;
}

message SkipPlanItemRequest {
  string language = 1;
  string plan_item_id = 2;
  bool restore = 3;
}
message SkipPlanItemResponse {
  AdaptivePlan plan = 1;
}

// One estimate, with how sure it is. `estimate`, `low` and `high` are 0–100.
message SkillEstimate {
  MasterySkill skill = 1;
  int32 estimate = 2;
  int32 low = 3;
  int32 high = 4;
  int32 evidence_count = 5;
  // Things observed in this skill, out of what the open levels contain.
  int32 nodes_observed = 6;
  int32 nodes_open = 7;
}

message LevelProgress {
  string cefr_level = 1;
  int32 nodes_open = 2;
  int32 nodes_seen = 3;
  int32 nodes_strong = 4;
}

message NodeEstimate {
  string node_kind = 1; // concept | grammar_point | verb
  string node_id = 2;
  string label = 3;
  MasterySkill skill = 4;
  int32 estimate = 5;
  int32 low = 6;
  int32 high = 7;
  int32 evidence_count = 8;
  double half_life_days = 9;
  int64 last_observed_unix = 10;
  // Predicted recall right now, after forgetting.
  int32 recall_now = 11;
}

message ConfusionPair {
  string a_label = 1;
  string b_label = 2;
  int32 count = 3;
}

message GetMasteryMapRequest {
  string language = 1;
}
message GetMasteryMapResponse {
  repeated SkillEstimate skills = 1;
  repeated LevelProgress levels = 2;
  repeated NodeEstimate weakest = 3;
  repeated ConfusionPair confusions = 4;
  // One-off placement tests, shown apart from practice evidence.
  repeated PlacementResult placement = 5;
  int32 evidence_total = 6;
  string policy_version = 7;
}

message EvidenceEntry {
  MasterySkill skill = 1;
  int32 credit = 2; // 0–100
  string source = 3; // practice | writing_coach | speaking_coach | placement | scenario
  string trust = 4; // verified | self_report | ai_unverified | disputed | withdrawn
  bool hint_used = 5;
  string exercise = 6;
  int64 observed_unix = 7;
}

message GetNodeEvidenceRequest {
  string language = 1;
  string node_kind = 2;
  string node_id = 3;
}
message GetNodeEvidenceResponse {
  repeated NodeEstimate estimates = 1;
  repeated EvidenceEntry evidence = 2;
}

message DismissWritingFlagRequest {
  string submission_id = 1;
  int32 error_index = 2;
  // false restores a dismissed flag.
  bool dismiss = 3;
}
message DismissWritingFlagResponse {
  WritingSubmission submission = 1;
}
