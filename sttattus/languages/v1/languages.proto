syntax = "proto3";

package sttattus.languages.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/languages/v1;languagesv1";

// CulturalCategory defines the elite domain of knowledge.
enum CulturalCategory {
  CULTURAL_CATEGORY_UNSPECIFIED = 0;
  CULTURAL_CATEGORY_DIPLOMACY = 1; // International relations, etiquette
  CULTURAL_CATEGORY_LUXURY_ASSETS = 2; // Art, Watches, Real Estate
  CULTURAL_CATEGORY_GASTRONOMY = 3; // Wine, Fine Dining
  CULTURAL_CATEGORY_PHILANTHROPY = 4; // Foundations, Social Impact
}

// CulturalNuance represents a specific rule of social grace or etiquette.
message CulturalNuance {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 status_weight = 4; // How much this impacts Cultural Capital
}

// Scenario represents a "Social Blueprint" interaction.
message Scenario {
  string id = 1;
  string title = 2;
  string context_description = 3;
  CulturalCategory category = 4;
  string locale = 5; // e.g., 'fr', 'jp'
  repeated DialogueNode nodes = 6;
  double min_sttattus_score = 7; // Gating requirement
}

// DialogueNode is a single step in a social interaction script.
message DialogueNode {
  string id = 1;
  string speaker = 2;
  string content = 3; // The specific linguistic phrasing
  string literal_translation = 4;
  string cultural_insight = 5; // Explanation of WHY this phrasing is high-status
  repeated DialogueOption options = 6;
}

message DialogueOption {
  string id = 1;
  string content = 2;
  bool is_optimal = 3; // The "Socially Gracious" path
  int32 grace_bonus = 4;
}

message Progress {
  string user_id = 1;
  string scenario_id = 2;
  int32 mastery_level = 3; // 1-100
  int32 cultural_capital_gain = 4;
  google.protobuf.Timestamp last_refined_at = 5;
}

message LinguistStats {
  string user_id = 1;
  int32 eloquence = 2; // Vocabulary & Precision
  int32 social_grace = 3; // Interaction & Etiquette
  int32 cultural_capital = 4; // Aggregated "Soft Status"
  string mastery_rank = 5; // e.g., 'Diplomat', 'Sovereign Orator'
}

// REQ/RES
message ListScenariosRequest {
  CulturalCategory category = 1;
  sttattus.common.v1.PageRequest page = 2;
}
message ListScenariosResponse {
  repeated Scenario scenarios = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message CompleteInteractionRequest {
  string scenario_id = 1;
  int32 total_grace_earned = 2;
  bool completed_optimally = 3;
  int32 response_time_ms = 4;
}
message CompleteInteractionResponse {
  Progress progress = 1;
  LinguistStats stats = 2;
}

message GetLinguistStatsRequest {}
message GetLinguistStatsResponse {
  LinguistStats stats = 1;
}

// === L12.7 — cultural modules ===

message CulturalModule {
  string id = 1;
  string language = 2;
  string slug = 3;
  string title = 4;
  string category = 5;
  string summary = 6;
  string body_markdown = 7;
  string insight = 8;
  int32 duration_minutes = 9;
  string min_cefr = 10;
  bool completed = 11;
}

message ListCulturalModulesRequest {
  string language = 1;
}
message ListCulturalModulesResponse {
  repeated CulturalModule modules = 1;
}

message MarkCulturalCompletedRequest {
  string module_id = 1;
}
message MarkCulturalCompletedResponse {
  CulturalModule module = 1;
}

// === L12.6 — multilingual ===

message UserLanguage {
  string language = 1;
  bool is_primary = 2;
  int64 added_unix = 3;
}

message ListMyLanguagesRequest {}
message ListMyLanguagesResponse {
  repeated UserLanguage languages = 1;
}

message AddMyLanguageRequest {
  string language = 1;
  bool is_primary = 2; // when true, demotes any existing primary
}
message AddMyLanguageResponse {
  UserLanguage language = 1;
}

message RemoveMyLanguageRequest {
  string language = 1;
}
message RemoveMyLanguageResponse {}

message SetMyPrimaryLanguageRequest {
  string language = 1;
}
message SetMyPrimaryLanguageResponse {
  UserLanguage language = 1;
}

// === L12.4 — speaking drill + Whisper pronunciation ===

message SpeakingPrompt {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string phrase = 4;
  string translation = 5;
}

message PhonemeScore {
  string token = 1;
  int32 score = 2; // 0..100
}

// SpeakingAttempt is the per-user row hydrated for the drill UI.
// status: 'pending' = scorer not yet run, 'transcribed' = Whisper
// + overlap complete, 'unavailable' = provider missing — client
// renders "transcription unavailable, audio preserved".
message SpeakingAttempt {
  string id = 1;
  string prompt_id = 2;
  string audio_url = 3;
  string status = 4;
  string transcribed = 5;
  int32 score = 6;
  repeated PhonemeScore phonemes = 7;
  int64 created_unix = 8;
  int64 updated_unix = 9;
}

message ListSpeakingPromptsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListSpeakingPromptsResponse {
  repeated SpeakingPrompt prompts = 1;
}

message CreateSpeakingAttemptRequest {
  string prompt_id = 1;
  string audio_url = 2; // R2 key returned from the presign-PUT upload
}
message CreateSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

message GetSpeakingAttemptRequest {
  string attempt_id = 1;
}
message GetSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

// === L12.3 — immersion player ===

// ImmersionClip = one piece of native-context audio with transcript.
// audio_url is empty until R2 ingestion lands — clients render the
// transcript today and surface "audio coming soon" honestly.
message ImmersionClip {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string description = 5;
  string transcript = 6;
  string translation = 7;
  string audio_url = 8;
  int32 duration_seconds = 9;
  string source_note = 10;
  bool completed = 11; // per-user, populated by ListTodayImmersion
}

message ListTodayImmersionRequest {
  string language = 1;
  string cefr_level = 2; // e.g. 'A2'
}
message ListTodayImmersionResponse {
  repeated ImmersionClip clips = 1;
}

message MarkImmersionCompletedRequest {
  string clip_id = 1;
}
message MarkImmersionCompletedResponse {
  ImmersionClip clip = 1;
}

// === L12.2 — today's plan ===

// DailyPlan = the three blocks of today for one (user, language).
// done_unix == 0 means "not yet done"; a non-zero value is the
// stamp from the backend.
message DailyPlan {
  string language = 1;
  string plan_date = 2; // ISO YYYY-MM-DD
  int64 warmup_done_unix = 3;
  int64 immersion_done_unix = 4;
  int64 output_done_unix = 5;
}

message GetTodayPlanRequest {
  string language = 1;
}
message GetTodayPlanResponse {
  DailyPlan plan = 1;
}

message MarkPlanBlockRequest {
  string language = 1;
  string block = 2; // 'warmup' | 'immersion' | 'output'
}
message MarkPlanBlockResponse {
  DailyPlan plan = 1;
}

// === L12.1 — CEFR placement test ===

// PlacementQuestion is one multiple-choice question seeded in
// lexicon_placement_questions. Audio URL is empty for non-listening
// skills; clients skip questions whose audio_url is empty for the
// listening skill (the immersion player wires real audio in L12.3).
message PlacementQuestion {
  string id = 1;
  string language = 2;
  string skill = 3;
  string cefr_target = 4; // 'A1'..'C2'
  string prompt = 5;
  repeated string options = 6;
  string audio_url = 7;
}

// PlacementAnswer is one row sent back. selected_index < 0 means
// the user skipped the question.
message PlacementAnswer {
  string question_id = 1;
  int32 selected_index = 2;
}

message ListPlacementQuestionsRequest {
  string language = 1;
  string skill = 2;
}
message ListPlacementQuestionsResponse {
  repeated PlacementQuestion questions = 1;
}

message SubmitPlacementResultRequest {
  string language = 1;
  string skill = 2;
  repeated PlacementAnswer answers = 3;
}

message PlacementResult {
  string language = 1;
  string skill = 2;
  string cefr_level = 3;
  int32 raw_score = 4;
  int32 total = 5;
  string completed_at = 6;
}

message SubmitPlacementResultResponse {
  PlacementResult result = 1;
}

message ListMyPlacementResultsRequest {}
message ListMyPlacementResultsResponse {
  repeated PlacementResult results = 1;
}

service LanguagesService {
  // The Protocol: Scenario-based learning
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);
  rpc CompleteInteraction(CompleteInteractionRequest) returns (CompleteInteractionResponse);

  // Status
  rpc GetLinguistStats(GetLinguistStatsRequest) returns (GetLinguistStatsResponse);

  // L12.1 — CEFR placement.
  rpc ListPlacementQuestions(ListPlacementQuestionsRequest) returns (ListPlacementQuestionsResponse);
  rpc SubmitPlacementResult(SubmitPlacementResultRequest) returns (SubmitPlacementResultResponse);
  rpc ListMyPlacementResults(ListMyPlacementResultsRequest) returns (ListMyPlacementResultsResponse);

  // L12.2 — today's plan (three-block daily).
  rpc GetTodayPlan(GetTodayPlanRequest) returns (GetTodayPlanResponse);
  rpc MarkPlanBlock(MarkPlanBlockRequest) returns (MarkPlanBlockResponse);

  // L12.3 — immersion player.
  rpc ListTodayImmersion(ListTodayImmersionRequest) returns (ListTodayImmersionResponse);
  rpc MarkImmersionCompleted(MarkImmersionCompletedRequest) returns (MarkImmersionCompletedResponse);

  // L12.4 — speaking drill + Whisper.
  rpc ListSpeakingPrompts(ListSpeakingPromptsRequest) returns (ListSpeakingPromptsResponse);
  rpc CreateSpeakingAttempt(CreateSpeakingAttemptRequest) returns (CreateSpeakingAttemptResponse);
  rpc GetSpeakingAttempt(GetSpeakingAttemptRequest) returns (GetSpeakingAttemptResponse);

  // L12.6 — multilingual.
  rpc ListMyLanguages(ListMyLanguagesRequest) returns (ListMyLanguagesResponse);
  rpc AddMyLanguage(AddMyLanguageRequest) returns (AddMyLanguageResponse);
  rpc RemoveMyLanguage(RemoveMyLanguageRequest) returns (RemoveMyLanguageResponse);
  rpc SetMyPrimaryLanguage(SetMyPrimaryLanguageRequest) returns (SetMyPrimaryLanguageResponse);

  // L12.7 — cultural modules.
  rpc ListCulturalModules(ListCulturalModulesRequest) returns (ListCulturalModulesResponse);
  rpc MarkCulturalCompleted(MarkCulturalCompletedRequest) returns (MarkCulturalCompletedResponse);

  // Legacy (Deprecated but kept for bridge)
  rpc ListWords(ListWordsRequest) returns (ListWordsResponse);
}

// Deprecated Word-based messages (for transition)
message Word {
  string id = 1;
  string payload_json = 2;
}
message ListWordsRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListWordsResponse {
  repeated Word words = 1;
}
