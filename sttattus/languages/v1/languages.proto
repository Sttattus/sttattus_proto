syntax = "proto3";

package sttattus.languages.v1;

import "google/protobuf/timestamp.proto";
import "sttattus/common/v1/pagination.proto";

option go_package = "github.com/sttattus/proto/gen/go/sttattus/languages/v1;languagesv1";

// CulturalCategory defines the elite domain of knowledge.
enum CulturalCategory {
  CULTURAL_CATEGORY_UNSPECIFIED = 0;
  CULTURAL_CATEGORY_DIPLOMACY = 1; // International relations, etiquette
  CULTURAL_CATEGORY_LUXURY_ASSETS = 2; // Art, Watches, Real Estate
  CULTURAL_CATEGORY_GASTRONOMY = 3; // Wine, Fine Dining
  CULTURAL_CATEGORY_PHILANTHROPY = 4; // Foundations, Social Impact
}

// CulturalNuance represents a specific rule of social grace or etiquette.
message CulturalNuance {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 status_weight = 4; // How much this impacts Cultural Capital
}

// Scenario represents a "Social Blueprint" interaction.
message Scenario {
  string id = 1;
  string title = 2;
  string context_description = 3;
  CulturalCategory category = 4;
  string locale = 5; // e.g., 'fr', 'jp'
  repeated DialogueNode nodes = 6;
  double min_sttattus_score = 7; // Gating requirement
}

// DialogueNode is a single step in a social interaction script.
message DialogueNode {
  string id = 1;
  string speaker = 2;
  string content = 3; // The specific linguistic phrasing
  string literal_translation = 4;
  string cultural_insight = 5; // Explanation of WHY this phrasing is high-status
  repeated DialogueOption options = 6;
}

message DialogueOption {
  string id = 1;
  string content = 2;
  bool is_optimal = 3; // The "Socially Gracious" path
  int32 grace_bonus = 4;
}

message Progress {
  string user_id = 1;
  string scenario_id = 2;
  int32 mastery_level = 3; // 1-100
  int32 cultural_capital_gain = 4;
  google.protobuf.Timestamp last_refined_at = 5;
}

message LinguistStats {
  string user_id = 1;
  int32 eloquence = 2; // Vocabulary & Precision
  int32 social_grace = 3; // Interaction & Etiquette
  int32 cultural_capital = 4; // Aggregated "Soft Status"
  string mastery_rank = 5; // e.g., 'Diplomat', 'Sovereign Orator'
}

// REQ/RES
message ListScenariosRequest {
  CulturalCategory category = 1;
  sttattus.common.v1.PageRequest page = 2;
}
message ListScenariosResponse {
  repeated Scenario scenarios = 1;
  sttattus.common.v1.PageResponse page = 2;
}

message CompleteInteractionRequest {
  string scenario_id = 1;
  int32 total_grace_earned = 2;
  bool completed_optimally = 3;
  int32 response_time_ms = 4;
}
message CompleteInteractionResponse {
  Progress progress = 1;
  LinguistStats stats = 2;
}

message GetLinguistStatsRequest {}
message GetLinguistStatsResponse {
  LinguistStats stats = 1;
}

// === L12.7 — cultural modules ===

message CulturalModule {
  string id = 1;
  string language = 2;
  string slug = 3;
  string title = 4;
  string category = 5;
  string summary = 6;
  string body_markdown = 7;
  string insight = 8;
  int32 duration_minutes = 9;
  string min_cefr = 10;
  bool completed = 11;
}

message ListCulturalModulesRequest {
  string language = 1;
}
message ListCulturalModulesResponse {
  repeated CulturalModule modules = 1;
}

message MarkCulturalCompletedRequest {
  string module_id = 1;
}
message MarkCulturalCompletedResponse {
  CulturalModule module = 1;
}

// === L12.6 — multilingual ===

message UserLanguage {
  string language = 1;
  bool is_primary = 2;
  int64 added_unix = 3;
}

message ListMyLanguagesRequest {}
message ListMyLanguagesResponse {
  repeated UserLanguage languages = 1;
}

message AddMyLanguageRequest {
  string language = 1;
  bool is_primary = 2; // when true, demotes any existing primary
}
message AddMyLanguageResponse {
  UserLanguage language = 1;
}

message RemoveMyLanguageRequest {
  string language = 1;
}
message RemoveMyLanguageResponse {}

message SetMyPrimaryLanguageRequest {
  string language = 1;
}
message SetMyPrimaryLanguageResponse {
  UserLanguage language = 1;
}

// === L12.4 — speaking drill + Whisper pronunciation ===

message SpeakingPrompt {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string phrase = 4;
  string translation = 5;
}

message PhonemeScore {
  string token = 1;
  int32 score = 2; // 0..100
}

// SpeakingAttempt is the per-user row hydrated for the drill UI.
// status: 'pending' = scorer not yet run, 'transcribed' = Whisper
// + overlap complete, 'unavailable' = provider missing — client
// renders "transcription unavailable, audio preserved".
message SpeakingAttempt {
  string id = 1;
  string prompt_id = 2;
  string audio_url = 3;
  string status = 4;
  string transcribed = 5;
  int32 score = 6;
  repeated PhonemeScore phonemes = 7;
  int64 created_unix = 8;
  int64 updated_unix = 9;
}

message ListSpeakingPromptsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListSpeakingPromptsResponse {
  repeated SpeakingPrompt prompts = 1;
}

message CreateSpeakingAttemptRequest {
  string prompt_id = 1;
  string audio_url = 2; // R2 key returned from the presign-PUT upload
}
message CreateSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

message GetSpeakingAttemptRequest {
  string attempt_id = 1;
}
message GetSpeakingAttemptResponse {
  SpeakingAttempt attempt = 1;
}

// === L12.3 — immersion player ===

// ImmersionClip = one piece of native-context audio with transcript.
// audio_url is empty until R2 ingestion lands — clients render the
// transcript today and surface "audio coming soon" honestly.
message ImmersionClip {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string description = 5;
  string transcript = 6;
  string translation = 7;
  string audio_url = 8;
  int32 duration_seconds = 9;
  string source_note = 10;
  bool completed = 11; // per-user, populated by ListTodayImmersion
}

message ListTodayImmersionRequest {
  string language = 1;
  string cefr_level = 2; // e.g. 'A2'
}
message ListTodayImmersionResponse {
  repeated ImmersionClip clips = 1;
}

message MarkImmersionCompletedRequest {
  string clip_id = 1;
}
message MarkImmersionCompletedResponse {
  ImmersionClip clip = 1;
}

// === L12.2 — today's plan ===

// DailyPlan = the three blocks of today for one (user, language).
// done_unix == 0 means "not yet done"; a non-zero value is the
// stamp from the backend.
message DailyPlan {
  string language = 1;
  string plan_date = 2; // ISO YYYY-MM-DD
  int64 warmup_done_unix = 3;
  int64 immersion_done_unix = 4;
  int64 output_done_unix = 5;

  // L12.2 block bodies — the server picks a today-specific anchor
  // for each block. All three are optional; client renders the
  // fallback structural prompt when empty.
  string warmup_message = 6; // canned message for the warm-up block
  string immersion_clip_id = 7; // lexicon_immersion_clips row
  string immersion_clip_title = 8;
  string speaking_prompt_id = 9; // lexicon_speaking_prompts row
  string speaking_prompt_phrase = 10;
}

message GetTodayPlanRequest {
  string language = 1;
}
message GetTodayPlanResponse {
  DailyPlan plan = 1;
}

message MarkPlanBlockRequest {
  string language = 1;
  string block = 2; // 'warmup' | 'immersion' | 'output'
}
message MarkPlanBlockResponse {
  DailyPlan plan = 1;
}

// === L12.1 — CEFR placement test ===

// PlacementQuestion is one multiple-choice question seeded in
// lexicon_placement_questions. Audio URL is empty for non-listening
// skills; clients skip questions whose audio_url is empty for the
// listening skill (the immersion player wires real audio in L12.3).
message PlacementQuestion {
  string id = 1;
  string language = 2;
  string skill = 3;
  string cefr_target = 4; // 'A1'..'C2'
  string prompt = 5;
  repeated string options = 6;
  string audio_url = 7;
}

// PlacementAnswer is one row sent back. selected_index < 0 means
// the user skipped the question.
message PlacementAnswer {
  string question_id = 1;
  int32 selected_index = 2;
}

message ListPlacementQuestionsRequest {
  string language = 1;
  string skill = 2;
}
message ListPlacementQuestionsResponse {
  repeated PlacementQuestion questions = 1;
}

message SubmitPlacementResultRequest {
  string language = 1;
  string skill = 2;
  repeated PlacementAnswer answers = 3;
}

message PlacementResult {
  string language = 1;
  string skill = 2;
  string cefr_level = 3;
  int32 raw_score = 4;
  int32 total = 5;
  string completed_at = 6;
}

message SubmitPlacementResultResponse {
  PlacementResult result = 1;
}

message ListMyPlacementResultsRequest {}
message ListMyPlacementResultsResponse {
  repeated PlacementResult results = 1;
}

// === L12.9 — writing drill + AI rough correction ===

message WritingPrompt {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string prompt = 5;
  int32 min_words = 6;
  int32 max_words = 7;
}

// RubricScore is one CEFR-aligned scoring dimension of a writing
// submission (task achievement / coherence / lexical range / accuracy).
message RubricScore {
  string dimension = 1;
  int32 score = 2; // 0..100
  string comment = 3;
}

// WritingSubmission status: 'corrected' = Gemini rough correction ran,
// 'heuristic' = provider unavailable so a deterministic local rubric was
// applied, 'pending' = not yet scored.
message WritingSubmission {
  string id = 1;
  string prompt_id = 2;
  string language = 3;
  string content = 4;
  string status = 5;
  string corrected_markdown = 6;
  repeated RubricScore rubric = 7;
  int32 score = 8;
  int64 created_unix = 9;
  int64 updated_unix = 10;
}

message ListWritingPromptsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListWritingPromptsResponse {
  repeated WritingPrompt prompts = 1;
}

message SubmitWritingRequest {
  string prompt_id = 1;
  string content = 2;
}
message SubmitWritingResponse {
  WritingSubmission submission = 1;
}

message ListMyWritingSubmissionsRequest {
  string language = 1;
}
message ListMyWritingSubmissionsResponse {
  repeated WritingSubmission submissions = 1;
}

message GetWritingSubmissionRequest {
  string submission_id = 1;
}
message GetWritingSubmissionResponse {
  WritingSubmission submission = 1;
}

// === L12.10 — reading library (parallel text) ===

message ReadingText {
  string id = 1;
  string language = 2;
  string cefr_target = 3;
  string title = 4;
  string summary = 5;
  string body = 6; // target language
  string translation = 7; // native-language parallel
  string source_note = 8;
  int32 word_count = 9;
}

message ListReadingTextsRequest {
  string language = 1;
  string cefr_level = 2;
}
message ListReadingTextsResponse {
  repeated ReadingText texts = 1;
}

message GetReadingTextRequest {
  string text_id = 1;
}
message GetReadingTextResponse {
  ReadingText text = 1;
}

// === L12.11 — idiom library ===

message Idiom {
  string id = 1;
  string language = 2;
  string phrase = 3;
  string literal = 4;
  string meaning = 5;
  string example = 6;
  string register = 7; // formal | informal | slang
  string note = 8;
}

message ListIdiomsRequest {
  string language = 1;
}
message ListIdiomsResponse {
  repeated Idiom idioms = 1;
}

// === L12.12 — tutor desk / concierge (Sovereign) ===

message TutorThread {
  string id = 1;
  string language = 2;
  string topic = 3;
  string status = 4; // open | answered | closed
  int64 created_unix = 5;
  int64 sla_due_unix = 6;
  repeated TutorMessage messages = 7;
}

message TutorMessage {
  string id = 1;
  string sender = 2; // member | tutor | system
  string body = 3;
  int64 created_unix = 4;
}

message StartTutorThreadRequest {
  string language = 1;
  string topic = 2;
  string body = 3;
}
message StartTutorThreadResponse {
  TutorThread thread = 1;
}

message ListMyTutorThreadsRequest {}
message ListMyTutorThreadsResponse {
  repeated TutorThread threads = 1;
}

message GetTutorThreadRequest {
  string thread_id = 1;
}
message GetTutorThreadResponse {
  TutorThread thread = 1;
}

message PostTutorMessageRequest {
  string thread_id = 1;
  string body = 2;
}
message PostTutorMessageResponse {
  TutorThread thread = 1;
}

// === L12.13 — editorial Anthology ===

message AnthologyArticle {
  string id = 1;
  string slug = 2;
  string language = 3;
  string title = 4;
  string author = 5;
  string author_title = 6;
  string dek = 7;
  string body_markdown = 8;
  bool sovereign_only = 9;
  int64 published_unix = 10;
}

message ListAnthologyArticlesRequest {
  string language = 1;
}
message ListAnthologyArticlesResponse {
  repeated AnthologyArticle articles = 1;
}

message GetAnthologyArticleRequest {
  string article_id = 1;
}
message GetAnthologyArticleResponse {
  AnthologyArticle article = 1;
}

// === L12.14 — CEFR certificate issuance + verification ===

message Certificate {
  string id = 1;
  string token = 2; // public verification token
  string language = 3;
  string skill = 4;
  string cefr_level = 5;
  string holder_name = 6;
  int64 issued_unix = 7;
  string verify_url = 8;
}

// IssueCertificate mints a signed CEFR certificate from the user's best
// placement result for (language, skill). Rejects when no qualifying
// result exists.
message IssueCertificateRequest {
  string language = 1;
  string skill = 2;
}
message IssueCertificateResponse {
  Certificate certificate = 1;
}

message ListMyCertificatesRequest {}
message ListMyCertificatesResponse {
  repeated Certificate certificates = 1;
}

// === L12.15 — Annual Linguist Almanac (PDF) ===

message GenerateLinguistAlmanacRequest {}
message GenerateLinguistAlmanacResponse {
  string url = 1;
  int32 page_count = 2;
}

// === L12.16 — public Linguist profile share ===

message CreateLinguistShareRequest {}
message CreateLinguistShareResponse {
  string token = 1;
  string share_url = 2;
}

service LanguagesService {
  // The Protocol: Scenario-based learning
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);
  rpc CompleteInteraction(CompleteInteractionRequest) returns (CompleteInteractionResponse);

  // Status
  rpc GetLinguistStats(GetLinguistStatsRequest) returns (GetLinguistStatsResponse);

  // L12.1 — CEFR placement.
  rpc ListPlacementQuestions(ListPlacementQuestionsRequest) returns (ListPlacementQuestionsResponse);
  rpc SubmitPlacementResult(SubmitPlacementResultRequest) returns (SubmitPlacementResultResponse);
  rpc ListMyPlacementResults(ListMyPlacementResultsRequest) returns (ListMyPlacementResultsResponse);

  // L12.2 — today's plan (three-block daily).
  rpc GetTodayPlan(GetTodayPlanRequest) returns (GetTodayPlanResponse);
  rpc MarkPlanBlock(MarkPlanBlockRequest) returns (MarkPlanBlockResponse);

  // L12.3 — immersion player.
  rpc ListTodayImmersion(ListTodayImmersionRequest) returns (ListTodayImmersionResponse);
  rpc MarkImmersionCompleted(MarkImmersionCompletedRequest) returns (MarkImmersionCompletedResponse);

  // L12.4 — speaking drill + Whisper.
  rpc ListSpeakingPrompts(ListSpeakingPromptsRequest) returns (ListSpeakingPromptsResponse);
  rpc CreateSpeakingAttempt(CreateSpeakingAttemptRequest) returns (CreateSpeakingAttemptResponse);
  rpc GetSpeakingAttempt(GetSpeakingAttemptRequest) returns (GetSpeakingAttemptResponse);

  // L12.6 — multilingual.
  rpc ListMyLanguages(ListMyLanguagesRequest) returns (ListMyLanguagesResponse);
  rpc AddMyLanguage(AddMyLanguageRequest) returns (AddMyLanguageResponse);
  rpc RemoveMyLanguage(RemoveMyLanguageRequest) returns (RemoveMyLanguageResponse);
  rpc SetMyPrimaryLanguage(SetMyPrimaryLanguageRequest) returns (SetMyPrimaryLanguageResponse);

  // L12.7 — cultural modules.
  rpc ListCulturalModules(ListCulturalModulesRequest) returns (ListCulturalModulesResponse);
  rpc MarkCulturalCompleted(MarkCulturalCompletedRequest) returns (MarkCulturalCompletedResponse);

  // L12.9 — writing drill + AI rough correction.
  rpc ListWritingPrompts(ListWritingPromptsRequest) returns (ListWritingPromptsResponse);
  rpc SubmitWriting(SubmitWritingRequest) returns (SubmitWritingResponse);
  rpc ListMyWritingSubmissions(ListMyWritingSubmissionsRequest) returns (ListMyWritingSubmissionsResponse);
  rpc GetWritingSubmission(GetWritingSubmissionRequest) returns (GetWritingSubmissionResponse);

  // L12.10 — reading library (parallel text).
  rpc ListReadingTexts(ListReadingTextsRequest) returns (ListReadingTextsResponse);
  rpc GetReadingText(GetReadingTextRequest) returns (GetReadingTextResponse);

  // L12.11 — idiom library.
  rpc ListIdioms(ListIdiomsRequest) returns (ListIdiomsResponse);

  // L12.12 — tutor desk / concierge (Sovereign).
  rpc StartTutorThread(StartTutorThreadRequest) returns (StartTutorThreadResponse);
  rpc ListMyTutorThreads(ListMyTutorThreadsRequest) returns (ListMyTutorThreadsResponse);
  rpc GetTutorThread(GetTutorThreadRequest) returns (GetTutorThreadResponse);
  rpc PostTutorMessage(PostTutorMessageRequest) returns (PostTutorMessageResponse);

  // L12.13 — editorial Anthology.
  rpc ListAnthologyArticles(ListAnthologyArticlesRequest) returns (ListAnthologyArticlesResponse);
  rpc GetAnthologyArticle(GetAnthologyArticleRequest) returns (GetAnthologyArticleResponse);

  // L12.14 — CEFR certificate issuance.
  rpc IssueCertificate(IssueCertificateRequest) returns (IssueCertificateResponse);
  rpc ListMyCertificates(ListMyCertificatesRequest) returns (ListMyCertificatesResponse);

  // L12.15 — Annual Linguist Almanac.
  rpc GenerateLinguistAlmanac(GenerateLinguistAlmanacRequest) returns (GenerateLinguistAlmanacResponse);

  // L12.16 — public Linguist profile share.
  rpc CreateLinguistShare(CreateLinguistShareRequest) returns (CreateLinguistShareResponse);

  // L13 — the practice engine. Spaced repetition over a concept/lexeme corpus,
  // which is the learning loop the app was missing entirely: the Today plan's
  // three blocks were self-report checkboxes and lexicon_progress was never
  // read or written by anything.
  rpc GetPracticeSession(GetPracticeSessionRequest) returns (GetPracticeSessionResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc GetPracticeStats(GetPracticeStatsRequest) returns (GetPracticeStatsResponse);
  rpc GetMemberPrefs(GetMemberPrefsRequest) returns (GetMemberPrefsResponse);
  rpc SetMemberPrefs(SetMemberPrefsRequest) returns (SetMemberPrefsResponse);

  // Legacy (Deprecated but kept for bridge)
  rpc ListWords(ListWordsRequest) returns (ListWordsResponse);
}

// ============================================================================
// L13 — practice engine
// ============================================================================

// Exercise escalates as an item strengthens: recognition first, production
// last. The same lexeme is drilled a different way each time it comes due.
enum ExerciseKind {
  EXERCISE_KIND_UNSPECIFIED = 0;
  EXERCISE_KIND_RECOGNISE = 1; // see target language, choose meaning
  EXERCISE_KIND_RECALL = 2;    // see meaning, choose target language
  EXERCISE_KIND_LISTEN = 3;    // hear it, choose meaning
  EXERCISE_KIND_CLOZE = 4;     // fill the gap in a real sentence
  EXERCISE_KIND_TYPE = 5;      // produce it from memory, typed
  EXERCISE_KIND_SPEAK = 6;     // produce it aloud
}

// One thing to answer. `prompt` is always written in the member's base
// language or the target, depending on kind; the client never has to decide.
message PracticeCard {
  string lexeme_id = 1;
  string concept_id = 2;
  ExerciseKind exercise = 3;
  // What the member is shown.
  string prompt = 4;
  // Supporting line under the prompt (a sentence, a gloss). May be empty.
  string prompt_detail = 5;
  // Multiple-choice options; empty for TYPE and SPEAK.
  repeated string options = 6;
  // Index into `options`. Sent so the client can grade instantly and show the
  // answer without a round trip; the server re-grades authoritatively on
  // SubmitAnswer and its verdict is the one that is recorded.
  int32 correct_index = 7;
  // The canonical written answer, revealed after the member answers.
  string answer = 8;
  string answer_detail = 9;
  string audio_url = 10;
  string ipa = 11;
  // SRS state, for the strength bar.
  int32 strength = 12;
  bool is_new = 13;
  string target_language = 14;
  string base_language = 15;
}

message GetPracticeSessionRequest {
  // The language being learned.
  string language = 1;
  // How many cards to build. Server clamps to a sane range.
  int32 limit = 2;
}
message GetPracticeSessionResponse {
  repeated PracticeCard cards = 1;
  int32 due_count = 2;
  int32 new_count = 3;
  // True when the corpus has nothing for this language, which is a content
  // gap and must not be dressed up as "you are all caught up".
  bool corpus_empty = 4;
}

message SubmitAnswerRequest {
  string lexeme_id = 1;
  ExerciseKind exercise = 2;
  string answer_given = 3;
  // Client-side grading is advisory; the server decides.
  bool client_correct = 4;
  int32 elapsed_ms = 5;
  string language = 6;
}
message SubmitAnswerResponse {
  bool correct = 1;
  // The answer as it should have been given.
  string expected = 2;
  int32 strength = 3;
  // When this item comes back.
  google.protobuf.Timestamp due_at = 4;
  int32 reviews_done_today = 5;
  int32 new_learned_today = 6;
}

message GetPracticeStatsRequest {
  string language = 1;
}
message GetPracticeStatsResponse {
  int32 due_now = 1;
  int32 learning = 2;
  int32 mastered = 3;
  int32 total_seen = 4;
  int32 corpus_size = 5;
  int32 reviews_today = 6;
  int32 new_today = 7;
  int32 streak_days = 8;
}

message MemberPrefs {
  string base_language = 1;
  int32 daily_new_target = 2;
  int32 daily_review_target = 3;
}
message GetMemberPrefsRequest {}
message GetMemberPrefsResponse { MemberPrefs prefs = 1; }
message SetMemberPrefsRequest { MemberPrefs prefs = 1; }
message SetMemberPrefsResponse { MemberPrefs prefs = 1; }

// Deprecated Word-based messages (for transition)
message Word {
  string id = 1;
  string payload_json = 2;
}
message ListWordsRequest {
  sttattus.common.v1.PageRequest page = 1;
}
message ListWordsResponse {
  repeated Word words = 1;
}
