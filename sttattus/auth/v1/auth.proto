syntax = "proto3";

package sttattus.auth.v1;

option go_package = "github.com/sttattus/proto/gen/go/sttattus/auth/v1;authv1";

// Which app a credential is being used in. Drives `app_grants` so the admin can
// see "this user uses workout + dating" and so cross-app linking can record the
// new app the user just joined.
enum AppCode {
  APP_CODE_UNSPECIFIED = 0;
  APP_CODE_FORGE = 1;
  APP_CODE_LEXICON = 2;
  APP_CODE_NOMAD = 3;
  APP_CODE_ATLAS = 4;
  APP_CODE_EMPIRE = 5;
  APP_CODE_ONYX = 6;
  APP_CODE_APEX = 7;
  APP_CODE_VAULT = 8;
  APP_CODE_DOMINION = 9;
  APP_CODE_ORACLE = 10;
  APP_CODE_LEGACY = 11;
  APP_CODE_ZENITH = 12;
}

enum AuthProvider {
  AUTH_PROVIDER_UNSPECIFIED = 0;
  AUTH_PROVIDER_GOOGLE = 1;
  AUTH_PROVIDER_FACEBOOK = 2;
  AUTH_PROVIDER_GITHUB = 3;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3; // unix seconds
  int64 refresh_expires_at = 4; // unix seconds
}

// Lightweight profile snapshot the client renders in the "we found your
// profile" linking UI. Never contains the password hash or anything secret.
message ProfileHint {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  repeated AppCode linked_apps = 5;
  bool has_password = 6;
  repeated AuthProvider linked_providers = 7;
  string locale = 8;
}

// ===== Register =====
message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  AppCode app_code = 4;
}

message RegisterResponse {
  // Populated when registration succeeded.
  string user_id = 1;
  TokenPair tokens = 2;
  ProfileHint profile = 3;

  // Populated when the email already exists in the ecosystem and the client
  // should switch into the link-app flow. When this is set, `user_id` and
  // `tokens` are empty and the gRPC status is OK (the *call* succeeded; the
  // outcome is "needs linking"). Allows the client to render the linking UI
  // without crashing on an error.
  ProfileHint existing_profile = 4;
}

// ===== Login =====
message LoginRequest {
  string email = 1;
  string password = 2;
  AppCode app_code = 3;

  // A device the member previously chose to trust. When it is still valid the
  // second factor is skipped for this sign-in.
  string trusted_device_token = 4;
}

message LoginResponse {
  string user_id = 1;

  // Empty when two_factor_required is true. No usable token is ever issued
  // before the second factor is verified — a half-authenticated session is
  // the thing 2FA exists to prevent.
  TokenPair tokens = 2;
  ProfileHint profile = 3;

  // The password was correct, and this member has 2FA enabled. Send the
  // challenge back with a code to VerifyTwoFactor.
  bool two_factor_required = 4;
  string two_factor_token = 5;
}

// ===== Second factor =====
//
// The twelve apps used to sign in with an email and a password alone, while
// the members site enforced TOTP. A member with 2FA enabled could open any
// app and skip it — which defeats the one thing 2FA is for, a stolen
// password. Verified in production on 2026-08-21: apps@sttattus.com has
// two_factor_enabled = true and hub_two_factor holds their enrolled secret.
//
// Enrolment stays on the web. These RPCs only enforce what is already there,
// against the same secret the member's authenticator already holds, so
// nobody has to re-enrol.
message VerifyTwoFactorRequest {
  string two_factor_token = 1;

  // A six-digit TOTP code, or one of the member's backup codes. A backup code
  // is consumed on use, and the web sees it consumed — the two share storage.
  string code = 2;

  // Remember this device and skip the second factor next time.
  bool trust_device = 3;
  // Shown to the member when they review their trusted devices.
  string device_label = 4;
}

message VerifyTwoFactorResponse {
  string user_id = 1;
  TokenPair tokens = 2;
  ProfileHint profile = 3;

  // Present only when trust_device was set. Store it and send it as
  // LoginRequest.trusted_device_token.
  string trusted_device_token = 4;
}

// ===== OAuth Login =====
message OAuthLoginRequest {
  AuthProvider provider = 1;
  string id_token = 2;
  AppCode app_code = 3;
}

message OAuthLoginResponse {
  string user_id = 1;
  TokenPair tokens = 2;
  ProfileHint profile = 3;
  ProfileHint existing_profile = 4;
}

// ===== CheckEmail =====
// Idempotent lookup so the client can render the "we found your profile" hint
// before the user submits the registration form.
message CheckEmailRequest {
  string email = 1;
}

message CheckEmailResponse {
  bool exists = 1;
  ProfileHint hint = 2;
}

// ===== LinkApp =====
// The cross-app linking RPC. Verifies the existing password and adds an
// app_grants row.
message LinkAppRequest {
  string email = 1;
  string password = 2;
  AppCode app_code = 3;
}

message LinkAppResponse {
  string user_id = 1;
  TokenPair tokens = 2;
  ProfileHint profile = 3;
}

// ===== LinkProvider =====
message LinkProviderRequest {
  AuthProvider provider = 1;
  string id_token = 2;
}

message LinkProviderResponse {}

// ===== SetPassword =====
message SetPasswordRequest {
  string new_password = 1;
}

message SetPasswordResponse {}

// ===== ForgotPassword =====
message ForgotPasswordRequest {
  string email_or_handle = 1;
}

message ForgotPasswordResponse {}

// ===== ResetPassword =====
message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

// ===== Refresh =====
message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

// ===== Logout =====
message LogoutRequest {
  string refresh_token = 1;
}

// ===== ExchangeOAuthHandoff =====
// Redeems the single-use code a completed browser sign-in deep-links back into
// the app.
//
// This exists because the alternative — putting the token pair in the deep-link
// URL — hands the session to anything that can register the same custom scheme,
// and to whatever logs that URL. The code is 256 bits of randomness, single-use,
// and valid for two minutes; it is spent here over TLS instead.
//
// Unauthenticated by necessity: this is how a signed-out member obtains a
// token. Safe for the same reason Login is — possession of a secret this server
// issued after verifying an identity with the provider.
message ExchangeOAuthHandoffRequest {
  string code = 1;
  AppCode app_code = 2;
}
message ExchangeOAuthHandoffResponse {
  string user_id = 1;
  TokenPair tokens = 2;
  ProfileHint profile = 3;
}

message LogoutResponse {}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyTwoFactor(VerifyTwoFactorRequest) returns (VerifyTwoFactorResponse);
  // OAuthLogin is the legacy id_token shape. It never verified anything and
  // cannot serve GitHub, which issues no id_token at all. Superseded by the
  // browser flow at /oauth/mobile/start plus ExchangeOAuthHandoff.
  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
  rpc ExchangeOAuthHandoff(ExchangeOAuthHandoffRequest) returns (ExchangeOAuthHandoffResponse);
  rpc CheckEmail(CheckEmailRequest) returns (CheckEmailResponse);
  rpc LinkApp(LinkAppRequest) returns (LinkAppResponse);
  rpc LinkProvider(LinkProviderRequest) returns (LinkProviderResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
